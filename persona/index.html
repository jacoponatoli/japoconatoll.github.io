<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PERSONA</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:ui-monospace,Menlo,monospace;color:#ddd}
  canvas{display:block;width:100vw;height:100vh}
  #status{position:fixed;top:50%;left:0;right:0;text-align:center;font-size:13px;letter-spacing:.2em;text-transform:uppercase;opacity:.7;pointer-events:none}
  #panel{position:fixed;left:16px;bottom:16px;background:rgba(0,0,0,.75);border:1px solid #333;padding:12px 14px;font-size:12px;line-height:1.9;transition:opacity .6s}
  #panel.hide{opacity:0;pointer-events:none}
  #panel label{display:flex;gap:10px;align-items:center;justify-content:space-between}
  #panel input[type=range]{width:140px}
  #panel select{width:140px;background:#111;color:#ddd;border:1px solid #555;font:inherit;padding:2px}
  #panel button{background:#111;color:#ddd;border:1px solid #555;padding:4px 10px;font:inherit;cursor:pointer;margin-top:6px}
  #panel button.on{background:#ddd;color:#000}
  .k{opacity:.5}
  body.idle{cursor:none}
  #optBtn{position:fixed;left:16px;bottom:14px;background:none;border:0;color:#fff;opacity:.55;font:12px ui-monospace,Menlo,monospace;letter-spacing:.15em;cursor:pointer;padding:4px;z-index:2;transition:opacity .4s}
  #optBtn:hover{opacity:1}
  body.idle #optBtn{opacity:0}
  #panel{bottom:44px}
  #panel .row{display:flex;gap:10px;align-items:center;justify-content:space-between}
  #autoOpts{border-top:1px solid #333;margin-top:4px;padding-top:4px}
  #autoOpts[hidden]{display:none}
  #flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:4}
  #shot{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:5;font-size:12px;letter-spacing:.12em}
  #shot[hidden]{display:none}
  #shotWrap{position:relative;width:min(70vh,80vw);aspect-ratio:1}
  #shotWrap canvas,#shotWrap svg{position:absolute;inset:0;width:100%;height:100%}
  #shotCount{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;color:#fff;pointer-events:none}
  #shotFlash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .5s}
  #shot button{background:none;color:#fff;border:1px solid #777;padding:6px 14px;font:inherit;letter-spacing:.12em;cursor:pointer;margin:0 4px}
  #shot button:hover{border-color:#fff}
  #shot .k{max-width:min(70vh,80vw);text-align:center;line-height:1.6}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="status">loading faces…</div>
<video id="v" playsinline muted style="display:none"></video>

<div id="shot" hidden>
  <div id="shotMsg">put your eyes in the circles</div>
  <div id="shotWrap">
    <canvas id="shotCv" width="640" height="640"></canvas>
    <svg viewBox="0 0 100 100" preserveAspectRatio="none"><ellipse cx="50" cy="50" rx="27" ry="36" fill="none" stroke="#fff" stroke-width=".35" stroke-dasharray="1.2 1.2" opacity=".8"/>
      <!-- occhi: stessa posizione media degli occhi nei volti del flusso (misurata su 200 volti) -->
      <g fill="none" stroke="#fff" stroke-width=".35" opacity=".95"><circle cx="37.4" cy="46.5" r="3.6"/><circle cx="62.6" cy="46.5" r="3.6"/></g>
      <g fill="#fff"><circle cx="37.4" cy="46.5" r=".45"/><circle cx="62.6" cy="46.5" r=".45"/></g></svg>
    <div id="shotCount"></div><div id="shotFlash"></div>
  </div>
  <div><button id="shotGo" type="button">take photo</button><button id="shotNo" type="button">cancel</button></div>
  <div class="k">Your photo joins PERSONA's archive of real faces and will reappear, at random, in the flow of faces that do not exist.</div>
</div>

<button id="optBtn" type="button">option</button>
<div id="flash"></div>
<div id="panel" class="hide">
  <label>mode <select id="modeSel"><option value="manual">manual</option><option value="auto">automatic (museum)</option></select></label>
  <div id="autoOpts" hidden>
    <label>precision <input id="autoPrec" type="range" min="1" max="12" value="6"></label>
    <label>presence <input id="autoPres" type="range" min="0" max="100" value="85"></label>
    <label>fade (s) <input id="autoFade" type="range" min="5" max="90" value="30"></label>
    <label class="row">loop <input id="autoLoop" type="checkbox" checked></label>
    <label class="row">show eyes <input id="autoEyes" type="checkbox"></label>
    <div class="k" id="autoInfo">automatic: loading…</div>
  </div>
  <label>speed <input id="speed" type="range" min="0" max="385" value="0"></label>
  <label>overlay <input id="alpha" type="range" min="2" max="60" value="30"></label>
  <label>you <input id="camAlpha" type="range" min="0" max="60" value="14"></label>
  <label>camera zoom <input id="camZoom" type="range" min="30" max="100" value="62"></label>
  <label>photo under <select id="baseSel"><option value="">none</option></select></label>
  <label>photo opacity <input id="baseAlpha" type="range" min="0" max="100" value="35"></label>
  <div id="dmxOpts" style="border-top:1px solid #333;margin-top:4px;padding-top:4px">
    <label>strobe <select id="dmxType"><option value="pro">Enttec DMX USB Pro</option><option value="open">Open DMX / FTDI cable</option></select></label>
    <label>DMX address <input id="dmxAddr" type="number" min="1" max="511" value="1" style="width:60px;background:#111;color:#ddd;border:1px solid #555;font:inherit"></label>
    <label>flash power <input id="dmxPow" type="range" min="0" max="255" value="255"></label>
    <label>flash speed <input id="dmxSpeed" type="range" min="0" max="230" value="200"></label>
    <label>flash length (ms) <input id="dmxLen" type="range" min="40" max="3000" value="350"></label>
    <button id="dmxBtn" type="button">connect strobe</button> <button id="dmxTest" type="button">test flash</button>
    <div class="k" id="dmxInfo">strobe: not connected</div>
  </div>
  <button id="camBtn">camera on</button>
  <button id="photoBtn">photo</button>
  <button id="fsBtn">fullscreen</button>
  <div class="k">F or double click fullscreen · C camera · P photo · O option</div>
  <div class="k" id="poolInfo"></div>
</div>

<script>
const SRC = 'https://thispersondoesnotexist.com/random-person.jpeg';
const POOL_MAX = 80;      // volti tenuti in memoria
const FETCH_EVERY = 400;  // ms tra una richiesta e l'altra
const PARALLEL = 3;

const cv = document.getElementById('c'), dctx = cv.getContext('2d');
const acc = document.createElement('canvas'), ctx = acc.getContext('2d');   // il flusso si accumula qui, poi va sullo schermo
const statusEl = document.getElementById('status'), panel = document.getElementById('panel');
const video = document.getElementById('v');
const $ = id => document.getElementById(id);

let pool = [], inflight = 0, fails = 0, loaded = 0, camOn = false;

function resize(){ acc.width = cv.width = innerWidth * devicePixelRatio; acc.height = cv.height = innerHeight * devicePixelRatio;
  ctx.fillStyle='#000'; ctx.fillRect(0,0,cv.width,cv.height); }
addEventListener('resize', resize); resize();

// --- flusso di volti nuovi ---
// archivio: volti scaricati ogni 2 ore da GitHub (ramo persona-faces)
const ARCHIVE = 'https://raw.githubusercontent.com/jacoponatoli/japoconatoll.github.io/persona-faces/';
let archive = [], newArch = [], liveOK = true, liveFails = 0;
function loadArchive(){                       // la lista si rilegge ogni 10 minuti: i volti appena raccolti entrano per primi
  fetch(ARCHIVE + 'list.json?' + Date.now()).then(r => r.json()).then(l => {
    if (archive.length){ const old = new Set(archive); newArch.push(...l.filter(n => !old.has(n))); }
    archive = l;
  }).catch(()=>{});
}
loadArchive(); setInterval(loadArchive, 10*60*1000);

function fetchFace(){
  if (inflight >= PARALLEL) return;
  // prova il sito dal vivo; se non risponde usa l'archivio
  const useLive = liveOK && (Math.random() < 0.75 || !archive.length);   // soprattutto volti appena generati
  if (!useLive && !archive.length) return;
  inflight++;
  const img = new Image();
  img.referrerPolicy = 'no-referrer';
  img.onload = () => { inflight--; loaded++; fails = 0; if (useLive) liveFails = 0;
    pool.push(img); if (pool.length > POOL_MAX) pool.shift(); };
  img.onerror = () => { inflight--; fails++;
    if (useLive && ++liveFails >= 3 && liveOK){ liveOK = false;       // il sito non risponde: archivio, e si riprova tra un minuto
      setTimeout(() => { liveOK = true; liveFails = 0; }, 60000); }
    if (fails > 12 && !pool.length) statusEl.textContent = 'no faces yet'; };
  img.src = useLive
    ? SRC + '?' + Date.now() + Math.random().toString(36).slice(2)
    : ARCHIVE + (newArch.length ? newArch.shift() : archive[Math.floor(Math.random()*archive.length)]);
}
for (let i=0;i<PARALLEL;i++) fetchFace();
setInterval(fetchFace, FETCH_EVERY);

// --- camera (solo su richiesta) ---
async function toggleCam(){
  if (camOn){ video.srcObject?.getTracks().forEach(t=>t.stop()); video.srcObject=null; camOn=false; }
  else {
    try{
      const s = await navigator.mediaDevices.getUserMedia({video:{width:1280,height:720,facingMode:'user'},audio:false});
      video.srcObject = s; await video.play(); camOn = true;
    }catch(e){ alert('Camera not available: ' + e.message); }
  }
  $('camBtn').classList.toggle('on', camOn);
  $('camBtn').textContent = camOn ? 'camera off' : 'camera on';
}

// --- disegno: ogni passo un nuovo volto si deposita sugli altri ---
let last = 0;
function frame(t){
  requestAnimationFrame(frame);
  if (mode === 'auto') autoStep(t);
  const interval = 400 - $('speed').value;   // a destra = più veloce
  if (t - last >= interval && (pool.length >= 2 || camOn)) { last = t; step(); }
  compose(t);
}
function step(){
  statusEl.style.display = 'none';

  const W = cv.width, H = cv.height, S = Math.min(W,H), x = (W-S)/2, y = (H-S)/2;

  const now = performance.now();
  let img = null;
  if (spotlight && now < spotlight.until && Math.random() < 0.35) img = spotlight.img;      // la foto appena fatta resta presente
  else if (real.length && mode !== 'auto' && Math.random() < REAL_P) img = real[Math.floor(Math.random()*real.length)];
  else if (pool.length) img = pool[Math.floor(Math.random()*pool.length)];
  if (img){
    ctx.globalAlpha = $('alpha').value/100;
    ctx.drawImage(img, x, y, S, S);
  }
  if (camOn && mode === 'manual' && video.readyState >= 2){
    const vw = video.videoWidth, vh = video.videoHeight;
    const s = Math.min(vw,vh) * $('camZoom').value/100;
    const sx = (vw - s)/2, sy = (vh - s)/2 - s*0.04;
    ctx.save(); ctx.globalAlpha = $('camAlpha').value/100;
    ctx.translate(x+S, y); ctx.scale(-1,1);           // specchio
    ctx.drawImage(video, sx, sy, s, s, 0, 0, S, S);
    ctx.restore();
  }
  ctx.globalAlpha = 1;
  $('poolInfo').textContent = `faces ${pool.length} · seen ${loaded} · real ${real.length}`;
}
requestAnimationFrame(frame);

// --- foto fissa "sotto": una foto scattata resta sempre presente, con la sua trasparenza ---
let base = null;
function compose(t){
  t = t || performance.now();
  dctx.globalAlpha = 1; dctx.drawImage(acc, 0, 0);
  if (base && base.complete){
    const W = cv.width, H = cv.height, S = Math.min(W,H);
    dctx.globalAlpha = $('baseAlpha').value/100;
    dctx.drawImage(base, (W-S)/2, (H-S)/2, S, S);
    dctx.globalAlpha = 1;
  }
  if (mode === 'auto') composeAuto(t);
}
const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
                set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };
function refreshBaseMenu(){
  const sel = $('baseSel'), cur = sel.value || store.get('persona-base') || '';
  const items = real.filter(im => im.dataset.key).sort((a,b) => b.dataset.key.localeCompare(a.dataset.key));
  sel.innerHTML = '<option value="">none</option>' + items.map((im,i) =>
    `<option value="${im.dataset.key}">${i===0 ? 'last photo' : 'photo ' + (items.length - i)}</option>`).join('');
  sel.value = items.some(im => im.dataset.key === cur) ? cur : '';
  base = items.find(im => im.dataset.key === sel.value) || null;
}
$('baseSel').onchange = () => { store.set('persona-base', $('baseSel').value); refreshBaseMenu(); compose(); };
$('baseAlpha').oninput = () => { store.set('persona-baseAlpha', $('baseAlpha').value); compose(); };
if (store.get('persona-baseAlpha')) $('baseAlpha').value = store.get('persona-baseAlpha');

// --- crescendo: parte lento, volti singoli e nitidi; in ~50 s accelera e si fonde in un volto unico ---
// (si ferma se tocchi i cursori in option)
const RAMP = { secs: 50, speed: [0, 355], alpha: [30, 5] };   // speed 355 = un volto ogni 45 ms
let rampOn = true, rampStart = null;
['speed','alpha'].forEach(id => $(id).addEventListener('input', () => rampOn = false));
(function ramp(t){
  if (!rampOn) return;
  if (pool.length < 2) { requestAnimationFrame(ramp); return; }   // aspetta i primi volti
  if (rampStart === null) rampStart = t;
  const k = Math.min(1, (t - rampStart) / (RAMP.secs*1000));
  const e = k*k*(3-2*k);                                           // morbido all'inizio e alla fine
  $('speed').value = RAMP.speed[0] + (RAMP.speed[1]-RAMP.speed[0])*e;
  $('alpha').value = RAMP.alpha[0] + (RAMP.alpha[1]-RAMP.alpha[0])*e;
  if (k < 1) requestAnimationFrame(ramp);
})(performance.now());

// --- volti reali: foto dei visitatori ---
// Restano nel browser di questo computer (IndexedDB), così l'installazione accumula il suo archivio.
// Se SUPA_URL e SUPA_KEY sono compilati, vanno anche nell'archivio condiviso online (Supabase Storage, bucket "persona-real").
const SUPA_URL = '';   // es. 'https://xxxx.supabase.co'
const SUPA_KEY = '';   // chiave "anon public"
const BUCKET = 'persona-real';
const REAL_P = 0.12;   // probabilità che il prossimo volto sia una persona reale
let real = [], spotlight = null;

const REAL_MAX = 300;   // volti reali tenuti in memoria (l'archivio sul disco li conserva tutti)
function pushReal(im){
  real.push(im);
  if (real.length > REAL_MAX){ const i = Math.floor(Math.random()*(real.length - 50));
    if (real[i] !== base && real[i] !== (spotlight && spotlight.img)) real.splice(i,1); }
  refreshBaseMenu();
}
function addReal(src, key){ const im = new Image(); im.crossOrigin = 'anonymous'; if (key) im.dataset.key = key;
  im.onload = () => pushReal(im); im.src = src; return im; }

// archivio locale
let db = null;
try {
  const rq = indexedDB.open('persona', 1);
  rq.onupgradeneeded = () => rq.result.createObjectStore('real', { autoIncrement: true });
  rq.onsuccess = () => { db = rq.result;
    const cur = db.transaction('real').objectStore('real').openCursor(null, 'prev');   // i più recenti
    let n = 0;
    cur.onsuccess = e => { const c = e.target.result; if (c && n++ < REAL_MAX){ addReal(URL.createObjectURL(c.value.blob), 'L' + String(c.value.t).padStart(15,'0')); c.continue(); } };
  };
} catch(e){}
function saveLocal(blob, t){ try { db && db.transaction('real','readwrite').objectStore('real').add({ blob, t }); } catch(e){} }

// archivio condiviso
if (SUPA_URL && SUPA_KEY){
  fetch(`${SUPA_URL}/storage/v1/object/list/${BUCKET}`, { method:'POST',
    headers:{ apikey:SUPA_KEY, Authorization:`Bearer ${SUPA_KEY}`, 'Content-Type':'application/json' },
    body: JSON.stringify({ prefix:'', limit:1000, sortBy:{ column:'created_at', order:'desc' } }) })
  .then(r => r.json()).then(l => l.filter(o => /\.jpg$/.test(o.name)).forEach(o => addReal(`${SUPA_URL}/storage/v1/object/public/${BUCKET}/${o.name}`, 'S' + o.name)))
  .catch(()=>{});
}
function saveShared(blob){
  if (!SUPA_URL || !SUPA_KEY) return;
  const name = `${Date.now()}-${Math.random().toString(36).slice(2,8)}.jpg`;
  fetch(`${SUPA_URL}/storage/v1/object/${BUCKET}/${name}`, { method:'POST',
    headers:{ apikey:SUPA_KEY, Authorization:`Bearer ${SUPA_KEY}`, 'Content-Type':'image/jpeg' }, body: blob }).catch(()=>{});
}

// scatto
let shotOpen = false, camWasOn = false, counting = false;
const shotCv = $('shotCv'), sctx = shotCv.getContext('2d');
function camCrop(){ const vw = video.videoWidth, vh = video.videoHeight, s = Math.min(vw,vh) * $('camZoom').value/100;
  return [ (vw - s)/2, (vh - s)/2 - s*0.04, s ]; }
function drawPreview(){
  if (!shotOpen) return; requestAnimationFrame(drawPreview);
  if (video.readyState < 2) return;
  const [sx,sy,s] = camCrop();
  sctx.save(); sctx.translate(640,0); sctx.scale(-1,1); sctx.drawImage(video, sx,sy,s,s, 0,0,640,640); sctx.restore();
}
async function openShot(){
  if (shotOpen) return;
  camWasOn = camOn;
  if (!camOn) await toggleCam();
  if (!camOn) return;
  shotOpen = true; $('shot').hidden = false; panel.classList.add('hide'); drawPreview();
}
function closeShot(){
  shotOpen = false; $('shot').hidden = true; $('shotCount').textContent = '';
  if (!camWasOn && camOn) toggleCam();
}
// scatta dal quadrato della camera, salva (locale + condiviso), aggiunge ai volti reali
function captureBlob(done, opts){
  const out = document.createElement('canvas'); out.width = out.height = 640;
  const o = out.getContext('2d'), [sx,sy,s] = camCrop();
  o.translate(640,0); o.scale(-1,1); o.drawImage(video, sx,sy,s,s, 0,0,640,640);
  out.toBlob(blob => {
    const t = Date.now();
    const im = new Image(); im.dataset.key = 'L' + String(t).padStart(15,'0');
    im.onload = () => { if (!(opts && opts.archiveOnly)) pushReal(im); done && done(blob, im); };
    im.src = URL.createObjectURL(blob);
    saveLocal(blob, t); saveShared(blob);
  }, 'image/jpeg', 0.88);
}
async function takeShot(){
  if (counting) return; counting = true;
  for (const n of ['3','2','1']) { $('shotCount').textContent = n; await new Promise(r => setTimeout(r, 800)); }
  $('shotCount').textContent = '';
  strobeFlash();
  $('shotFlash').style.transition = 'none'; $('shotFlash').style.opacity = 1;
  requestAnimationFrame(() => { $('shotFlash').style.transition = 'opacity .6s'; $('shotFlash').style.opacity = 0; });
  captureBlob((blob, im) => {
    // appare intera sullo schermo, poi si scioglie nel flusso restando presente per un po'
    const W = cv.width, H = cv.height, S = Math.min(W,H);
    ctx.globalAlpha = 1; ctx.drawImage(im, (W-S)/2, (H-S)/2, S, S);
    spotlight = { img: im, until: performance.now() + 25000 };
  });
  counting = false;
  setTimeout(closeShot, 700);
}
$('photoBtn').onclick = openShot; $('shotGo').onclick = takeShot; $('shotNo').onclick = closeShot;

// ================= AUTOMATIC (museo) =================
// La camera è sempre accesa. Quando un volto si ferma davanti allo schermo diventa visibile
// tanto più quanto i suoi occhi coincidono con quelli del flusso. A occhi centrati: flash,
// la foto resta in primo piano, poi si dissolve e entra per sempre nel flusso.
const EYE_L = [0.374, 0.465], EYE_R = [0.626, 0.465];   // occhi medi dei volti del flusso
let mode = 'manual', landmarker = null, mpLoading = null, lastDet = 0;
let guideS = 0, face = null, alignS = 0, holdStart = 0, imprint = null, cooldownUntil = 0, lastFaceSeen = 0, needLeave = false;

async function loadLandmarker(){
  if (landmarker || mpLoading) return mpLoading;
  $('autoInfo').textContent = 'automatic: loading face tracking…';
  mpLoading = (async () => {
    const mp = await import('./mp/vision_bundle.mjs');
    const files = await mp.FilesetResolver.forVisionTasks(new URL('./mp/wasm', location.href).href);
    const opts = d => ({ baseOptions:{ modelAssetPath: new URL('./mp/face_landmarker.task', location.href).href, delegate:d },
                         runningMode:'VIDEO', numFaces:1 });
    try { landmarker = await mp.FaceLandmarker.createFromOptions(files, opts('GPU')); }
    catch(e){ landmarker = await mp.FaceLandmarker.createFromOptions(files, opts('CPU')); }
  })().catch(e => { $('autoInfo').textContent = 'automatic: face tracking not available (' + e.message + ')'; mpLoading = null; });
  return mpLoading;
}
async function setMode(m){
  mode = m; store.set('persona-mode', m);
  $('modeSel').value = m; $('autoOpts').hidden = m !== 'auto';
  if (m === 'auto'){ if (!camOn) await toggleCam(); loadLandmarker(); }
  else { face = null; alignS = 0; imprint = null; }
}
$('modeSel').onchange = () => setMode($('modeSel').value);
if (store.get('persona-fadeV2') !== '1'){ store.set('persona-autoFade', '30'); store.set('persona-fadeV2', '1'); }
['autoPrec','autoPres','autoFade'].forEach(id => {
  const v = store.get('persona-' + id); if (v) $(id).value = v;
  $(id).addEventListener('input', () => store.set('persona-' + id, $(id).value));
});
$('autoEyes').checked = store.get('persona-autoEyes') === '1';
$('autoLoop').checked = store.get('persona-autoLoop') !== '0';
$('autoLoop').onchange = () => { store.set('persona-autoLoop', $('autoLoop').checked ? '1' : '0'); if ($('autoLoop').checked) needLeave = false; };
$('autoEyes').onchange = () => store.set('persona-autoEyes', $('autoEyes').checked ? '1' : '0');

function toCrop(pt){   // landmark (0-1 sul video) -> coordinate 0-1 nel quadrato mostrato, specchiato
  const [sx,sy,s] = camCrop();
  return [ 1 - (pt.x*video.videoWidth - sx)/s, (pt.y*video.videoHeight - sy)/s ];
}
const dist = (a,b) => Math.hypot(a[0]-b[0], a[1]-b[1]);

function autoStep(t){
  if (!landmarker || !camOn || video.readyState < 2 || t - lastDet < 60) return;
  lastDet = t;
  let r; try { r = landmarker.detectForVideo(video, t); } catch(e){ return; }
  const lm = r && r.faceLandmarks && r.faceLandmarks[0];
  if (!lm){ face = null; }
  else {
    const a = toCrop(lm[468]), b = toCrop(lm[473]), nose = toCrop(lm[1]);
    const [eL, eR] = a[0] < b[0] ? [a,b] : [b,a];
    const err = (dist(eL,EYE_L) + dist(eR,EYE_R))/2 + 0.5*Math.abs(nose[0]-0.5);
    face = { eL, eR, nose, err };
    lastFaceSeen = t;
  }
  if (needLeave && t - lastFaceSeen > 2000) needLeave = false;   // la persona se n'è andata: si può scattare di nuovo
  const thr = $('autoPrec').value / 100;                           // precision 4 = errore medio sotto il 4% dello schermo
  const align = face ? Math.max(0, Math.min(1, 1 - (face.err - thr)/0.2)) : 0;   // pieno quando è centrato
  alignS += (align - alignS) * (face ? 0.3 : 0.15);
  const ready = !needLeave && t > cooldownUntil && !imprint;
  if (face && ready && face.err < thr){ if (!holdStart) holdStart = t; if (t - holdStart > 450) autoCapture(t); }
  else holdStart = 0;
  $('autoInfo').textContent = !landmarker ? 'automatic: loading…'
    : !face ? 'automatic: waiting for a face'
    : !ready ? (imprint ? 'automatic: fusing into the flow…' : $('autoLoop').checked ? 'automatic: camera coming back…' : 'automatic: captured · waiting for someone new')
    : `automatic: face · aligned ${Math.round(align*100)}%`;
}
function autoCapture(t){
  holdStart = 0;
  // loop: dopo la fusione la camera dal vivo torna e può catturare di nuovo, all'infinito.
  // senza loop: aspetta che la persona se ne vada.
  if ($('autoLoop').checked) cooldownUntil = t + $('autoFade').value*1000 + 1500;
  else { needLeave = true; cooldownUntil = t + 8000; }
  strobeFlash();
  captureBlob((blob, im) => {
    imprint = { img: im, t0: performance.now() };   // si dissolve e sparisce: niente ritorni nel flusso
  }, { archiveOnly: true });
  const f = $('flash'); f.style.transition = 'none'; f.style.opacity = 1;
  requestAnimationFrame(() => requestAnimationFrame(() => { f.style.transition = 'opacity 1.2s'; f.style.opacity = 0; }));
}
function composeAuto(t){
  const W = cv.width, H = cv.height, S = Math.min(W,H), x = (W-S)/2, y = (H-S)/2;
  // il visitatore dal vivo: più è centrato, più emerge dal flusso
  let live = $('autoPres').value/100 * Math.pow(alignS, 1.5);
  if (imprint) live *= 0.15 + 0.85 * Math.min(1, (t - imprint.t0) / ($('autoFade').value*1000));   // mentre la foto si scioglie, la camera dal vivo riaffiora
  if (camOn && live > 0.01 && video.readyState >= 2){
    const [sx,sy,s] = camCrop();
    dctx.save(); dctx.globalAlpha = live; dctx.translate(x+S, y); dctx.scale(-1,1);
    dctx.drawImage(video, sx,sy,s,s, 0,0,S,S); dctx.restore();
  }
  // la foto scattata: in primo piano, poi si dissolve nel flusso
  if (imprint && imprint.img.complete){
    const k = (t - imprint.t0) / ($('autoFade').value*1000);
    if (k >= 1) imprint = null;
    else {   // resta piena un attimo, poi si scioglie piano piano e sparisce nel flusso
      const a = k < .12 ? 1 : .5 + .5 * Math.cos(Math.PI * (k - .12) / .88);
      dctx.globalAlpha = a * a; dctx.drawImage(imprint.img, x, y, S, S);
    }
  }
  dctx.globalAlpha = 1;

  // guida per il visitatore: due pallini rossi all'altezza degli occhi del flusso.
  // Compaiono quando un volto si avvicina e diventano più rossi e più grandi man mano che gli occhi si allineano;
  // due puntini bianchi mostrano dove sono ora gli occhi del visitatore, con una linea sottile verso il bersaglio.
  const thrG = $('autoPrec').value/100;
  const near = face && !imprint ? Math.max(0, Math.min(1, 1 - (face.err - thrG)/0.35)) : 0;
  guideS += (near - guideS) * 0.2;
  if (guideS > 0.02){
    const ok = face && face.err < thrG;
    if (face && !ok){
      dctx.strokeStyle = `rgba(255,255,255,${0.35*guideS*(1-guideS*0.6)})`; dctx.lineWidth = Math.max(1, S/700);
      dctx.fillStyle = `rgba(255,255,255,${0.7*guideS})`;
      [[face.eL,EYE_L],[face.eR,EYE_R]].forEach(([e,g]) => {
        dctx.beginPath(); dctx.moveTo(x+e[0]*S, y+e[1]*S); dctx.lineTo(x+g[0]*S, y+g[1]*S); dctx.stroke();
        dctx.beginPath(); dctx.arc(x+e[0]*S, y+e[1]*S, S*0.006, 0, 7); dctx.fill(); });
    }
    const r = S*(0.009 + 0.014*guideS), red = ok ? 1 : guideS;
    [EYE_L, EYE_R].forEach(g => {
      dctx.fillStyle = `rgba(255,${Math.round(60*(1-red))},${Math.round(60*(1-red))},${0.25 + 0.75*guideS})`;
      dctx.beginPath(); dctx.arc(x+g[0]*S, y+g[1]*S, r, 0, 7); dctx.fill();
      if (ok){ dctx.strokeStyle = 'rgba(255,40,40,.8)'; dctx.lineWidth = Math.max(1, S/500);
        dctx.beginPath(); dctx.arc(x+g[0]*S, y+g[1]*S, r*2.2, 0, 7); dctx.stroke(); }
    });
  }

  if ($('autoEyes').checked){
    dctx.lineWidth = Math.max(1, S/400);
    dctx.strokeStyle = 'rgba(255,255,255,.8)';
    [EYE_L, EYE_R].forEach(e => { dctx.beginPath(); dctx.arc(x+e[0]*S, y+e[1]*S, S*0.036, 0, 7); dctx.stroke(); });
    if (face){ dctx.fillStyle = face.err < $('autoPrec').value/100 ? '#fff' : '#f33';
      [face.eL, face.eR, face.nose].forEach(e => { dctx.beginPath(); dctx.arc(x+e[0]*S, y+e[1]*S, S*0.006, 0, 7); dctx.fill(); }); }
  }
}

// ================= STROBO DMX =================
// Ayra Flash 60 LED: canale 1 = dimmer, canale 2 = velocità (in cima c'è il controllo sonoro: non lo usiamo).
// La pagina parla via USB con l'interfaccia DMX (Web Serial di Chrome).
const dmx = { port: null, writer: null, frame: new Uint8Array(513), type: 'pro', loop: false, offAt: 0 };
['dmxType','dmxAddr','dmxPow','dmxSpeed','dmxLen'].forEach(id => {
  const v = store.get('persona-' + id); if (v) $(id).value = v;
  $(id).addEventListener('input', () => store.set('persona-' + id, $(id).value));
});
function dmxSet(on){
  const a = Math.max(1, Math.min(511, +$('dmxAddr').value || 1));
  dmx.frame.fill(0);
  if (on){ dmx.frame[a] = +$('dmxPow').value; dmx.frame[a+1] = +$('dmxSpeed').value; }
  if (dmx.type === 'pro') dmxSendPro();
}
async function dmxSendPro(){                     // pacchetto Enttec "Output Only Send DMX" (label 6)
  if (!dmx.writer) return;
  const n = dmx.frame.length, pkt = new Uint8Array(n + 5);
  pkt[0] = 0x7E; pkt[1] = 6; pkt[2] = n & 255; pkt[3] = n >> 8; pkt.set(dmx.frame, 4); pkt[n+4] = 0xE7;
  try { await dmx.writer.write(pkt); } catch(e){ dmxLost(e); }
}
async function dmxOpenLoop(){                    // Open DMX: il computer genera il segnale, ~30 volte al secondo
  dmx.loop = true;
  while (dmx.loop && dmx.writer){
    try {
      await dmx.port.setSignals({ break: true }); await new Promise(r => setTimeout(r, 1));
      await dmx.port.setSignals({ break: false });
      await dmx.writer.write(dmx.frame);
    } catch(e){ dmxLost(e); break; }
    await new Promise(r => setTimeout(r, 30));
  }
}
function dmxLost(e){ dmx.loop = false; dmx.writer = null; dmx.port = null; $('dmxInfo').textContent = 'strobe: disconnected'; $('dmxBtn').textContent = 'connect strobe'; }
async function dmxOpen(port){
  dmx.type = $('dmxType').value;
  const opts = dmx.type === 'pro' ? { baudRate: 57600 } : { baudRate: 250000, dataBits: 8, stopBits: 2, parity: 'none' };
  try { await port.open(opts); } catch(e){ if (!/already open/i.test(e.message)) { $('dmxInfo').textContent = 'strobe: ' + e.message; return; } }
  dmx.port = port; dmx.writer = port.writable.getWriter();
  dmxSet(false); if (dmx.type === 'open') dmxOpenLoop();
  $('dmxInfo').textContent = 'strobe: connected (' + (dmx.type === 'pro' ? 'DMX USB Pro' : 'Open DMX') + ')';
  $('dmxBtn').textContent = 'disconnect strobe';
}
async function dmxToggle(){
  if (!('serial' in navigator)){ $('dmxInfo').textContent = 'strobe: use Chrome or Edge on a computer'; return; }
  if (dmx.port){ dmx.loop = false; try { dmxSet(false); await new Promise(r => setTimeout(r, 60)); dmx.writer.releaseLock(); await dmx.port.close(); } catch(e){} dmxLost(); return; }
  try { const port = await navigator.serial.requestPort(); store.set('persona-dmxOn', '1'); dmxOpen(port); }
  catch(e){ $('dmxInfo').textContent = 'strobe: no device chosen'; }
}
function strobeFlash(){
  if (!dmx.writer) return;
  dmxSet(true);
  clearTimeout(dmx.offT); dmx.offT = setTimeout(() => dmxSet(false), +$('dmxLen').value);
}
$('dmxBtn').onclick = dmxToggle; $('dmxTest').onclick = strobeFlash;
// in museo: se l'interfaccia era già stata scelta, si ricollega da sola all'avvio
if ('serial' in navigator && store.get('persona-dmxOn') === '1')
  navigator.serial.getPorts().then(ps => { if (ps[0]) dmxOpen(ps[0]); });
if ('serial' in navigator) navigator.serial.addEventListener('connect', e => { if (!dmx.port && store.get('persona-dmxOn') === '1') dmxOpen(e.target); });
addEventListener('beforeunload', () => { try { dmxSet(false); } catch(e){} });

// --- interfaccia ---
function fs(){ document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen(); }
$('camBtn').onclick = toggleCam; $('fsBtn').onclick = fs;
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k==='escape' && shotOpen) closeShot(); if (shotOpen) { if (k===' '||k==='enter') takeShot(); return; }
  if (k==='f') fs(); if (k==='c') toggleCam(); if (k==='p') openShot(); if (k==='h' || k==='o') panel.classList.toggle('hide');
});
let idleT;
addEventListener('mousemove', () => {
  document.body.classList.remove('idle');
  clearTimeout(idleT); idleT = setTimeout(()=>{ if (panel.classList.contains('hide')) document.body.classList.add('idle'); }, 3000);
});
idleT = setTimeout(()=>{ document.body.classList.add('idle'); }, 3000);
$('optBtn').onclick = () => panel.classList.toggle('hide');
setMode(store.get('persona-mode') === 'auto' ? 'auto' : 'manual');
addEventListener('dblclick', e => { if (!e.target.closest('#panel, #optBtn, #shot')) fs(); });
</script>
