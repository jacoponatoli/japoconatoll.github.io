name: SGUARDO analisi
# Analizza una volta sola i dipinti di sguardo/opere.json (genitali con NudeNet + mappa della pelle)
# e salva i risultati in sguardo/punti.json. Riparte da solo quando cambia l'elenco delle opere.
on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: ["sguardo/opere.json", "tools/sguardo-analizza.py", ".github/workflows/sguardo.yml"]
permissions:
  contents: write
concurrency: sguardo
jobs:
  analizza:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Analisi
        run: |
          pip install -q nudenet pillow requests
          python tools/sguardo-analizza.py
      - name: Salva
        run: |
          git config user.name "sguardo-bot"
          git config user.email "sguardo-bot@users.noreply.github.com"
          git add sguardo/punti.json
          git diff --cached --quiet && exit 0
          git commit -q -m "SGUARDO: punti aggiornati"
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
