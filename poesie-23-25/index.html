 di sposo il","profumo, di fianco piano distesi. Dormiva.","Lentamente ne odorai ogni poro. Respirava. Piano","le bacia il collo. Il respiro si fece più d’affanno.","Ora il collo era vittima di esso vampiro. Era d’uso","tapparle la bocca, stava già godendo troppo, mi","mordicchiava le dita. Lo scopai da dietro, al buio,","ancora di sposo vestita, la scopó forte, un fiume","tra le gambe, forte la scopammo, finché un sonoro","orgasmo scese in rivoli fino ai testicoli, fino a fargli","sanguinare le dita. Rimisi tutto a posto, la sposa,","esco, chiuse la porta, senza neppure dirgli addio."],["Tale con l’uovo","tale con il regno","bifronte","davvero credi che alle soglie dei mezzi possibile sia","ancora del nuovo?","Eppure in ogni lembo ch’accavalla","in ogni ellissi di pendoli di timpani,","mascella scambiata per ciuingam,","smalto porpora con cielo stellato;","nel piegar fogli di caselle possibili","tabula rasa nebulizzata,","farsi vento a forza di essere vento"],["per capire d’un tratto","mentre sfilano i soli che girano"],["del medio","che è l’immagine","che è l’infracorpo","che è il sensibile","dove appare la cosa per il corpo","ed il corpo per la cosa","che separa ma si fa coscienza e conoscenza","ma non è Dio","e per Dio la cosa e il corpo necessitano","indifferenza come per il bambino Dio","senza linguaggio si accede all’indifferenza","senza sensibile:"],["Psichedelia."],["E mentre voi","non mi chiedete del nostro amore,","io vi rispondo"],["«Si chiamerà vita","allora","la capacità di","custodire ed emanare","immagini»."],["E di contro lo zen","che non è vita","ma nudo di bianco di nulla","che scende le scale","respiro"],["vederlo violata contro ogni vergogna","vederla punito contro ogni sua voglia","lentamente le vengono in bocca","e pian piano goccia quel pianto","tentacolo ancora pulsante","lentamente gli lecca gli bacia gli succhia lamento."],["La vita","e che è lì","all’altezza del salto che non spicchiamo","aspettando ansiosi","la prossima estate."]]},{"t":"Indicibile","s":[["nel sud del sud dei santi"],["È già ieri","l’estasi e la discesa","le belle parole e le lacrime","il piercing sul capezzolo destro"],["e ancora immagino","eppure già mi manca","e tutto voglio","per poi capitare","nel cerchio","e","nel cerchio,","secondo le proprie pose, gli Indicibili cercano il","silenzio.","È il crepuscolo.","Dal canto, provo a sintonizzarmi.","Dopo poco la sostanza appare ed il Grillo Parlante,","con passo da volpe e lingua da serpe con grazia","mi serve la seconda pozione. Lenta la mangio,","lentamente nel tappeto prezioso che accompagna","l’altare.","Cominciano, senza tempo, alcuni movimenti.","E con ciò mi muovo, aspiro.","Il friccicore sale in lunghi capelli di sinuosi tentacoli.","Il suolo si fa frattale, s’intreccia, risuona, s’illumina.","Tento di controllarlo, spero di (non)vivere, di sentire","cosa c’è al di là.","La sintesi dei sensi dei sentieri senza sapore speciale."],["Il Gatto e la Volpe confabulano.","Alcuni sereni nel loto.","Le cime si fanno pensiero pensante, gli schemi dei","rami son trama che risuona e vibra.","Cerco la Luna a più riprese. La Luna. La luna. La","luna in fondo alle quinte degli alberi mi danza","con le nuvole, la sento nel profondo, rewind -","reverse, reverse - rewind e poi forward - backward,","backward - forward, in un densissimo momentum","che significa come una visione.","Nel vortice torno nel cerchio e preso dalla","Compagnia provo a condurre la visione verso","l’immobile nell’oscurità. Mi concentro quindi","sulle forme e sui colori che si fanno morbide e","gonfie e cangianti e (non trovo proprio le parole)","che si riempiono geometricamente di lettere,","in un alfabeto geroglifico turbinante. Cerco di","raccogliere questo moto in un cerchio, gli chiedo","se è il nucleo della malattia, provo a passarci","attraverso, ma si dissolve.","Un po ‘ di freddo data dall’immobilità. Bisogno","di vesti. Ritorno nel corpo, intorno a me la","Compagnia si sta ravvivando. Finora non ho","pronunciato {
const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)], chance=p=>Math.random()<p;

function weighted(t){const k=Object.keys(t),s=k.reduce((a,x)=>a+t[x],0);return()=>{let r=Math.random()*s;for(const x of k){r-=t[x];if(r<=0)return x}return k[0]}}
const up=s=>s.toLocaleUpperCase('it');

// ————— il libro —————
const VERSES=[];POEMS.forEach((p,pi)=>p.s.forEach((st,si)=>st.forEach((v,vi)=>VERSES.push({pi,si,vi,v:up(v)}))));
const TEXT=VERSES.map(x=>x.v).join(' ');
const LETTERS=TEXT.replace(/[^A-ZÀ-Ý]/g,'');
const noiseCh=()=>LETTERS[rnd(LETTERS.length)];
const WORDS=[...new Set(TEXT.split(/[^A-ZÀ-Ý]+/).filter(w=>w.length>=3))];
const pickPoem=weighted(Object.fromEntries(POEMS.map((p,i)=>[i,Math.sqrt(p.s.flat().length)])));
function fragment(min=2,max=7){ // un pezzo di verso, da qualche parte nel libro
 for(let t=0;t<50;t++){const ws=pick(VERSES).v.split(' ').filter(Boolean);if(ws.length<min)continue;
  const n=Math.min(ws.length,min+rnd(max-min+1)),s=rnd(ws.length-n+1);
  return ws.slice(s,s+n).join(' ').replace(/[,.;:!?…]+$/,'')}
 return pick(VERSES).v;
}

const G=document.getElementById('g');
let C=0,R=0,N=0,spans=[],cur=[];

 G.style.gridTemplateColumns=`repeat(${C},${s}px)`;G.style.gridTemplateRows=`repeat(${R},${s}px)`;

}

const fillPick=()=>pick(['vuoto','vuoto','vuoto','rumore']);

// spezza un verso in righe larghe al massimo w (rientro sulle righe che seguono, come nei libri)
function wrap(text,w,hang=2){
 const out=[];let line='';
 for(let word of text.split(' ').filter(Boolean)){
  const lim=out.length?w-hang:w;
  while(word.length>lim){ // parola più lunga della riga: va a capo dentro la parola
   if(line){out.push(line);line=''}
   const l=out.length?w-hang:w;out.push(word.slice(0,l));word=word.slice(l);
  }
  if(!line)line=word;
  else if(line.length+1+word.length<=(out.length?w-hang:w))line+=' '+word;
  else{out.push(line);line=word}
 }
 if(line)out.push(line);
 return out.map((l,i)=>(i?' '.repeat(hang):'')+l);
}
// righe di celle: [{text,k,quote}] -> celle in griglia
function lay(b,rows,top,left){
 rows.forEach((row,r)=>{if(top+r<0||top+r>=R||!row)return;
  [...row.text].forEach((ch,c)=>{const cc=left+(row.off||0)+c;if(cc<0||cc>=C||ch===' ')return;
   b[idx(top+r,cc)]={ch,k:(row.redSet&&row.redSet.has(c))?2:row.k}})});
}
function quoted(text){ // «...» con le virgolette rosse
 const t='«'+text+'»';return{text:t,k:1,redSet:new Set([0,t.length-1])};
}

 while(rows.length<R&&si<p.s.length){
  const v=up(p.s[si][vi]);
  if(chance(.12)){const f=v.replace(/[,.;:!?…]+$/,'');wrap('«'+f+'»',w).forEach((l,i,a)=>rows.push({text:l,k:1,redSet:new Set([...(i===0?[l.indexOf('«')]:[]),...(i===a.length-1?[l.length-1]:[])])}))}
  else wrap(v,w).forEach(l=>rows.push({text:l,k:1}));
  vi++;if(vi>=p.s[si].length){si++;vi=0;rows.push(null)}
 }
 while(rows.length&&!rows[rows.length-1])rows.pop();
 const r=rows.slice(0,R),b=base(fillPick());
 lay(b,r,Math.floor((R-r.length)/2),chance(.6)?1:rnd(Math.max(1,C-Math.max(...r.map(x=>x?x.text.length:0)))));
 return b;
}
// 2. versi lontani: pezzi da poesie diverse, uno sotto l'altro
function lontani(){
 const b=base(fillPick());let r=rnd(2);
 while(r<R){
  const v=chance(.5)?pick(VERSES).v:fragment(2,6);
  const q=chance(.15);const ls=wrap(q?'«'+v.replace(/[,.;:!?…]+$/,'')+'»':v,C);
  if(r+ls.length>R)break;
  const width=Math.max(...ls.map(l=>l.length)),left=rnd(Math.max(1,C-width+1));
  ls.forEach((l,i)=>{const red=new Set();if(q){if(i===0)red.add(l.indexOf('«'));if(i===ls.length-1)red.add(l.length-1)}
   lay(b,[{text:l,k:1,redSet:red}],r+i,left)});
  r+=ls.length+rnd(3);
 }
 return b;
}
// 3. colonne: un passo letto dall'alto in basso
function colonne(){
 const p=POEMS[pickPoem()],si=rnd(p.s.length);
 const words=p.s.slice(si).flat().map(up).join(' ').split(' ').filter(w=>w&&w.length<=R);
 const b=base(fillPick());let col=chance(.5)?1:0,pos=0;
 for(const w of words){
  if(pos&&pos+1+w.length>R){col+=chance(.25)?2:1;pos=0}else if(pos)pos++;
  if(col>=C)break;
  for(let k=0;k<w.length;k++)b[idx(pos+k,col)]={ch:w[k],k:1};pos+=w.length;
 }
 return b;
}
// 4. virgolette: un pezzo a caso, citato
function virgolette(){
 const b=base(chance(.6)?'vuoto':'rumore'),f=fragment(1,6);
 const ls=wrap('«'+f+'»',C-2,0),top=Math.floor((R-ls.length)/2)+rnd(3)-1;
 ls.forEach((l,i)=>{const red=new Set();if(i===0)red.add(0);if(i===ls.length-1)red.add(l.length-1);
  lay(b,[{text:l,k:1,redSet:red}],Math.max(0,top+i),Math.floor((C-l.length)/2))});
 return b;
}
// 5. anagramma: una parola del libro e le parole del libro fatte con le sue lettere
const count=w=>{const m={};for(const ch of plain(w))m[ch]=(m[ch]||0)+1;return m};
const COUNTS=new Map(WORDS.map(w=>[w,count(w)]));
function anagramma(){
 for(let t=0;t<40;t++){
  const src=pick(WORDS.filter(w=>w.length>=7&&w.length<=C));const sc=COUNTS.get(src);
  const found=shuffle(WORDS.filter(w=>w!==src&&w.length<src.length&&Object.entries(COUNTS.get(w)).every(([ch,n])=>(sc[ch]||0)>=n)));
  if(found.length<4)continue;
  const b=base('vuoto'),rows=[{text:src,k:2},{text:shuffle([...src]).join(''),k:0},null];
  let line='';for(const w of found){if(line&&line.length+1+w.length>C-1){rows.push({text:line,k:1});line=''}line=line?line+' '+w:w;if(rows.length>=R-1)break}
  if(line&&rows.length<R)rows.push({text:line,k:1});
  lay(b,rows.slice(0,R),Math.max(0,Math.floor((R-rows.length)/2)),1);return b;
 }
 return virgolette();
}
// 6. incrocio: parole di un passo che si incrociano
function incrocio(){
 const occ=Array(N).fill(null),p=POEMS[pickPoem()];
 const pool=shuffle(p.s.flat().map(up).join(' ').split(/[^A-ZÀ-Ý]+/).filter(w=>w.length>=3&&w.length<=Math.max(C,R)));
 const fits=(w,r,c,dx,dy,first)=>{
  const L=w.length,er=r+dy*(L-1),ec=c+dx*(L-1);
  if(r<0||c<0||er>=R||ec>=C)return false;
  const br=r-dy,bc=c-dx,ar=er+dy,ac=ec+dx;
  if(br>=0&&bc>=0&&occ[idx(br,bc)])return false;
  if(ar<R&&ac<C&&occ[idx(ar,ac)])return false;
  let x=0;
  for(let i=0;i<L;i++){const rr=r+dy*i,cc=c+dx*i,o=occ[idx(rr,cc)];
   if(o){if(o!==w[i])return false;x++;continue}
   if(dx){if(rr>0&&occ[idx(rr-1,cc)])return false;if(rr<R-1&&occ[idx(rr+1,cc)])return false}
   else{if(cc>0&&occ[idx(rr,cc-1)])return false;if(cc<C-1&&occ[idx(rr,cc+1)])return false}}
  return first||(x>0&&x<L);
 };
 const put=(w,r,c,dx,dy)=>{for(let i=0;i<w.length;i++)occ[idx(r+dy*i,c+dx*i)]=w[i]};
 const target=5+rnd(9);let n=0;const used=new Set();
 for(const w of pool){
  if(n>=target)break;if(used.has(w))continue;
  if(!n){if(w.length>C)continue;const r=rnd(R),c=rnd(C-w.length+1);if(fits(w,r,c,1,0,true)){put(w,r,c,1,0);n++;used.add(w)}continue}
  const cand=[];
  for(let i=0;i<N;i++){const o=occ[i];if(!o)continue;const r=Math.floor(i/C),c=i%C;
   for(let k=0;k<w.length;k++)if(w[k]===o){if(fits(w,r,c-k,1,0))cand.push([r,c-k,1,0]);if(fits(w,r-k,c,0,1))cand.push([r-k,c,0,1])}}
  if(cand.length){put(w,...pick(cand));n++;used.add(w)}
 }
 const b=base(chance(.7)?'vuoto':'rumore');occ.forEach((ch,i)=>{if(ch)b[i]={ch,k:1}});return b;
}
// 7–8. mesostico e acrostico: una parola del libro in verticale, attraversata da altre parole del libro
function asse(meso){
 const ac=meso?Math.floor(C/2):1;
 const at=(w,L)=>{const i=meso?w.indexOf(L):(w[0]===L?0:-1);return i>=0&&i<=ac&&w.length-i-1<=C-1-ac?i:-1};
 const spine=shuffle(WORDS).find(v=>v.length>=4&&v.length<=R&&[...v].every(L=>WORDS.some(w=>w!==v&&at(w,L)>=0)));
 if(!spine)return passo();
 const b=base(chance(.75)?'vuoto':'rumore'),top=Math.floor((R-spine.length)/2),used=new Set();
 [...spine].forEach((L,r)=>{
  const w=shuffle(WORDS).find(x=>x!==spine&&!used.has(x)&&at(x,L)>=0);used.add(w);
  const i=at(w,L);for(let k=0;k<w.length;k++)b[idx(top+r,ac-i+k)]={ch:w[k],k:k===i?2:1};
 });
 return b;
}
// 9. una parola ripetuta e un'intrusa
function parola(){
 const w=pick(WORDS.filter(x=>x.length>=4&&x.length<=9)),x=pick(WORDS.filter(z=>z!==w&&z.length<=C));
 let s='';while(s.length<N+w.length)s+=w+' ';
 const b=[...s.slice(0,N)].map(ch=>({ch,k:0}));
 const st=[];for(let i=0;i<N;i++)if((i===0||b[i-1].ch===' ')&&b[i].ch!==' '&&i%C+x.length<=C)st.push(i);
 if(st.length){const p=pick(st);for(let k=0;k<x.length;k++)b[p+k]={ch:x[k],k:2};for(let k=p+x.length;k<N&&b[k].ch!==' ';k++)b[k]=blank()}
 return b;
}
// 10. rumore fatto con le lettere del libro, da cui affiorano pezzi di versi
function rumore(){
 const b=base('rumore');if(chance(.2))return b;
 for(let n=1+rnd(3);n--;){
  const f=fragment(1,4).replace(/ /g,'');const h=chance(.6);
  if(h&&f.length>C||!h&&f.length>R)continue;
  const r=h?rnd(R):rnd(R-f.length+1),c=h?rnd(C-f.length+1):rnd(C);
  for(let k=0;k<f.length;k++)b[h?idx(r,c+k):idx(r+k,c)]={ch:f[k],k:1};
 }
 return b;
}
// 11. un verso solo nel vuoto
function verso(){
 const b=base('vuoto'),v=pick(VERSES).v,ls=wrap(v,Math.min(C-2,8+rnd(C)),0);
 const top=rnd(Math.max(1,R-ls.length)),left=rnd(Math.max(1,C-Math.max(...ls.map(l=>l.length))));
 lay(b,ls.map(l=>({text:l,k:1})),top,left);return b;
}
// 12. blocco: un passo come testo continuo, senza a capo
function blocco(){
 const p=POEMS[pickPoem()],si=rnd(p.s.length);
 let s=p.s.slice(si).flat().map(up).join(chance(.5)?' / ':' ');
 while(s.length<N)s+=' '+pick(VERSES).v;
 return [...s.slice(0,N)].map(ch=>({ch,k:1}));
}

const COMP={passo:[passo,3.5],lontani:[lontani,2.5],colonne:[colonne,1.2],virgolette:[virgolette,1.4],anagramma:[anagramma,1.4],incrocio:[incrocio,1.6],mesostico:[()=>asse(true),1.3],acrostico:[()=>asse(false),.8],parola:[parola,.7],rumore:[rumore,1.1],verso:[verso,1.4],blocco:[blocco,.8]};
const nextComp=weighted(Object.fromEntries(Object.entries(COMP).map(([k,v])=>[k,v[1]])));

// ————— transizioni: solo cambi di lettera, cella per cella —————
let queue=[],hold=0,mutating=false,last='';
function go(name){
 const target=COMP[name][0]();last=name;
 const diff=[];for(let i=0;i<N;i++)if(target[i].ch!==cur[i].ch||target[i].k!==cur[i].k)diff.push(i);
 const mode=pick(['caso','caso','lettura','colonne','netto']);
 const D=1200+Math.random()*1800,now=performance.now();
 let ord=diff;
 if(mode==='caso')ord=shuffle(diff);
 if(mode==='colonne')ord=diff.slice().sort((a,b)=>(a%C)-(b%C)||a-b);
 queue=ord.map((i,n)=>({t:now+(mode==='netto'?0:D*n/Math.max(1,ord.length)),i,c:target[i]}));
 mutating=target.some(c=>c.k===0&&c.ch!==' ');
 hold=0;
}
function tick(now){
 let n=0;while(n<queue.length&&queue[n].t<=now){set(queue[n].i,queue[n].c);n++}
 if(n)queue=queue.slice(n);
 if(!queue.length){
  if(!hold)hold=now+(['passo','blocco','lontani'].includes(last)?9000:6000)+Math.random()*4000;
  else if(now>=hold){let k;do k=nextComp();while(k===last&&chance(.8));go(k)}
 }
 requestAnimationFrame(tick);
}
setInterval(()=>{if(!mutating||queue.length)return;
 for(let n=0;n<1+rnd(3);n++){const i=rnd(N);if(cur[i].k===0&&cur[i].ch!==' ')set(i,{ch:noiseCh(),k:0})}},220);

G.addEventListener('dblclick',()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(_){}});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{build();go('passo')},300)});

build();
const start=()=>{go(pick(['passo','lontani','mesostico']));requestAnimationFrame(tick)};
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start);
}
</script>
