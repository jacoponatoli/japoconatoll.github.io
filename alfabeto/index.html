<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ALFABETO — Jacopo Natoli</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,800&display=swap" rel="stylesheet">
<style>
/* ALFABETO: griglie di lettere che mutano. Nero, bianco, grigio per il rumore, rosso per l'asse. Nessuna interfaccia. */
:root{--bg:#000;--fg:#fff;--dim:#363636;--red:#ff1a1a}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg)}
body{cursor:none}
#g{position:fixed;inset:0;display:grid;place-content:center;user-select:none;
 font-family:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:800;font-stretch:112%;
 -webkit-font-smoothing:antialiased}
#g span{display:flex;align-items:center;justify-content:center;line-height:1}
.k0{color:var(--dim)}.k1{color:var(--fg)}.k2{color:var(--red)}
</style>
</head>
<body>
<div id="g"></div>
<script>
{
// ————— lessico —————
const NM='MARE TEMPO VENTO CORPO SOGNO SEGNO FUOCO CIELO MURO PANE NOME VUOTO RUMORE SILENZIO GIORNO MONDO CUORE TRENO LIBRO CANTO GIOCO PONTE FIUME SOLE SANGUE SASSO BUIO NIENTE FIORE SUONO GESTO PUNTO FILO VETRO PIANTO RESPIRO DESIDERIO FUTURO PASSATO PRESENTE POPOLO SCHERMO CODICE ALFABETO SEGRETO MOSTRO CONFINE DESERTO DOLORE NODO PESO CORPO VOLTO MARGINE LIMITE RITMO CAOS FUMO GRIDO SONNO RICORDO VIAGGIO SALE LETTO ALBERO OCCHIO ORO INVERNO UOMO ERRORE ORIZZONTE ANIMALE'.split(' ');
const NF='LINGUA NOTTE LUCE CASA PAROLA MANO PIETRA TERRA ACQUA ONDA VOCE FESTA MEMORIA UTOPIA LETTERA PAGINA STRADA PIAZZA FINESTRA FERITA FAME PELLE PAURA GIOIA RABBIA NEVE PIOGGIA POESIA RIVOLTA ROSA CENERE RETE MACCHINA PORTA OMBRA ALBA STELLA SABBIA LUNA FORMA FOGLIA FINE FEBBRE GUERRA PACE BOCCA FRONTE FIAMMA NUVOLA SCRITTURA DISTANZA ATTESA ISOLA ESTATE'.split(' ');
const ADJ='NERO ROSSO BIANCO VUOTO PIENO NUOVO VECCHIO LENTO RAPIDO MUTO CIECO VIVO MORTO ROTTO PERSO NUDO CALDO FREDDO STANCO ALTO BASSO LUNGO CHIARO OSCURO LONTANO VICINO SOLO ULTIMO PRIMO ESATTO INFINITO STORTO SACRO FERMO INUTILE FRAGILE DOLCE GRANDE BREVE FELICE IMMOBILE POSSIBILE IMPOSSIBILE INVISIBILE SEMPLICE CELESTE VERDE'.split(' ');
const VI='BRUCIA CADE DORME TORNA RESTA PARLA TACE RESPIRA CANTA TREMA GIRA PASSA CRESCE MANCA BRILLA SPARISCE NASCE MUORE ASPETTA RIDE PIANGE CORRE GRIDA SCIVOLA RESISTE DURA FINISCE COMINCIA'.split(' ');
const VT='CHIAMA SCRIVE DIMENTICA APRE CHIUDE CERCA PERDE MANGIA TOCCA GUARDA ASCOLTA CANCELLA SOGNA RICORDA ATTRAVERSA NASCONDE INVENTA SPEZZA CUCE ABITA DESIDERA TRADISCE'.split(' ');
const INF='RESTARE ANDARE DIRE TACERE PERDERE GUARDARE LEGGERE ASCOLTARE SCRIVERE DIMENTICARE RESISTERE GIOCARE DORMIRE CADERE TORNARE FUGGIRE CREDERE ABITARE'.split(' ');
const ADV='ORA QUI ANCORA MAI SEMPRE OLTRE DENTRO FUORI FORSE OGGI ADESSO POI INSIEME PIANO ALTROVE DOMANI IERI'.split(' ');

const rnd=n=>Math.floor(Math.random()*n), pick=a=>a[rnd(a.length)], chance=p=>Math.random()<p;
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
function weighted(t){const k=Object.keys(t),s=k.reduce((a,x)=>a+t[x],0);return()=>{let r=Math.random()*s;for(const x of k){r-=t[x];if(r<=0)return x}return k[0]}}
const letter=weighted({A:11.7,B:.9,C:4.5,D:3.7,E:11.8,F:1,G:1.6,H:1.5,I:11.3,L:6.5,M:2.5,N:6.9,O:9.8,P:3,Q:.5,R:6.4,S:5,T:5.6,U:3,V:2.1,Z:.6});

const fem=a=>a.endsWith('O')?a.slice(0,-1)+'A':a;
const ALL=[...new Set([...NM,...NF,...ADJ,...ADJ.map(fem),...VI,...VT,...INF,...ADV])];

// ————— frasi: grammatica minima —————
function noun(){const f=chance(.5);return{w:pick(f?NF:NM),g:f?'f':'m'}}
function art(n,def){
 if(/^[AEIOU]/.test(n.w))return null;
 if(n.g==='f')return def?'LA':'UNA';
 if(/^(S[^AEIOU]|Z|GN|PS)/.test(n.w))return def?'LO':'UNO';
 return def?'IL':'UN';
}
function NP(adj=.35){
 const n=noun(),o=[];
 if(chance(.7)){const a=art(n,chance(.75));if(a)o.push(a)}
 o.push(n.w);
 if(chance(adj))o.push(n.g==='f'?fem(pick(ADJ)):pick(ADJ));
 return o;
}
const T=[
 ()=>[...NP(1)],
 ()=>[...NP(),pick(VI)],
 ()=>[...NP(.2),pick(VT),...NP(.2)],
 ()=>[noun().w,'DI',noun().w],
 ()=>['NON',pick(chance(.5)?VI:VT)],
 ()=>[pick(INF),...NP(.3)],
 ()=>[pick(ADV),...NP(0),pick(VI)],
 ()=>[noun().w,'E',noun().w],
 ()=>[...NP(0),'COME',...NP(.3)],
 ()=>[pick(chance(.5)?INF:ADV)],
 ()=>{const a=noun(),b=noun();const x=art(b,false);return['OGNI',a.w,'È',...(x?[x]:[]),b.w]},
 ()=>[noun().w,'SENZA',noun().w],
 ()=>['TRA',noun().w,'E',noun().w],
 ()=>[...NP(.2),pick(VI),pick(ADV)],
 ()=>{const n=noun(),a=art(n,true);return['NON','È',...(a?[a]:[]),n.w]},
];
const phrase=()=>pick(T)();

// ————— griglia —————
const G=document.getElementById('g');
let C=0,R=0,N=0,spans=[],cur=[];
const blank=()=>({ch:' ',k:0});
function build(){
 const W=innerWidth,H=innerHeight;
 const s=Math.max(30,Math.min(96,Math.floor(Math.min(W/11,Math.max(W/18,H/9)))));
 C=Math.floor(W/s);R=Math.floor(H/s);N=C*R;
 G.style.gridTemplateColumns=`repeat(${C},${s}px)`;G.style.gridTemplateRows=`repeat(${R},${s}px)`;
 G.style.fontSize=Math.round(s*.62)+'px';
 G.innerHTML='';spans=[];cur=[];
 for(let i=0;i<N;i++){const e=document.createElement('span');G.appendChild(e);spans.push(e);cur.push(blank())}
}
function set(i,c){cur[i]=c;spans[i].textContent=c.ch;spans[i].className='k'+c.k}

// riempitivo: vuoto, lettere a caso, o lettere delle stesse parole
function base(fill,src){
 const t=[];const pool=src?src.join('').replace(/[^A-Z]/g,''):'';
 for(let i=0;i<N;i++)t.push(fill==='vuoto'?blank():{ch:fill==='eco'&&pool?pool[rnd(pool.length)]:letter(),k:0});
 return t;
}
const idx=(r,c)=>r*C+c;

// ————— composizioni —————
function flow(vertical){
 const major=vertical?C:R,minor=vertical?R:C;
 const words=[];const fill=pick(['vuoto','vuoto','lettere','eco']);
 let line=chance(.3)?1:0,pos=chance(.4)?rnd(3):0;const t=[];
 const put=(l,p,ch,k)=>{t[vertical?idx(p,l):idx(l,p)]={ch,k}};
 let guard=0,ok=true;
 while(ok&&guard++<200){
  const ph=phrase();if(ph.some(w=>w.length>minor))continue;
  ph.forEach((w,j)=>{
   if(!ok)return;
   const gap=pos===0?0:(j===0?2:1);
   if(pos+gap+w.length>minor){line+=(j===0&&chance(.4))?2:1;pos=chance(.25)?rnd(3):0;
    if(pos+w.length>minor)pos=0}
   else pos+=gap;
   if(line>=major){ok=false;return}
   for(let i=0;i<w.length;i++)put(line,pos+i,w[i],1);
   pos+=w.length;words.push(w);
  });
 }
 const b=base(fill,words);for(let i=0;i<N;i++)if(t[i])b[i]=t[i];
 return b;
}

function block(){ // blocco continuo: il testo va a capo dentro le parole
 let s='';while(s.length<N)s+=phrase().join(' ')+(chance(.5)?' ':'  ');
 s=s.slice(0,N);return [...s].map(ch=>({ch,k:1}));
}

function cross(){
 const fill=pick(['vuoto','lettere','vuoto']);
 const occ=Array(N).fill(null);
 const pool=shuffle([...phrase(),...phrase(),...phrase()].filter(w=>w.length>=3)).concat(shuffle(ALL)).filter(w=>w.length<=Math.max(C,R)&&w.length>=3);
 const fits=(w,r,c,dx,dy,first)=>{
  const L=w.length,er=r+dy*(L-1),ec=c+dx*(L-1);
  if(r<0||c<0||er>=R||ec>=C)return false;
  const br=r-dy,bc=c-dx,ar=er+dy,ac=ec+dx;
  if(br>=0&&bc>=0&&occ[idx(br,bc)])return false;
  if(ar<R&&ac<C&&occ[idx(ar,ac)])return false;
  let crossN=0;
  for(let i=0;i<L;i++){const rr=r+dy*i,cc=c+dx*i,o=occ[idx(rr,cc)];
   if(o){if(o!==w[i])return false;crossN++;continue}
   // niente lettere attaccate di lato
   if(dx){if(rr>0&&occ[idx(rr-1,cc)])return false;if(rr<R-1&&occ[idx(rr+1,cc)])return false}
   else{if(cc>0&&occ[idx(rr,cc-1)])return false;if(cc<C-1&&occ[idx(rr,cc+1)])return false}}
  return first||(crossN>0&&crossN<L);
 };
 const lay=(w,r,c,dx,dy)=>{for(let i=0;i<w.length;i++)occ[idx(r+dy*i,c+dx*i)]=w[i]};
 const target=4+rnd(8);let n=0;
 for(const w of pool){
  if(n>=target)break;
  if(n===0){const h=w.length<=C;const dx=h?1:0,dy=h?0:1;
   const r=h?rnd(R):rnd(R-w.length+1),c=h?rnd(C-w.length+1):rnd(C);
   if(fits(w,r,c,dx,dy,true)){lay(w,r,c,dx,dy);n++}continue}
  const cand=[];
  for(let i=0;i<N;i++){const o=occ[i];if(!o)continue;const r=Math.floor(i/C),c=i%C;
   for(let k=0;k<w.length;k++)if(w[k]===o){
    if(fits(w,r,c-k,1,0))cand.push([r,c-k,1,0]);
    if(fits(w,r-k,c,0,1))cand.push([r-k,c,0,1]);}}
  if(cand.length){lay(w,...pick(cand));n++}
 }
 const b=base(fill);occ.forEach((ch,i)=>{if(ch)b[i]={ch,k:1}});return b;
}

function axis(meso){
 const fill=pick(['vuoto','vuoto','lettere']);
 const ac=meso?Math.floor(C/2):(chance(.5)?0:1);
 const fitW=(w,L)=>{const i=meso?w.indexOf(L):(w[0]===L?0:-1);return i>=0&&i<=ac&&w.length-i-1<=C-1-ac?i:-1};
 const spine=shuffle([...NM,...NF]).find(v=>v.length<=R&&v.length>=3&&[...v].every(L=>ALL.some(w=>fitW(w,L)>=0)))||'ALFABETO'.slice(0,R);
 const top=Math.floor((R-spine.length)/2),b=base(fill),used=new Set();
 [...spine].forEach((L,r)=>{
  const cs=shuffle(ALL).filter(w=>!used.has(w)&&fitW(w,L)>=0&&w!==spine);
  const w=cs[0]||L;used.add(w);const i=cs[0]?fitW(w,L):0;
  for(let k=0;k<w.length;k++)b[idx(top+r,ac-i+k)]={ch:w[k],k:k===i?2:1};
 });
 return b;
}

function oneWord(){ // una parola ripetuta, e un'intrusa
 const w=pick([...NM,...NF]),x=pick(ALL.filter(z=>z!==w));
 let s='';while(s.length<N+w.length)s+=w+' ';
 const b=[...s.slice(0,N)].map(ch=>({ch,k:0}));
 const starts=[];for(let i=0;i<N;i++)if((i===0||b[i-1].ch===' ')&&b[i].ch!==' '&&i%C+x.length<=C)starts.push(i);
 if(starts.length){const p=pick(starts);for(let k=0;k<x.length;k++)b[p+k]={ch:x[k],k:2};for(let k=p+x.length;k<N&&b[k].ch!==' ';k++)b[k]={ch:' ',k:0}}
 return b;
}

function noise(){ // rumore di lettere, da cui affiorano poche parole
 const b=base('lettere');if(chance(.25))return b;
 const ws=phrase().filter(w=>w.length>1);
 ws.forEach(w=>{const h=chance(.6)&&w.length<=C;if(!h&&w.length>R)return;
  const r=h?rnd(R):rnd(R-w.length+1),c=h?rnd(C-w.length+1):rnd(C);
  for(let k=0;k<w.length;k++)b[h?idx(r,c+k):idx(r+k,c)]={ch:w[k],k:1}});
 return b;
}

function empty(){ // quasi nulla: una frase sola nel vuoto
 const b=base('vuoto'),ph=phrase().filter(w=>w.length<=C);
 let r=rnd(Math.max(1,R-ph.length));
 const stair=chance(.5);let c=rnd(Math.max(1,C-(ph[0]||'').length+1));
 ph.forEach((w,j)=>{if(r>=R)return;if(c+w.length>C)c=C-w.length;
  for(let k=0;k<w.length;k++)b[idx(r,c+k)]={ch:w[k],k:j===ph.length-1&&chance(.4)?2:1};
  if(stair){r++;c=Math.min(c+w.length,C-1)}else{r+=1+rnd(2);c=rnd(Math.max(1,C-((ph[j+1]||'').length)+1))}});
 return b;
}

const COMP={righe:[()=>flow(false),3],colonne:[()=>flow(true),2],incrocio:[cross,2.2],acrostico:[()=>axis(false),1.2],mesostico:[()=>axis(true),1.4],parola:[oneWord,1],rumore:[noise,1.6],vuoto:[empty,1],blocco:[block,.8]};
const nextComp=weighted(Object.fromEntries(Object.entries(COMP).map(([k,v])=>[k,v[1]])));

// ————— transizioni: solo cambi di lettera, cella per cella —————
let queue=[],hold=0,mutating=false;
function go(target){
 const diff=[];for(let i=0;i<N;i++)if(target[i].ch!==cur[i].ch||target[i].k!==cur[i].k)diff.push(i);
 const mode=pick(['caso','caso','lettura','colonne','netto']);
 const D=1200+Math.random()*1800,now=performance.now();
 let ord=diff;
 if(mode==='caso')ord=shuffle(diff);
 if(mode==='colonne')ord=diff.slice().sort((a,b)=>(a%C)-(b%C)||a-b);
 queue=ord.map((i,n)=>({t:now+(mode==='netto'?0:D*n/Math.max(1,ord.length)),i,c:target[i]}));
 mutating=target.some(c=>c.k===0&&c.ch!==' ');
 hold=0;
}
function tick(now){
 let n=0;while(n<queue.length&&queue[n].t<=now){set(queue[n].i,queue[n].c);n++}
 if(n)queue=queue.slice(n);
 if(!queue.length){
  if(!hold)hold=now+6500+Math.random()*4500;
  else if(now>=hold)go(COMP[nextComp()][0]());
 }
 requestAnimationFrame(tick);
}
// il rumore grigio non sta mai fermo
setInterval(()=>{if(!mutating||queue.length)return;
 for(let n=0;n<1+rnd(3);n++){const i=rnd(N);if(cur[i].k===0&&cur[i].ch!==' ')set(i,{ch:letter(),k:0})}},220);

G.addEventListener('dblclick',()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(_){}});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{build();go(COMP.righe[0]())},300)});

build();
const start=()=>{go(COMP[pick(['righe','incrocio','mesostico'])][0]());requestAnimationFrame(tick)};
(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(start);
}
</script>
</body>
</html>
