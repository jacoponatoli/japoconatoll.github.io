<style>
/* Layout: schermo nero, parole bianche che rimbalzano sui bordi come un vecchio screensaver. Un solo look scuro, scelto apposta. */
:root {
  --bg: #000000;
  --fg: #ffffff;
  --muted: #8a8a8a;
  --red: #ff1a1a;
  --display: "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg);
  color: var(--fg);
  font-family: var(--mono);
  overflow: hidden;
  cursor: default;
}
.float {
  position: fixed; top: 0; left: 0;
  font-family: var(--display);
  font-weight: 800;
  font-stretch: 125%;
  font-size: clamp(28px, 6vw, 72px);
  line-height: 0.74;
  text-transform: uppercase;
  color: var(--fg);
  text-decoration: none;
  white-space: nowrap;
  padding: 0;
  will-change: transform;
}
.float:hover, .float:focus-visible { color: var(--red); }
.float.done { color: var(--red); }
.float:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
.vh { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; margin: -1px; }
.tree {
  position: fixed; inset: 0; z-index: 10;
  background: var(--bg);
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  overflow-y: auto;
}
/* lista secca in alto a sinistra: la dimensione segue la larghezza della finestra */
.tree ul { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; align-items: flex-start; gap: 0.18em; font-size: clamp(22px, 5.4vw, 72px); }
.tree a {
  font-family: var(--display); font-weight: 800; font-stretch: 125%;
  font-size: 1em; line-height: 0.9; text-transform: uppercase;
  color: var(--fg); text-decoration: none;
  overflow-wrap: anywhere;
}
.tree a:hover, .tree a:focus-visible { color: var(--red); }
.tree a:focus-visible, .close:focus-visible { outline: 2px solid var(--fg); outline-offset: 4px; }
.close {
  position: fixed; top: calc(16px + env(safe-area-inset-top, 0px)); right: 16px;
  font-family: var(--display); font-weight: 800; font-stretch: 125%;
  font-size: clamp(22px, 5.4vw, 72px); line-height: 0.9;
  color: var(--fg); background: var(--bg); border: 0; padding: 0; cursor: pointer;
}
.close:hover, .close:focus-visible { color: var(--red); }
</style>
</head>
<body>


<h1 class="vh">Jacopo Natoli, artista visivo</h1>

<!-- cv.pdf e portfolio.pdf stanno nella stessa cartella di questo file -->
<a class="float" href="cv/" target="_blank" rel="noopener">CV</a>
<a class="float" href="portfolio/" target="_blank" rel="noopener">Portfolio</a>
<a class="float" href="#online" id="online-btn">Onlife</a>
<a class="float" href="https://linktr.ee/jacoponatoli" target="_blank" rel="noopener">Link</a>

<!-- ONLINE: per aggiungere un lavoro copia una riga <li> e cambia indirizzo e nome -->
<section class="tree" id="tree" hidden aria-label="Lavori online">
  <button class="close" type="button" id="close-tree" aria-label="Chiudi">×</button>
  <ul>
    <li><a href="https://jacoponatoli.github.io/PLAYPLAYPLAYPLAY/" target="_blank" rel="noopener">PLAYPLAYPLAYPLAY</a></li>
    <li><a href="https://jacoponatoli.github.io/poesia_la_notizia/" target="_blank" rel="noopener">Poesia la notizia</a></li>
    <li><a href="https://jacoponatoli.github.io/imageoftheday/" target="_blank" rel="noopener">Image of the Day</a></li>
  </ul>
</section>

<script>
(function () {
  // velocità in proporzione allo schermo: 0.2 = un quinto della diagonale al secondo.
  // Così su cellulare e su laptop sembrano andare allo stesso ritmo.
  var VELOCITA = 0.2;

  var reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  if (reduce) VELOCITA = 0.05;

  var items = Array.prototype.map.call(document.querySelectorAll(".float"), function (el) {
    return { el: el, x: 0, y: 0, w: 0, h: 0, vx: 0.7, vy: 0.7, hold: false, stopped: false };
  });
  var W = innerWidth, H = innerHeight, diag = Math.hypot(W, H);

  // misura una volta sola (e al resize), non a ogni fotogramma: animazione più fluida
  function measure() {
    W = innerWidth; H = innerHeight; diag = Math.hypot(W, H);
    items.forEach(function (it) { it.w = it.el.offsetWidth; it.h = it.el.offsetHeight; });
  }

  // separa due parole che si sovrappongono (dx,dy = di quanto spostare "a")
  function shift(a, b, dx, dy) {
    if (a.hold && b.hold) return;
    if (a.hold) { b.x -= dx; b.y -= dy; }
    else if (b.hold) { a.x += dx; a.y += dy; }
    else { a.x += dx / 2; a.y += dy / 2; b.x -= dx / 2; b.y -= dy / 2; }
  }

  // ricorda le voci cliccate finché si resta sul sito (anche tornando con "indietro");
  // a ogni nuova visita si riparte da zero
  var KEY = "jn-cliccate";
  function save() {
    try {
      var d = {};
      items.forEach(function (it, n) { if (it.stopped) d[n] = [it.x / W, it.y / H]; });
      sessionStorage.setItem(KEY, JSON.stringify(d));
    } catch (e) {}
  }
  function restore() {
    try {
      var nav = performance.getEntriesByType && performance.getEntriesByType("navigation")[0];
      if (!nav || nav.type !== "back_forward") { sessionStorage.removeItem(KEY); return; }
      var d = JSON.parse(sessionStorage.getItem(KEY) || "{}");
      Object.keys(d).forEach(function (n) {
        var it = items[n]; if (!it) return;
        it.stopped = true; it.hold = true; it.el.classList.add("done");
        it.x = Math.min(d[n][0] * W, Math.max(0, W - it.w));
        it.y = Math.min(d[n][1] * H, Math.max(0, H - it.h));
      });
    } catch (e) {}
  }

  var lastT = 0;
  function step(now) {
    var dt = lastT ? Math.min(0.05, (now - lastT) / 1000) : 0;
    lastT = now;


    var dist = VELOCITA * diag * dt;
    for (var n = 0; n < items.length; n++) {
      var it = items[n];
      if (it.hold) continue;
      it.x += it.vx * dist; it.y += it.vy * dist;
      if (it.x <= 0) { it.x = 0; it.vx = Math.abs(it.vx); }
      if (it.x + it.w >= W) { it.x = Math.max(0, W - it.w); it.vx = -Math.abs(it.vx); }
      if (it.y <= 0) { it.y = 0; it.vy = Math.abs(it.vy); }
      if (it.y + it.h >= H) { it.y = Math.max(0, H - it.h); it.vy = -Math.abs(it.vy); }
    }
    // urti tra le parole: rimbalzano invece di attraversarsi
    for (var i = 0; i < items.length; i++) {
      for (var j = i + 1; j < items.length; j++) {
        var a = items[i], b = items[j];
        var ox = Math.min(a.x + a.w, b.x + b.w) - Math.max(a.x, b.x);
        var oy = Math.min(a.y + a.h, b.y + b.h) - Math.max(a.y, b.y);
        if (ox <= 0 || oy <= 0) continue;
        if (ox < oy) {
          var dx = (a.x + a.w / 2) < (b.x + b.w / 2) ? -1 : 1;
          shift(a, b, dx * ox, 0);
          var tx = a.vx; a.vx = b.vx; b.vx = tx;
          if ((b.vx - a.vx) * -dx < 0) { a.vx = dx * Math.abs(a.vx); b.vx = -dx * Math.abs(b.vx); }
          if (a.hold) b.vx = -dx * Math.abs(b.vx);
          if (b.hold) a.vx = dx * Math.abs(a.vx);
        } else {
          var dy = (a.y + a.h / 2) < (b.y + b.h / 2) ? -1 : 1;
          shift(a, b, 0, dy * oy);
          var ty = a.vy; a.vy = b.vy; b.vy = ty;
          if ((b.vy - a.vy) * -dy < 0) { a.vy = dy * Math.abs(a.vy); b.vy = -dy * Math.abs(b.vy); }
          if (a.hold) b.vy = -dy * Math.abs(b.vy);
          if (b.hold) a.vy = dy * Math.abs(a.vy);
        }
      }
    }
    for (var m = 0; m < items.length; m++) {
      items[m].el.style.transform = "translate3d(" + items[m].x + "px," + items[m].y + "px,0)";
    }
    requestAnimationFrame(step);
  }

  // si ferma sotto il mouse o col focus, così è facile cliccare
  items.forEach(function (it) {
    ["mouseenter", "focus", "touchstart"].forEach(function (ev) {
      it.el.addEventListener(ev, function () { it.hold = true; }, { passive: true });
    });
    ["mouseleave", "blur", "touchend"].forEach(function (ev) {
      it.el.addEventListener(ev, function () { it.hold = it.stopped; });
    });
    // al clic la voce diventa rossa e resta ferma (finché non si esce dal sito)
    it.el.addEventListener("click", function () {
      it.stopped = true; it.hold = true;
      it.el.classList.add("done");
      save();
    });
  });
  // il CV si apre sempre nella versione più recente (niente copia vecchia dalla cache)
  var cv = document.querySelector('.float[href^="cv.pdf"]');
  if (cv) cv.addEventListener("click", function () { cv.href = "cv.pdf?v=" + Date.now(); });

  // tornando con "indietro" da un'altra pagina
  addEventListener("pageshow", function (e) {
    syncTree();
  });

  // ONLINE: lista dei lavori. Si chiude con la ×, con Esc o con "indietro" del browser
  var tree = document.getElementById("tree");
  var closeBtn = document.getElementById("close-tree");
  function syncTree() {
    var open = location.hash === "#online";
    tree.hidden = !open;
    if (open) closeBtn.focus();
  }
  function closeTree() {
    if (location.hash === "#online") history.back();
    else tree.hidden = true;
  }
  document.getElementById("online-btn").addEventListener("click", function (e) {
    e.preventDefault();
    if (location.hash !== "#online") history.pushState(null, "", "#online");
    syncTree();
  });
  closeBtn.addEventListener("click", closeTree);
  document.addEventListener("keydown", function (e) { if (e.key === "Escape" && !tree.hidden) closeTree(); });
  addEventListener("popstate", syncTree);
  addEventListener("hashchange", syncTree);

  // posizioni iniziali senza sovrapposizioni
  function place() {
    items.forEach(function (it, n) {
      for (var tries = 0; tries < 60; tries++) {
        it.x = Math.random() * Math.max(1, W - it.w);
        it.y = Math.random() * Math.max(1, H - it.h);
        var ok = true;
        for (var m = 0; m < n; m++) {
          var o = items[m];
          if (it.x < o.x + o.w && o.x < it.x + it.w && it.y < o.y + o.h && o.y < it.y + it.h) { ok = false; break; }
        }
        if (ok) break;
      }
      it.vx = (Math.random() < 0.5 ? -1 : 1) * (0.55 + Math.random() * 0.3);
      it.vy = (Math.random() < 0.5 ? -1 : 1) * (0.55 + Math.random() * 0.3);
    });
  }

  function go() { measure(); place(); restore(); syncTree(); requestAnimationFrame(step); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(go); else go();
  addEventListener("resize", function () {
    measure();
    items.forEach(function (it) {
      it.x = Math.min(it.x, Math.max(0, W - it.w));
      it.y = Math.min(it.y, Math.max(0, H - it.h));
    });
  });
})();
</script>

</body>
</html>
