/* SGUARDO (titolo provvisorio)
   La ricerca dell'osceno: ciò che sta fuori scena (ob-skené), portato davanti agli occhi.
   Una soggettiva: lo sguardo di qualcuno, con il suo respiro e la testa che si muove.
   Nel vuoto è frenetico, a scatti; quando incontra i corpi rallenta e scorre sulla pelle;
   quando trova i genitali si inchioda (oddio, l'ho trovato), zooma fin quasi a baciarli, resta,
   e se ne va. I dipinti stanno uno accanto all'altro: l'occhio passa sul quadro vicino e continua.
   I genitali li trova NudeNet (riconoscimento convertito in TFJS da Vladimir Mandic), che analizza
   nel browser solo il dipinto attuale e quello accanto. Solo figure adulte: nessun putto o bambino. */

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const R = Math.random, rr = (a, b) => a + R() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const CROP = 0.03, STEPS = [960, 1280, 1920, 3840];
const Z_MIN = 0.045, Z_MAX = 0.2;          // sempre vicino: non si deve capire quale dipinto è

/* ---------- opere da Wikimedia Commons ---------- */
async function infos(files) {
  const map = new Map();
  for (let i = 0; i < files.length; i += 40) {
    const t = files.slice(i, i + 40).map(f => 'File:' + f).join('|');
    const u = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*' +
              '&prop=imageinfo&iiprop=size|url|mime&iiurlwidth=1920&titles=' + encodeURIComponent(t);
    try {
      const j = await (await fetch(u)).json();
      const norm = {};
      for (const n of (j.query && j.query.normalized) || []) norm[n.to] = n.from;
      for (const p of Object.values((j.query && j.query.pages) || {})) {
        const ii = p.imageinfo && p.imageinfo[0];
        if (!ii || !ii.width || !ii.height || Math.min(ii.width, ii.height) < 650) continue;
        const v = { ar: ii.width / ii.height, width: ii.width, height: ii.height, url: ii.url, thumb: ii.thumburl || '', mime: ii.mime || '', size: ii.size || 0 };
        map.set((norm[p.title] || p.title).replace(/^File:/, '').replace(/_/g, ' '), v);
        map.set(p.title.replace(/^File:/, ''), v);
      }
    } catch (e) {}
  }
  return map;
}
const okOrig = ii => /jpeg|png/.test(ii.mime) && ii.size < 30e6;
function urlAt(ii, w) {
  if (w >= ii.width) return okOrig(ii) ? ii.url : ii.thumb;
  if (ii.thumb.includes('/1920px-')) return ii.thumb.replace('/1920px-', '/' + w + 'px-');
  return ii.thumb;
}
function hiSources(ii) {
  const step = STEPS.find(s => s >= ii.width * 3000 / ii.height) || 3840;
  return [...new Set([urlAt(ii, step), ii.thumb, okOrig(ii) ? ii.url : ''].filter(Boolean))];
}
function loadImg(srcs, cb, fail, needClean) {
  let k = 0, cors = true;
  const img = new Image(); img.decoding = 'async';
  const go = () => { if (cors) img.crossOrigin = 'anonymous'; else img.removeAttribute('crossorigin'); img.src = srcs[k]; };
  img.onload = async () => { try { if (img.decode) await img.decode(); } catch (e) {} cb(img, cors); };
  img.onerror = () => { if (cors && !needClean) { cors = false; go(); return; } cors = true; if (++k < srcs.length) go(); else fail(); };
  if (!srcs.length) { fail(); return; }
  go();
}
function cropToCanvas(img, maxH, maxW) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const sx = iw * CROP, sy = ih * CROP, sw = iw - 2 * sx, sh = ih - 2 * sy;
  const sc = Math.min(1, maxH / sh, maxW / sw);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw * sc)); c.height = Math.max(1, Math.round(sh * sc));
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
  g.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
function sub(src, x, y, w, h, max) {
  const sc = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * sc)); c.height = Math.max(1, Math.round(h * sc));
  c.getContext('2d').drawImage(src, x, y, w, h, 0, 0, c.width, c.height);
  return c;
}

/* ---------- pelle: punti e mappa ---------- */
function skinPoints(c, p) {
  try {
    const g = sub(c, 0, 0, c.width, c.height, 96).getContext('2d');
    const w = g.canvas.width, h = g.canvas.height;
    const d = g.getImageData(0, 0, w, h).data, out = [], grid = new Uint8Array(w * h);
    for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
      const i = (y * w + x) * 4, r = d[i], gg = d[i + 1], b = d[i + 2];
      const sk = r > 90 && gg > 40 && b > 20 && r > gg && r > b && r - Math.min(gg, b) > 15 && Math.abs(r - gg) > 12;
      grid[y * w + x] = sk ? 1 : 0;
      if (sk && x % 2 && y % 2) out.push({ u: x / w, v: y / h });
    }
    if (p) p.grid = { w, h, d: grid };
    for (let i = out.length - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; [out[i], out[j]] = [out[j], out[i]]; }
    return out.slice(0, 80);
  } catch (e) { return []; }
}

/* ---------- genitali: NudeNet ---------- */
const STOP = { 13: 'vulva', 15: 'pene' };            // solo genitali
let model = null, busy = false;
async function runOn(c, ox, oy, sw, sh, out) {
  const input = tf.tidy(() => tf.expandDims(tf.cast(tf.browser.fromPixels(c), 'float32'), 0));
  const outs = await model.executeAsync(input, ['output1', 'output2', 'output3']);
  const boxes = await outs[0].array(), scores = await outs[1].data(), classes = await outs[2].data();
  tf.dispose([input, ...outs]);
  for (let i = 0; i < scores.length; i++) {
    const k = classes[i];
    if (scores[i] < 0.22 || !STOP[k]) continue;
    const [x1, y1, x2, y2] = boxes[0][i];
    const u = ox + (x1 + x2) / 2 / c.width * sw, v = oy + (y1 + y2) / 2 / c.height * sh;
    if (u < 0 || u > 1 || v < 0 || v > 1) continue;
    out.push({ u, v, s: clamp(Math.abs(y2 - y1) / c.height * sh, 0.01, 0.3), sc: scores[i] });
  }
  await new Promise(r => setTimeout(r, 60));          // respiro per il browser
}
async function detect(p) {
  if (!model || busy || !p.small || p.det) return;
  busy = true;
  try {
    const c = p.small, W = c.width, H = c.height, out = [];
    await runOn(sub(c, 0, 0, W, H, 960), 0, 0, 1, 1, out);
    for (const [a, b] of [[0, 0], [0.45, 0], [0, 0.45], [0.45, 0.45]])
      await runOn(sub(c, a * W, b * H, 0.55 * W, 0.55 * H, 720), a, b, 0.55, 0.55, out);
    out.sort((a, b) => b.sc - a.sc);
    const keep = [];
    for (const f of out) if (!keep.some(g => Math.hypot(g.u - f.u, g.v - f.v) < Math.max(g.s, f.s) * 0.6)) keep.push(f);
    p.foc = keep;
  } catch (e) {}
  p.det = true; p.small.width = p.small.height = 0; p.small = null;
  busy = false;
}
async function loadModel() {
  try {
    if (!window.tf) return;
    await tf.ready();
    model = await tf.loadGraphModel('model/model.json');
  } catch (e) { model = null; }
}

/* ---------- preparazione: solo il dipinto attuale e quello accanto ---------- */
let pool = [], recent = [];
function prepare(p) {
  if (p.st) return;
  p.st = 1;
  loadImg([urlAt(p.ii, 1280), p.ii.thumb], img => {
    p.small = cropToCanvas(img, 1600, 1600);
    p.skin = skinPoints(p.small, p);
    loadImg(hiSources(p.ii), im => { p.hi = cropToCanvas(im, 4000, 7000); p.st = 2; }, () => { p.st = 3; });
  }, () => {
    loadImg(hiSources(p.ii), im => { p.hi = cropToCanvas(im, 4000, 7000); p.skin = []; p.st = 2; }, () => { p.st = 3; });
  }, true);
}
function release(p) {
  if (p.hi) { p.hi.width = p.hi.height = 0; p.hi = null; }
  if (p.small) { p.small.width = p.small.height = 0; p.small = null; }
  p.st = 0; p.det = false; p.visited = [];
}
function chooseNext(cur) {
  const c = pool.filter(p => p !== cur && p.st !== 3 && !recent.includes(p));
  const list = c.length ? c : pool.filter(p => p !== cur && p.st !== 3);
  const withG = list.filter(p => p.foc && p.foc.length);   // preferisce chi ha già mostrato genitali
  const L = (withG.length && R() < 0.5) ? withG : list;
  return L[(R() * L.length) | 0] || null;
}

/* ---------- l'occhio: il vecchio porco ---------- */
// i dipinti stanno uno accanto all'altro: il prossimo viene messo a destra o a sinistra
// di quello attuale, e l'occhio ci passa sopra
let cur = null, nxt = null, old = null, crossing = false, hops = 0;
const eye = { x: 0, y: 0.5, z: 0.15 };
let segs = [], seg = null, clock = 0, prev = performance.now(), aspect = 16 / 9;
const ZS = () => rr(0.1, 0.19);                        // ampiezza della ricerca
const kissZ = g => clamp(g.s * rr(0.35, 0.6), 0.008, 0.04);   // quasi a baciarli

function world(p, u, v) { return { x: p.ox + u * p.ar, y: v }; }
function stops(p) { return (p.foc || []).map((f, i) => Object.assign(world(p, f.u, f.v), { s: f.s, id: i })).filter(g => !(p.visited || []).includes(g.id)); }
function skins(p) { return (p.skin || []).map(q => world(p, q.u, q.v)); }
function panelAt(x) { for (const p of [cur, nxt, old]) if (p && p.ox !== undefined && x >= p.ox && x < p.ox + p.ar) return p; return null; }
function skinAt(x, y) {                                // quanta pelle c'è sotto lo sguardo (0..1)
  const p = panelAt(x); if (!p || !p.grid) return 0;
  const G = p.grid, gx = Math.round((x - p.ox) / p.ar * G.w), gy = Math.round(y * G.h);
  let s = 0, n = 0;
  for (let j = -2; j <= 2; j++) for (let i = -2; i <= 2; i++) {
    const xx = gx + i, yy = gy + j; if (xx < 0 || yy < 0 || xx >= G.w || yy >= G.h) continue;
    s += G.d[yy * G.w + xx]; n++;
  }
  return n ? s / n : 0;
}
function placeNext() {
  nxt = chooseNext(cur); if (!nxt) return;
  nxt.side = old ? (old.ox < cur.ox ? 1 : -1) : (R() < 0.5 ? 1 : -1);   // mai sopra il dipinto appena lasciato
  prepare(nxt);
}
function setOx() { if (nxt) nxt.ox = nxt.side > 0 ? cur.ox + cur.ar : cur.ox - nxt.ar; }

const E = {
  sine: t => 0.5 - 0.5 * Math.cos(Math.PI * t),
  halt: t => 1 - Math.pow(1 - t, 4),                 // arriva e si inchioda
  sacc: t => 1 - Math.pow(1 - t, 3),
  slow: t => t * t * (3 - 2 * t)
};
function push(o) { segs.push(Object.assign({ dur: 1, ease: E.sine, hold: 0 }, o)); }
function near(list, r) { return list.filter(q => Math.hypot(q.x - eye.x, q.y - eye.y) < r); }
function plan() {
  if (!cur) return;
  const g = stops(cur), here = skinAt(eye.x, eye.y);
  const ready = nxt && nxt.st === 2 && (nxt.det || !model);
  if (ready && (hops > 9 || (!g.length && hops > 4))) {
    // passa sul dipinto accanto, di corsa
    setOx();
    const gn = stops(nxt), sk = skins(nxt);
    const t = gn.length && R() < 0.5 ? gn[(R() * gn.length) | 0] : sk.length ? sk[(R() * sk.length) | 0] : world(nxt, 0.5, 0.5);
    crossing = true;
    const d = Math.abs(t.x - eye.x);
    push({ x: t.x, y: t.y, z: ZS(), dur: clamp(d * 1.6, 1.6, 4.5), ease: E.sine, arrive: true });
    hops = 0;
    return;
  }
  hops++;
  if (g.length && (R() < 0.35 || near(g, 0.45).length)) {
    // il segno: corre, rallenta avvicinandosi, si inchioda, poi zooma fin quasi a toccare, poi via
    const t = g.sort((a, b) => Math.hypot(a.x - eye.x, a.y - eye.y) - Math.hypot(b.x - eye.x, b.y - eye.y))[0];
    cur.visited = cur.visited || []; cur.visited.push(t.id);
    const z = ZS(), d = Math.hypot(t.x - eye.x, t.y - eye.y), kz = kissZ(t);
    if (d > z * 1.5) {
      const k = 1 - z * 1.2 / d;
      push({ x: eye.x + (t.x - eye.x) * k, y: eye.y + (t.y - eye.y) * k, z, dur: clamp(d * 0.9, 0.4, 1.6), ease: E.sacc });
    }
    push({ x: t.x, y: t.y, z: z * 0.85, dur: rr(1.4, 2.6), ease: E.halt, hold: rr(0.8, 1.6), shake: 1 });
    push({ x: t.x, y: t.y, z: kz, dur: rr(3, 5.5), ease: E.slow, hold: rr(3, 6.5), creep: 0.12, kiss: 1 });
    push({ x: t.x + rr(-0.8, 0.8) * z, y: t.y + rr(-0.5, 0.5) * z, z: ZS(), dur: rr(0.6, 1.2), ease: E.sacc });
    return;
  }
  const sk = skins(cur);
  if (here > 0.35) {
    // sui corpi: rallenta, scorre sulla pelle
    const n = near(sk, 0.3), t = n.length ? n[(R() * n.length) | 0] : { x: eye.x + rr(-0.15, 0.15), y: eye.y + rr(-0.15, 0.15) };
    push({ x: t.x, y: t.y, z: ZS() * 0.9, dur: rr(1.4, 3), ease: E.sine, hold: rr(0, 0.5) });
    return;
  }
  // nel vuoto: frenetico, scatti nervosi, finché non trova pelle
  const n = 2 + ((R() * 4) | 0);
  for (let i = 0; i < n; i++) {
    const toSkin = sk.length && R() < 0.45;
    const t = toSkin ? sk[(R() * sk.length) | 0] : { x: eye.x + rr(-0.35, 0.35), y: eye.y + rr(-0.3, 0.3) };
    push({ x: t.x, y: t.y, z: ZS(), dur: rr(0.16, 0.45), ease: E.sacc, hold: rr(0.03, 0.25) });
    if (toSkin) break;
  }
}
function bounds(z) {
  const vw = z * aspect;
  let L = cur.ox, Rr = cur.ox + cur.ar;
  if (crossing && nxt && nxt.ox !== undefined) { L = Math.min(L, nxt.ox); Rr = Math.max(Rr, nxt.ox + nxt.ar); }
  if (old) { L = Math.min(L, old.ox); Rr = Math.max(Rr, old.ox + old.ar); }
  return { L: L + vw / 2, R: Math.max(L + vw / 2, Rr - vw / 2) };
}
let kissing = false;
function stepEye() {
  if (!seg) {
    if (!segs.length) plan();
    seg = segs.shift();
    if (!seg) return;
    seg.t0 = clock; seg.x0 = eye.x; seg.y0 = eye.y; seg.z0 = eye.z;
  }
  kissing = !!seg.kiss;
  const t = (clock - seg.t0) / seg.dur;
  if (t < 1) {
    const e = seg.ease(t);
    eye.x = seg.x0 + (seg.x - seg.x0) * e;
    eye.y = seg.y0 + (seg.y - seg.y0) * e;
    eye.z = Math.exp(Math.log(seg.z0) + (Math.log(seg.z) - Math.log(seg.z0)) * e);
  } else if (clock - seg.t0 < seg.dur + seg.hold) {
    const h = clock - seg.t0 - seg.dur;
    eye.x = seg.x; eye.y = seg.y;
    if (seg.shake) {                                 // oddio, l'ho trovato
      const a = Math.exp(-h * 3) * 0.04 * eye.z;
      eye.x += Math.sin(h * 31) * a; eye.y += Math.sin(h * 23 + 1) * a;
    }
    if (seg.creep) eye.z = seg.z * (1 - seg.creep * E.sine(Math.min(1, h / seg.hold)));
  } else {
    if (seg.arrive) {
      old = cur; cur = nxt; nxt = null; crossing = false;
      recent.push(cur); if (recent.length > Math.max(3, pool.length - 3)) recent.shift();
    }
    seg = null;
  }
  eye.z = clamp(eye.z, 0.006, 0.9);
  const b = bounds(eye.z);
  eye.x = clamp(eye.x, b.L, b.R); eye.y = clamp(eye.y, eye.z / 2, 1 - eye.z / 2);
  if (old) {
    const vw = eye.z * aspect;
    if (old.ox + old.ar < eye.x - vw / 2 - 0.05 || old.ox > eye.x + vw / 2 + 0.05) { release(old); old = null; }
  }
}

/* ---------- la soggettiva: respiro, testa, palpebre ---------- */
let vignette = null, last = { x: 0, y: 0, z: 1 };
function makeVignette() {
  vignette = document.createElement('canvas');
  vignette.width = cv.width; vignette.height = cv.height;
  const g = vignette.getContext('2d'), W = cv.width, H = cv.height;
  const gr = g.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.25, W / 2, H / 2, Math.hypot(W, H) * 0.56);
  gr.addColorStop(0, 'rgba(0,0,0,0)'); gr.addColorStop(0.7, 'rgba(0,0,0,0.25)'); gr.addColorStop(1, 'rgba(0,0,0,0.85)');
  g.fillStyle = gr; g.fillRect(0, 0, W, H);
}
function resize() {
  const d = Math.min(1.5, window.devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d);
  aspect = cv.width / cv.height;
  makeVignette();
}
addEventListener('resize', resize); resize();
function drawPanel(p, L, T, vw, z, s) {
  const src = p && p.hi; if (!src || p.ox === undefined) return;
  const a = Math.max(L, p.ox), b = Math.min(L + vw, p.ox + p.ar), t = Math.max(T, 0), u = Math.min(T + z, 1);
  if (b <= a || u <= t) return;
  const k = src.height;
  ctx.drawImage(src, (a - p.ox) * k, t * k, (b - a) * k, (u - t) * k,
                Math.floor((a - L) * s), Math.floor((t - T) * s), Math.ceil((b - a) * s) + 1, Math.ceil((u - t) * s) + 1);
}
const hasFilter = 'filter' in ctx;

function frame(now) {
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now; clock += dt;
  if (!cur) {
    const p = pool.find(q => q.st === 2);
    if (p) {
      cur = p; cur.ox = 0; recent.push(p);
      const sk = skins(p), t = sk.length ? sk[(R() * sk.length) | 0] : world(p, 0.5, 0.5);
      eye.x = t.x; eye.y = t.y; eye.z = ZS(); last = { ...eye };
    }
  } else {
    if (!nxt) placeNext();
    if (nxt && nxt.st === 3) nxt = null;
    if (nxt && nxt.small && !nxt.det) detect(nxt);
    if (cur.small && !cur.det) detect(cur);
    if (!crossing) setOx();
    stepEye();
  }
  const W = cv.width, H = cv.height;
  if (!cur) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); requestAnimationFrame(frame); return; }

  // velocità dello sguardo (in schermi al secondo): scie e fuoco perso quando corre
  const speed = (Math.hypot(eye.x - last.x, eye.y - last.y) / eye.z + Math.abs(Math.log(eye.z / last.z))) / Math.max(dt, 1e-3);
  last = { ...eye };
  const trail = clamp((speed - 1.2) / 6, 0, 0.75);
  if (trail < 0.02) { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H); }

  // testa e respiro di qualcuno che guarda
  const calm = kissing ? 0.4 : 1;
  const z0 = eye.z * (1 + 0.012 * Math.sin(clock * 1.55) * calm);
  const hx = z0 * calm * (0.010 * Math.sin(clock * 0.53) + 0.006 * Math.sin(clock * 1.31 + 2) + 0.0015 * Math.sin(clock * 12.7));
  const hy = z0 * calm * (0.008 * Math.sin(clock * 0.47 + 1) + 0.007 * Math.sin(clock * 1.55) + 0.0015 * Math.sin(clock * 11.3 + 0.4));
  const vw = z0 * aspect, L = eye.x + hx - vw / 2, T = eye.y + hy - z0 / 2, s = H / z0;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  ctx.globalAlpha = 1 - trail;
  if (hasFilter) { const bl = clamp((speed - 2.5) * 0.9, 0, 6) * H / 1000; ctx.filter = bl > 0.3 ? 'blur(' + bl.toFixed(1) + 'px)' : 'none'; }
  drawPanel(old, L, T, vw, z0, s); drawPanel(cur, L, T, vw, z0, s); drawPanel(nxt, L, T, vw, z0, s);
  if (hasFilter) ctx.filter = 'none';
  ctx.globalAlpha = 1;
  ctx.drawImage(vignette, 0, 0);

  requestAnimationFrame(frame);
}

(async () => {
  const map = await infos(WORKS.flatMap(w => w.f));
  for (const w of WORKS) {
    const f = w.f.find(n => map.has(n));
    if (f) pool.push({ ii: map.get(f), ar: map.get(f).ar, year: w.y, st: 0, hi: null, small: null, skin: [], foc: [], det: false, visited: [] });
  }
  if (!pool.length) return;
  prepare(pool[(R() * pool.length) | 0]);
  requestAnimationFrame(frame);
  loadModel();
})();

/* ---------- schermo intero e cursore ---------- */
let idleT;
addEventListener('mousemove', () => {
  document.body.classList.remove('idle'); clearTimeout(idleT);
  idleT = setTimeout(() => document.body.classList.add('idle'), 1500);
});
function toggleFS() {
  if (!document.fullscreenElement) { const r = document.documentElement.requestFullscreen; if (r) r.call(document.documentElement).catch(() => {}); }
  else if (document.exitFullscreen) document.exitFullscreen();
}
addEventListener('click', toggleFS);
addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') toggleFS(); });
}
</script>
