<body>
<canvas id="c"></canvas>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script>
{
/* SGUARDO (titolo provvisorio)
   Un grande tavolo: dipinti di nudo di tutte le epoche, accostati uno all'altro senza sfumature,
   in un ordine diverso a ogni visita. Un occhio ci corre sopra cercando vulve, seni, culi, peni:
   ci va, zooma, indugia, salta al dettaglio vicino, poi cambia idea, si ritrae e riparte.
   I punti li trova NudeNet (modello di riconoscimento, convertito in TFJS da Vladimir Mandic)
   che analizza ogni dipinto nel browser; finché non è pronto l'occhio cerca la pelle dipinta.
   Solo figure adulte: nessun putto, Cupido o bambino. */

const WORKS = [
  { y: -70,  f: ['Casa dei vettii, vestibolo, priapo che poggia il fallo sulla bilancia 01.jpg', 'Pompeii House of the Vettii 01.jpg'] },
  { y: 1432, f: ['Lamgods open.jpg'] },
  { y: 1485, f: ['Sandro Botticelli - La nascita di Venere - Google Art Project - edited.jpg', 'La naissance de Vénus, Boticelli.jpg'] },
  { y: 1500, f: ['The Garden of Earthly Delights by Bosch High Resolution 2.jpg'] },
  { y: 1502, f: ['Orvieto107.jpg', 'Signorelli Resurrection.jpg'] },
  { y: 1507, f: ['Albrecht Dürer - Adam (Prado).jpg'] },
  { y: 1507.5, f: ['Albrecht Dürer - Eve (Prado).jpg'] },
  { y: 1510, f: ['Giorgione - Sleeping Venus - Google Art Project 2.jpg'] },
  { y: 1516, f: ['Jan Gossaert 008.jpg'] },
  { y: 1520, f: ["Titian (Tiziano Vecellio) - Venus Rising from the Sea ('Venus Anadyomene') - Google Art Project.jpg"] },
  { y: 1538, f: ['Tiziano - Venere di Urbino - Google Art Project.jpg'] },
  { y: 1541, f: ['Last Judgement (Michelangelo).jpg', 'Last Judgement by Michelangelo.jpg'] },
  { y: 1546, f: ['Lucas Cranach - Der Jungbrunnen (Gemäldegalerie Berlin).jpg', 'Lucas Cranach (I) - Jungbrunnen - Gemäldegalerie Berlin.jpg'] },
  { y: 1553, f: ['Tizian - Danae receiving the Golden Rain - Prado.jpg'] },
  { y: 1610, f: ['Susanna and the Elders (1610), Artemisia Gentileschi.jpg'] },
  { y: 1654, f: ['Rembrandt Harmensz. van Rijn 016.jpg'] },
  { y: 1798, f: ['Goya Maja naga2.jpg'] },
  { y: 1814, f: ['Jean Auguste Dominique Ingres, La Grande Odalisque, 1814.jpg'] },
  { y: 1853, f: ['Les Baigneuses-Courbet.jpg'] },
  { y: 1861, f: ['Jean-Léon Gérôme, Phryne revealed before the Areopagus (1861) - 01.jpg'] },
  { y: 1862, f: ['Le Bain Turc, by Jean Auguste Dominique Ingres, from C2RMFFXD.jpg', 'Le Bain Turc, by Jean Auguste Dominique Ingres, from C2RMF retouched.jpg'] },
  { y: 1863, f: ['Edouard Manet - Luncheon on the Grass - Google Art Project.jpg'] },
  { y: 1863.5, f: ['Edouard Manet - Olympia - Google Art Project 3.jpg'] },
  { y: 1866, f: ['Gustave Courbet - The Origin of the World - WGA05503.jpg', 'Courbet-origine-monde.jpg'] },
  { y: 1866.2, f: ['Gustave Courbet - Le Sommeil (1866), Paris, Petit Palais.jpg'] },
  { y: 1866.5, f: ['Gustave Courbet - Woman with a Parrot - Google Art Project.jpg'] },
  { y: 1873, f: ['William-Adolphe Bouguereau (1825-1905) - Nymphs and Satyr (1873) HQ.jpg', 'William-Adolphe Bouguereau (1825-1905) - Nymphs and Satyr (1873).jpg'] },
  { y: 1884, f: ['Gustave Caillebotte -Man at His Bath.jpg'] },
  { y: 1906, f: ['Paula Moderson-Becker - Selbstbildnis am 6 Hochzeitstag (1906).jpg'] },
  { y: 1906.5, f: ['Paul Cézanne - Les Grandes Baigneuses (The Large Bathers) - Google Art Project.jpg'] },
  { y: 1907, f: ['Gustav Klimt 010.jpg'] },
  { y: 1916, f: ['Amedeo Modigliani, 1916, Reclining Nude (Nu couché), oil on canvas, 65.5 x 87 cm, Foundation E.G. Bührle.jpg'] },
  { y: 1917, f: ['Amedeo Modigliani 012.jpg'] },
  { y: 1917.5, f: ['Amedeo Modigliani 014.jpg'] }
];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const R = Math.random, rr = (a, b) => a + R() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const CROP = 0.02, TARGET_H = 3400, STEPS = [960, 1280, 1920, 3840];
const Z_MIN = 0.05;

/* ---------- opere da Wikimedia Commons ---------- */
async function infos(files) {
  const map = new Map();
  for (let i = 0; i < files.length; i += 40) {
    const t = files.slice(i, i + 40).map(f => 'File:' + f).join('|');
    const u = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*' +
              '&prop=imageinfo&iiprop=size|url|mime&iiurlwidth=1920&titles=' + encodeURIComponent(t);
    try {
      const j = await (await fetch(u)).json();
      const norm = {};
      for (const n of (j.query && j.query.normalized) || []) norm[n.to] = n.from;
      for (const p of Object.values((j.query && j.query.pages) || {})) {
        const ii = p.imageinfo && p.imageinfo[0];
        if (!ii || !ii.width || !ii.height || Math.min(ii.width, ii.height) < 650) continue;
        const v = { ar: ii.width / ii.height, width: ii.width, height: ii.height, url: ii.url, thumb: ii.thumburl || '', mime: ii.mime || '', size: ii.size || 0 };
        map.set((norm[p.title] || p.title).replace(/^File:/, '').replace(/_/g, ' '), v);
        map.set(p.title.replace(/^File:/, ''), v);
      }
    } catch (e) {}
  }
  return map;
}
const okOrig = ii => /jpeg|png/.test(ii.mime) && ii.size < 30e6;
function urlAt(ii, w) {                          // versione a una certa larghezza
  if (w >= ii.width) return okOrig(ii) ? ii.url : ii.thumb;
  if (ii.thumb.includes('/1920px-')) return ii.thumb.replace('/1920px-', '/' + w + 'px-');
  return ii.thumb;
}
function hiSources(ii) {
  const step = STEPS.find(s => s >= ii.width * TARGET_H / ii.height) || 3840;
  return [...new Set([urlAt(ii, step), ii.thumb, okOrig(ii) ? ii.url : ''].filter(Boolean))];
}
function loadImg(srcs, cb, fail) {                // prova con CORS, poi senza, poi la fonte successiva
  let k = 0, cors = true;
  const img = new Image(); img.decoding = 'async';
  const go = () => { if (cors) img.crossOrigin = 'anonymous'; else img.removeAttribute('crossorigin'); img.src = srcs[k]; };
  img.onload = async () => { try { if (img.decode) await img.decode(); } catch (e) {} cb(img, cors); };
  img.onerror = () => { if (cors) { cors = false; go(); return; } cors = true; if (++k < srcs.length) go(); else fail(); };
  if (!srcs.length) { fail(); return; }
  go();
}
function cropToCanvas(img, maxH, maxW) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const sx = iw * CROP, sy = ih * CROP, sw = iw - 2 * sx, sh = ih - 2 * sy;
  const sc = Math.min(1, maxH / sh, maxW / sw);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw * sc)); c.height = Math.max(1, Math.round(sh * sc));
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
  g.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}

/* ---------- il tavolo ---------- */
let panels = [], TW = 1, TH = 1;
function buildTable(list) {
  for (let i = list.length - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; [list[i], list[j]] = [list[j], list[i]]; }
  const S = list.reduce((a, p) => a + p.ar, 0);
  const rows = Math.max(2, Math.round(Math.sqrt(S / 2.2)));
  TW = S / rows;
  let y = 0, row = [], sum = 0;
  const place = h => { let x = (TW - sum * h) / 2; for (const p of row) { p.x = x; p.y = y; p.h = h; p.w = p.ar * h; x += p.w; } y += h; row = []; sum = 0; };
  for (const p of list) { row.push(p); sum += p.ar; if (sum >= TW) place(TW / sum); }
  if (row.length) place(Math.min(TW / sum, 1.6));   // ultima riga
  TH = y;
  panels = list;
}

/* ---------- dove guardare: pelle (riserva) ---------- */
function skinFocals(c) {
  try {
    const W = 96, H = Math.max(8, Math.round(96 * c.height / c.width));
    const t = document.createElement('canvas'); t.width = W; t.height = H;
    const g = t.getContext('2d'); g.drawImage(c, 0, 0, W, H);
    const d = g.getImageData(0, 0, W, H).data, m = new Float32Array(W * H);
    for (let i = 0; i < W * H; i++) {
      const r = d[i * 4], gg = d[i * 4 + 1], b = d[i * 4 + 2];
      m[i] = (r > 90 && gg > 40 && b > 20 && r > gg && r > b && r - Math.min(gg, b) > 15 && Math.abs(r - gg) > 12) ? 1 : 0;
    }
    const rad = Math.max(2, Math.round(W / 16)), dens = new Float32Array(W * H);
    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
      let s = 0;
      for (let yy = Math.max(0, y - rad); yy <= Math.min(H - 1, y + rad); yy += 2)
        for (let xx = Math.max(0, x - rad); xx <= Math.min(W - 1, x + rad); xx += 2) s += m[yy * W + xx];
      dens[y * W + x] = s;
    }
    const out = [];
    for (let n = 0; n < 4; n++) {
      let best = -1, bi = 0;
      for (let i = 0; i < W * H; i++) if (dens[i] > best) { best = dens[i]; bi = i; }
      if (best < rad * rad * 0.35) break;
      const bx = bi % W, by = (bi / W) | 0;
      out.push({ u: bx / W, v: by / H, s: 0.14, k: 'pelle', w: 0.6 });
      for (let y = Math.max(0, by - rad * 2); y < Math.min(H, by + rad * 2); y++)
        for (let x = Math.max(0, bx - rad * 2); x < Math.min(W, bx + rad * 2); x++) dens[y * W + x] = 0;
    }
    return out;
  } catch (e) { return []; }
}

/* ---------- dove guardare: NudeNet ---------- */
const LABELS = ['pancia', 'culo', 'seno', 'vulva', 'pene', 'petto'];
const WEIGHT = { 1: 1.6, 2: 2.2, 3: 3.5, 4: 3.5 };
let model = null, busy = false; const dq = [];
async function runOn(c, ox, oy, sw, sh, out) {
  // c: canvas del ritaglio; ox,oy,sw,sh: posizione del ritaglio nel dipinto (0..1)
  const input = tf.tidy(() => tf.expandDims(tf.cast(tf.browser.fromPixels(c), 'float32'), 0));
  const outs = await model.executeAsync(input, ['output1', 'output2', 'output3']);
  const boxes = await outs[0].array(), scores = await outs[1].data(), classes = await outs[2].data();
  tf.dispose([input, ...outs]);
  for (let i = 0; i < scores.length; i++) {
    const k = classes[i];
    if (scores[i] < 0.25 || !WEIGHT[k]) continue;
    const [x1, y1, x2, y2] = boxes[0][i];
    const u = ox + (x1 + x2) / 2 / c.width * sw, v = oy + (y1 + y2) / 2 / c.height * sh;
    if (u < 0 || u > 1 || v < 0 || v > 1) continue;
    out.push({ u, v, s: clamp(Math.abs(y2 - y1) / c.height * sh, 0.015, 0.4), k: LABELS[k], w: WEIGHT[k] * scores[i] });
  }
}
function sub(src, x, y, w, h, max) {
  const sc = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * sc)); c.height = Math.max(1, Math.round(h * sc));
  c.getContext('2d').drawImage(src, x, y, w, h, 0, 0, c.width, c.height);
  return c;
}
async function detect(p) {
  // dipinto a 1920 px: un passaggio intero + quattro riquadri, per trovare anche i corpi piccoli
  const img = await new Promise(res => loadImg([urlAt(p.ii, 1920)], (im, clean) => res(clean ? im : null), () => res(null)));
  if (!img) return;
  const c = cropToCanvas(img, 2400, 2400), W = c.width, H = c.height, out = [];
  await runOn(sub(c, 0, 0, W, H, 1280), 0, 0, 1, 1, out);
  if (W * H > 900 * 900) {
    for (const [a, b] of [[0, 0], [0.4, 0], [0, 0.4], [0.4, 0.4]])
      await runOn(sub(c, a * W, b * H, 0.6 * W, 0.6 * H, 1024), a, b, 0.6, 0.6, out);
  }
  c.width = c.height = 0;
  out.sort((a, b) => b.w - a.w);                 // unisce i doppioni
  const keep = [];
  for (const f of out) if (!keep.some(g => Math.hypot(g.u - f.u, g.v - f.v) < Math.max(g.s, f.s) * 0.5)) keep.push(f);
  if (keep.length) p.foc = keep;
}
function queueDetect(p) { if (!dq.includes(p)) dq.push(p); pump(); }
async function pump() {
  if (!model || busy || !dq.length) return;
  busy = true;
  dq.sort((a, b) => dist(a) - dist(b));          // prima i dipinti vicini all'occhio
  const p = dq.shift();
  try { await detect(p); } catch (e) {}
  busy = false;
  setTimeout(pump, 20);
}
async function loadModel() {
  try {
    if (!window.tf) return;
    await tf.ready();
    model = await tf.loadGraphModel('model/model.json');
    pump();
  } catch (e) { model = null; }
}

/* ---------- caricamento: piccolo per tutti, grande vicino all'occhio ---------- */
function loadLo(p) {
  p.loSt = 1;
  loadImg([urlAt(p.ii, 960), p.ii.thumb].filter(Boolean), (img, clean) => {
    p.lo = cropToCanvas(img, 1400, 1400); p.loSt = 2;
    if (clean) { p.foc = p.foc || skinFocals(p.lo); queueDetect(p); } else p.foc = p.foc || [];
  }, () => { p.loSt = 3; });
}
function loadHi(p) {
  p.hiSt = 1;
  loadImg(hiSources(p.ii), img => {
    if (p.hiSt !== 1) return;
    p.hi = cropToCanvas(img, 4600, 8000); p.hiSt = 2;
  }, () => { p.hiSt = 3; });
}
const cam = { x: 0, y: 0, z: 1 };
let aspect = 16 / 9;
function dist(p) {
  const dx = Math.max(p.x - cam.x, 0, cam.x - (p.x + p.w)), dy = Math.max(p.y - cam.y, 0, cam.y - (p.y + p.h));
  return Math.hypot(dx, dy);
}
function maintain(target) {
  const vw = cam.z * aspect, L = cam.x - vw / 2 - 0.3, Rr = cam.x + vw / 2 + 0.3, T = cam.y - cam.z / 2 - 0.3, B = cam.y + cam.z / 2 + 0.3;
  const want = panels.filter(p => p.loSt !== 3 && cam.z < 1.2 * p.h &&
    ((p.x < Rr && p.x + p.w > L && p.y < B && p.y + p.h > T) ||
     (target && target.x >= p.x && target.x <= p.x + p.w && target.y >= p.y && target.y <= p.y + p.h)));
  let loading = panels.filter(p => p.hiSt === 1).length;
  for (const p of want) { if (loading >= 2) break; if (!p.hiSt) { loadHi(p); loading++; } }
  const loaded = panels.filter(p => p.hiSt === 2 && !want.includes(p)).sort((a, b) => dist(b) - dist(a));
  const total = panels.filter(p => p.hiSt === 2).length;
  for (let i = 0; i < loaded.length && (total - i > 5 || dist(loaded[i]) > 2.5); i++) {
    const p = loaded[i]; p.hi.width = p.hi.height = 0; p.hi = null; p.hiSt = 0;
  }
}

/* ---------- l'occhio ---------- */
let started = false, mv = null, clock = 0, prev = performance.now(), recent = [], lastFoc = null, target = null;
function allFocals() {
  const out = [];
  for (const p of panels) if (p.foc) for (const f of p.foc)
    out.push({ x: p.x + f.u * p.w, y: p.y + f.v * p.h, s: f.s * p.h, w: f.w, k: f.k, p, f });
  return out;
}
function pick(list) {
  let t = 0; for (const f of list) t += f.w; let r = R() * t;
  for (const f of list) if ((r -= f.w) <= 0) return f;
  return list[list.length - 1];
}
function clampView(x, y, z) {
  z = clamp(z, Z_MIN, Math.max(Z_MIN, Math.min(TH, TW / aspect)));
  const vw = z * aspect;
  return { x: TW > vw ? clamp(x, vw / 2, TW - vw / 2) : TW / 2, y: TH > z ? clamp(y, z / 2, TH - z / 2) : TH / 2, z };
}
function go(x, y, z, dur, ease, bump, hold, creep) {
  const c = clampView(x, y, z);
  mv = { t0: clock, dur, ease, x0: cam.x, y0: cam.y, z0: cam.z, x1: c.x, y1: c.y, z1: c.z, bump: bump || 0, hold: hold || 0, creep: creep || 0 };
}
const easeSine = t => 0.5 - 0.5 * Math.cos(Math.PI * t);
const easeSacc = t => 1 - Math.pow(1 - t, 3);
const zFor = f => clamp(f.s * rr(1.5, 2.6), Z_MIN, 0.4);

function decide() {
  const F = allFocals().filter(f => !recent.includes(f.f));
  if (lastFoc && R() < 0.35) {                   // salta al dettaglio vicino
    const near = F.filter(f => Math.hypot(f.x - lastFoc.x, f.y - lastFoc.y) < 0.5 && f.f !== lastFoc.f);
    if (near.length) { visit(pick(near), true); return; }
  }
  if (lastFoc && R() < 0.18) {                   // cambia idea: si ritrae, guarda il tavolo
    lastFoc = null;
    go(cam.x + rr(-0.6, 0.6), cam.y + rr(-0.4, 0.4), rr(0.6, 1.3), rr(1.0, 1.8), easeSine, 0, rr(0.3, 1.0));
    return;
  }
  if (F.length) {
    const cand = F.map(f => Object.assign({}, f, { w: f.w / Math.pow(0.3 + Math.hypot(f.x - cam.x, f.y - cam.y), 1.6) }));
    visit(pick(cand), false);
    return;
  }
  go(rr(0, TW), rr(0, TH), rr(0.3, 0.8), rr(2, 4), easeSine, 0.2, rr(0.2, 0.8));   // niente ancora: vaga
}
function visit(f, hop) {
  lastFoc = f; target = f;
  recent.push(f.f); if (recent.length > 8) recent.shift();
  const d = Math.hypot(f.x - cam.x, f.y - cam.y);
  if (hop) go(f.x, f.y, zFor(f), rr(0.25, 0.5), easeSacc, 0, rr(1.5, 4), rr(0.05, 0.2));
  else if (d < 0.6) go(f.x, f.y, zFor(f), rr(0.5, 1.2), R() < 0.4 ? easeSacc : easeSine, 0, rr(2.2, 5.5), rr(0.05, 0.25));
  else go(f.x, f.y, zFor(f), rr(1.3, 2.6), easeSine, Math.min(2.5, d * rr(0.8, 1.6)), rr(2.2, 5.5), rr(0.05, 0.25));
}
function updateEye() {
  if (!mv) decide();
  const t = (clock - mv.t0) / mv.dur;
  if (t < 1) {
    const e = mv.ease(t);
    cam.x = mv.x0 + (mv.x1 - mv.x0) * e;
    cam.y = mv.y0 + (mv.y1 - mv.y0) * e;
    cam.z = Math.exp(Math.log(mv.z0) + (Math.log(mv.z1) - Math.log(mv.z0)) * e) * (1 + mv.bump * Math.sin(Math.PI * e));
  } else if (clock - mv.t0 < mv.dur + mv.hold) {
    const h = (clock - mv.t0 - mv.dur) / mv.hold;   // indugia, si avvicina ancora
    cam.z = mv.z1 * (1 - mv.creep * easeSine(h));
    cam.x = mv.x1 + Math.sin(clock * 0.41) * 0.012 * cam.z;
    cam.y = mv.y1 + Math.sin(clock * 0.33 + 1) * 0.012 * cam.z;
  } else { mv = null; decide(); }
  Object.assign(cam, clampView(cam.x, cam.y, cam.z));
}

/* ---------- disegno ---------- */
function resize() {
  const d = Math.min(2, window.devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d);
  aspect = cv.width / cv.height;
}
addEventListener('resize', resize); resize();

function render() {
  const W = cv.width, H = cv.height;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  if (!started) return;
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  const z = cam.z, vw = z * aspect;
  const tx = z * 0.0012 * (Math.sin(clock * 13.1) + Math.sin(clock * 7.3 + 1.7));
  const ty = z * 0.0012 * (Math.sin(clock * 11.7 + 0.4) + Math.sin(clock * 5.9 + 2.2));
  const L = cam.x + tx - vw / 2, T = cam.y + ty - z / 2, s = H / z;
  for (const p of panels) {
    const src = p.hi || p.lo; if (!src) continue;
    const a = Math.max(L, p.x), b = Math.min(L + vw, p.x + p.w), t = Math.max(T, p.y), u = Math.min(T + z, p.y + p.h);
    if (b <= a || u <= t) continue;
    const kx = src.width / p.w, ky = src.height / p.h;
    ctx.drawImage(src, (a - p.x) * kx, (t - p.y) * ky, (b - a) * kx, (u - t) * ky,
                  Math.floor((a - L) * s), Math.floor((t - T) * s), Math.ceil((b - a) * s) + 1, Math.ceil((u - t) * s) + 1);
  }
}

function frame(now) {
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now; clock += dt;
  if (!started && panels.filter(p => p.loSt === 2).length >= Math.min(6, panels.length)) {
    started = true;
    Object.assign(cam, clampView(rr(0, TW), rr(0, TH), 1.2));
  }
  if (started) { updateEye(); maintain(target); }
  render();
  requestAnimationFrame(frame);
}

(async () => {
  const map = await infos(WORKS.flatMap(w => w.f));
  const list = [];
  for (const w of WORKS) {
    const f = w.f.find(n => map.has(n));
    if (f) list.push({ ii: map.get(f), ar: map.get(f).ar, year: w.y, x: 0, y: 0, w: 0, h: 1, lo: null, loSt: 0, hi: null, hiSt: 0, foc: null });
  }
  if (!list.length) return;
  buildTable(list);
  panels.forEach(loadLo);
  requestAnimationFrame(frame);
  loadModel();
})();

/* ---------- schermo intero e cursore ---------- */
let idleT;
addEventListener('mousemove', () => {
  document.body.classList.remove('idle'); clearTimeout(idleT);
  idleT = setTimeout(() => document.body.classList.add('idle'), 1500);
});
function toggleFS() {
  if (!document.fullscreenElement) { const r = document.documentElement.requestFullscreen; if (r) r.call(document.documentElement).catch(() => {}); }
  else if (document.exitFullscreen) document.exitFullscreen();
}
addEventListener('click', toggleFS);
addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') toggleFS(); });
}
</script>
