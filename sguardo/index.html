<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SGUARDO</title>
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
canvas{display:block;width:100vw;height:100vh}
body.idle{cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script>
{
/* SGUARDO (titolo provvisorio)
   Un giro per le pelli dipinte. L'occhio è sempre vicinissimo, non si capisce mai quale dipinto sia:
   scorre lento sulla pelle e si ferma sulle parti erogene: genitali, seni, culi, labbra, piedi. Lì indugia, zooma un pochettino,
   si allontana appena, rizooma, sempre poco; poi riparte e, senza stacco, dissolve in un altro
   corpo di un'altra epoca. Le parti le trova NudeNet (riconoscimento convertito in TFJS da
   Vladimir Mandic), che analizza nel browser solo il dipinto attuale e il prossimo.
   Solo figure adulte: nessun putto, Cupido o bambino. */

const WORKS = [
  { y: -70,  f: ['Casa dei vettii, vestibolo, priapo che poggia il fallo sulla bilancia 01.jpg', 'Pompeii House of the Vettii 01.jpg'] },
  { y: 1432, f: ['Lamgods open.jpg'] },
  { y: 1485, f: ['Sandro Botticelli - La nascita di Venere - Google Art Project - edited.jpg', 'La naissance de Vénus, Boticelli.jpg'] },
  { y: 1500, f: ['The Garden of Earthly Delights by Bosch High Resolution 2.jpg'] },
  { y: 1502, f: ['Orvieto107.jpg', 'Signorelli Resurrection.jpg'] },
  { y: 1507, f: ['Albrecht Dürer - Adam (Prado).jpg'] },
  { y: 1507.5, f: ['Albrecht Dürer - Eve (Prado).jpg'] },
  { y: 1510, f: ['Giorgione - Sleeping Venus - Google Art Project 2.jpg'] },
  { y: 1516, f: ['Jan Gossaert 008.jpg'] },
  { y: 1520, f: ["Titian (Tiziano Vecellio) - Venus Rising from the Sea ('Venus Anadyomene') - Google Art Project.jpg"] },
  { y: 1538, f: ['Tiziano - Venere di Urbino - Google Art Project.jpg'] },
  { y: 1541, f: ['Last Judgement (Michelangelo).jpg', 'Last Judgement by Michelangelo.jpg'] },
  { y: 1546, f: ['Lucas Cranach - Der Jungbrunnen (Gemäldegalerie Berlin).jpg', 'Lucas Cranach (I) - Jungbrunnen - Gemäldegalerie Berlin.jpg'] },
  { y: 1553, f: ['Tizian - Danae receiving the Golden Rain - Prado.jpg'] },
  { y: 1610, f: ['Susanna and the Elders (1610), Artemisia Gentileschi.jpg'] },
  { y: 1654, f: ['Rembrandt Harmensz. van Rijn 016.jpg'] },
  { y: 1798, f: ['Goya Maja naga2.jpg'] },
  { y: 1814, f: ['Jean Auguste Dominique Ingres, La Grande Odalisque, 1814.jpg'] },
  { y: 1853, f: ['Les Baigneuses-Courbet.jpg'] },
  { y: 1861, f: ['Jean-Léon Gérôme, Phryne revealed before the Areopagus (1861) - 01.jpg'] },
  { y: 1862, f: ['Le Bain Turc, by Jean Auguste Dominique Ingres, from C2RMFFXD.jpg', 'Le Bain Turc, by Jean Auguste Dominique Ingres, from C2RMF retouched.jpg'] },
  { y: 1863, f: ['Edouard Manet - Luncheon on the Grass - Google Art Project.jpg'] },
  { y: 1863.5, f: ['Edouard Manet - Olympia - Google Art Project 3.jpg'] },
  { y: 1866, f: ['Gustave Courbet - The Origin of the World - WGA05503.jpg', 'Courbet-origine-monde.jpg'] },
  { y: 1866.2, f: ['Gustave Courbet - Le Sommeil (1866), Paris, Petit Palais.jpg'] },
  { y: 1866.5, f: ['Gustave Courbet - Woman with a Parrot - Google Art Project.jpg'] },
  { y: 1873, f: ['William-Adolphe Bouguereau (1825-1905) - Nymphs and Satyr (1873) HQ.jpg', 'William-Adolphe Bouguereau (1825-1905) - Nymphs and Satyr (1873).jpg'] },
  { y: 1884, f: ['Gustave Caillebotte -Man at His Bath.jpg'] },
  { y: 1906, f: ['Paula Moderson-Becker - Selbstbildnis am 6 Hochzeitstag (1906).jpg'] },
  { y: 1906.5, f: ['Paul Cézanne - Les Grandes Baigneuses (The Large Bathers) - Google Art Project.jpg'] },
  { y: 1907, f: ['Gustav Klimt 010.jpg'] },
  { y: 1916, f: ['Amedeo Modigliani, 1916, Reclining Nude (Nu couché), oil on canvas, 65.5 x 87 cm, Foundation E.G. Bührle.jpg'] },
  { y: 1917, f: ['Amedeo Modigliani 012.jpg'] },
  { y: 1917.5, f: ['Amedeo Modigliani 014.jpg'] }
];

const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const R = Math.random, rr = (a, b) => a + R() * (b - a);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const CROP = 0.03, STEPS = [960, 1280, 1920, 3840];
const Z_MIN = 0.045, Z_MAX = 0.2;          // sempre vicino: non si deve capire quale dipinto è

/* ---------- opere da Wikimedia Commons ---------- */
async function infos(files) {
  const map = new Map();
  for (let i = 0; i < files.length; i += 40) {
    const t = files.slice(i, i + 40).map(f => 'File:' + f).join('|');
    const u = 'https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*' +
              '&prop=imageinfo&iiprop=size|url|mime&iiurlwidth=1920&titles=' + encodeURIComponent(t);
    try {
      const j = await (await fetch(u)).json();
      const norm = {};
      for (const n of (j.query && j.query.normalized) || []) norm[n.to] = n.from;
      for (const p of Object.values((j.query && j.query.pages) || {})) {
        const ii = p.imageinfo && p.imageinfo[0];
        if (!ii || !ii.width || !ii.height || Math.min(ii.width, ii.height) < 650) continue;
        const v = { ar: ii.width / ii.height, width: ii.width, height: ii.height, url: ii.url, thumb: ii.thumburl || '', mime: ii.mime || '', size: ii.size || 0 };
        map.set((norm[p.title] || p.title).replace(/^File:/, '').replace(/_/g, ' '), v);
        map.set(p.title.replace(/^File:/, ''), v);
      }
    } catch (e) {}
  }
  return map;
}
const okOrig = ii => /jpeg|png/.test(ii.mime) && ii.size < 30e6;
function urlAt(ii, w) {
  if (w >= ii.width) return okOrig(ii) ? ii.url : ii.thumb;
  if (ii.thumb.includes('/1920px-')) return ii.thumb.replace('/1920px-', '/' + w + 'px-');
  return ii.thumb;
}
function hiSources(ii) {
  const step = STEPS.find(s => s >= ii.width * 3000 / ii.height) || 3840;
  return [...new Set([urlAt(ii, step), ii.thumb, okOrig(ii) ? ii.url : ''].filter(Boolean))];
}
function loadImg(srcs, cb, fail, needClean) {
  let k = 0, cors = true;
  const img = new Image(); img.decoding = 'async';
  const go = () => { if (cors) img.crossOrigin = 'anonymous'; else img.removeAttribute('crossorigin'); img.src = srcs[k]; };
  img.onload = async () => { try { if (img.decode) await img.decode(); } catch (e) {} cb(img, cors); };
  img.onerror = () => { if (cors && !needClean) { cors = false; go(); return; } cors = true; if (++k < srcs.length) go(); else fail(); };
  if (!srcs.length) { fail(); return; }
  go();
}
function cropToCanvas(img, maxH, maxW) {
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const sx = iw * CROP, sy = ih * CROP, sw = iw - 2 * sx, sh = ih - 2 * sy;
  const sc = Math.min(1, maxH / sh, maxW / sw);
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(sw * sc)); c.height = Math.max(1, Math.round(sh * sc));
  const g = c.getContext('2d'); g.imageSmoothingQuality = 'high';
  g.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  return c;
}
function sub(src, x, y, w, h, max) {
  const sc = Math.min(1, max / Math.max(w, h));
  const c = document.createElement('canvas');
  c.width = Math.max(1, Math.round(w * sc)); c.height = Math.max(1, Math.round(h * sc));
  c.getContext('2d').drawImage(src, x, y, w, h, 0, 0, c.width, c.height);
  return c;
}

/* ---------- pelle ---------- */
function skinPoints(c) {
  try {
    const W = 96, H = Math.max(8, Math.round(96 * c.height / c.width));
    const g = sub(c, 0, 0, c.width, c.height, 96).getContext('2d');
    const w = g.canvas.width, h = g.canvas.height;
    const d = g.getImageData(0, 0, w, h).data, out = [];
    for (let y = 1; y < h - 1; y += 2) for (let x = 1; x < w - 1; x += 2) {
      const i = (y * w + x) * 4, r = d[i], gg = d[i + 1], b = d[i + 2];
      if (r > 90 && gg > 40 && b > 20 && r > gg && r > b && r - Math.min(gg, b) > 15 && Math.abs(r - gg) > 12) out.push({ u: x / w, v: y / h });
    }
    for (let i = out.length - 1; i > 0; i--) { const j = (R() * (i + 1)) | 0; [out[i], out[j]] = [out[j], out[i]]; }
    return out.slice(0, 60);
  } catch (e) { return []; }
}

/* ---------- genitali: NudeNet ---------- */
// classi di NudeNet (modello completo): dove si ferma e quanto a lungo
const STOP = {
  13: { k: 'vulva', hold: [5, 10] }, 15: { k: 'pene', hold: [5, 10] }, 0: { k: 'ano', hold: [4, 8] },
  11: { k: 'seno', hold: [3.5, 7] }, 5: { k: 'culo', hold: [3.5, 7] }, 14: { k: 'petto', hold: [2.5, 5] },
  6: { k: 'labbra', hold: [3, 6], lips: true }, 7: { k: 'labbra', hold: [2.5, 5], lips: true },
  9: { k: 'piedi', hold: [2.5, 5] }, 1: { k: 'ascelle', hold: [2, 4] }
};
let model = null, busy = false;
async function runOn(c, ox, oy, sw, sh, out) {
  const input = tf.tidy(() => tf.expandDims(tf.cast(tf.browser.fromPixels(c), 'float32'), 0));
  const outs = await model.executeAsync(input, ['output1', 'output2', 'output3']);
  const boxes = await outs[0].array(), scores = await outs[1].data(), classes = await outs[2].data();
  tf.dispose([input, ...outs]);
  for (let i = 0; i < scores.length; i++) {
    const k = classes[i];
    const S = STOP[k];
    if (scores[i] < 0.25 || !S) continue;
    const [x1, y1, x2, y2] = boxes[0][i];
    const bh = Math.abs(y2 - y1);
    const cyPix = S.lips ? Math.min(y1, y2) + bh * 0.74 : (y1 + y2) / 2;     // dal volto alla bocca
    const u = ox + (x1 + x2) / 2 / c.width * sw, v = oy + cyPix / c.height * sh;
    if (u < 0 || u > 1 || v < 0 || v > 1) continue;
    out.push({ u, v, s: clamp(bh * (S.lips ? 0.35 : 1) / c.height * sh, 0.012, 0.3), stop: true, k: S.k, hold: S.hold, sc: scores[i] });
  }
  await new Promise(r => setTimeout(r, 60));          // respiro per il browser
}
async function detect(p) {
  if (!model || busy || !p.small || p.det) return;
  busy = true;
  try {
    const c = p.small, W = c.width, H = c.height, out = [];
    await runOn(sub(c, 0, 0, W, H, 960), 0, 0, 1, 1, out);
    for (const [a, b] of [[0, 0], [0.45, 0], [0, 0.45], [0.45, 0.45]])
      await runOn(sub(c, a * W, b * H, 0.55 * W, 0.55 * H, 720), a, b, 0.55, 0.55, out);
    out.sort((a, b) => b.sc - a.sc);
    const keep = [];
    for (const f of out) if (!keep.some(g => Math.hypot(g.u - f.u, g.v - f.v) < Math.max(g.s, f.s) * 0.6)) keep.push(f);
    p.foc = keep;
  } catch (e) {}
  p.det = true; p.small.width = p.small.height = 0; p.small = null;
  busy = false;
}
async function loadModel() {
  try {
    if (!window.tf) return;
    await tf.ready();
    model = await tf.loadGraphModel('model/model.json');
  } catch (e) { model = null; }
}

/* ---------- preparazione: solo il dipinto attuale e il prossimo ---------- */
let pool = [], recent = [];
function prepare(p) {
  if (p.st) return;
  p.st = 1;
  loadImg([urlAt(p.ii, 1280), p.ii.thumb], img => {
    p.small = cropToCanvas(img, 1600, 1600);
    p.skin = skinPoints(p.small);
    loadImg(hiSources(p.ii), im => { p.hi = cropToCanvas(im, 3600, 6000); p.st = 2; }, () => { p.st = 3; });
  }, () => {   // niente analisi possibile: lo carica comunque
    loadImg(hiSources(p.ii), im => { p.hi = cropToCanvas(im, 3600, 6000); p.skin = []; p.st = 2; }, () => { p.st = 3; });
  }, true);
}
function release(p) {
  if (p.hi) { p.hi.width = p.hi.height = 0; p.hi = null; }
  if (p.small) { p.small.width = p.small.height = 0; p.small = null; }
  if (p.st === 2 || p.st === 1) p.st = 0;
}
function chooseNext(cur) {
  const c = pool.filter(p => p !== cur && p.st !== 3 && !recent.includes(p));
  const list = c.length ? c : pool.filter(p => p !== cur && p.st !== 3);
  return list[(R() * list.length) | 0] || null;
}

/* ---------- l'occhio ---------- */
let A = null, B = null, next = null, fade = null, clock = 0, prev = performance.now(), aspect = 16 / 9;
function limits(v) {
  const p = v.p;
  v.z = clamp(v.z, Z_MIN, Math.min(Z_MAX, 0.92 * p.ar / aspect, 0.92));
  const vw = v.z * aspect;
  v.x = clamp(v.x, vw / 2, p.ar - vw / 2); v.y = clamp(v.y, v.z / 2, 1 - v.z / 2);
}
function points(p) {
  const f = (p.foc || []).map(q => ({ x: q.u * p.ar, y: q.v, s: q.s, stop: q.stop, hold: q.hold }));
  const s = (p.skin || []).map(q => ({ x: q.u * p.ar, y: q.v, s: 0.12, stop: false }));
  return f.concat(s);
}
function zNear(pt) { return clamp(pt.s * rr(1.8, 2.8), Z_MIN, Z_MAX); }
function newView(p) {
  const pts = points(p), st = pts.filter(q => q.stop);
  const pt = (st.length && R() < 0.7) ? st[(R() * st.length) | 0] : pts.length ? pts[(R() * pts.length) | 0] : { x: p.ar / 2, y: 0.5, s: 0.12 };
  const v = { p, x: pt.x, y: pt.y, z: zNear(pt), mv: null, hops: 0, visited: [] };
  limits(v);
  return v;
}
function plan(v) {
  // prossima tappa nello stesso dipinto: verso un genitale se c'è, altrimenti lungo la pelle
  const pts = points(v.p).filter(q => !v.visited.includes(q.x.toFixed(3) + q.y.toFixed(3)));
  const st = pts.filter(q => q.stop);
  let pt;
  if (st.length && R() < 0.85) pt = st.sort((a, b) => Math.hypot(a.x - v.x, a.y - v.y) - Math.hypot(b.x - v.x, b.y - v.y))[0];
  else if (pts.length) {
    const near = pts.filter(q => Math.hypot(q.x - v.x, q.y - v.y) < 0.35);
    pt = (near.length ? near : pts)[(R() * (near.length || pts.length)) | 0];
  } else pt = { x: v.x + rr(-0.2, 0.2), y: v.y + rr(-0.2, 0.2), s: v.z / 2.2, stop: false };
  v.visited.push(pt.x.toFixed(3) + pt.y.toFixed(3)); if (v.visited.length > 12) v.visited.shift();
  const z1 = zNear(pt), d = Math.hypot(pt.x - v.x, pt.y - v.y);
  const dur = clamp(d / (v.z * 0.22), 1.8, 9);       // scorre sulla pelle, lento
  const hold = pt.stop ? rr(pt.hold[0], pt.hold[1]) : rr(0, 0.5);   // si ferma sulle parti erogene
  v.mv = { t0: clock, dur, hold, x0: v.x, y0: v.y, z0: v.z, x1: pt.x, y1: pt.y, z1, stop: pt.stop, ph: R() * 6 };
  v.hops++;
}
const ease = t => 0.5 - 0.5 * Math.cos(Math.PI * t);
function stepView(v) {
  if (!v.mv) plan(v);
  const m = v.mv, t = (clock - m.t0) / m.dur;
  if (t < 1) {
    const e = ease(t);
    v.x = m.x0 + (m.x1 - m.x0) * e; v.y = m.y0 + (m.y1 - m.y0) * e;
    v.z = Math.exp(Math.log(m.z0) + (Math.log(m.z1) - Math.log(m.z0)) * e);
  } else if (clock - m.t0 < m.dur + m.hold) {
    // indugia: zooma un pochettino, si allontana appena, rizooma, sempre poco
    const h = clock - m.t0 - m.dur;
    v.z = m.z1 * (1 - 0.06 * Math.sin(h * 0.7 + m.ph) - 0.05 * Math.min(1, h / m.hold));
    v.x = m.x1 + Math.sin(h * 0.37 + m.ph) * 0.03 * v.z;
    v.y = m.y1 + Math.sin(h * 0.29 + m.ph * 2) * 0.03 * v.z;
  } else { v.mv = null; v.done = m.stop; }
  limits(v);
}

/* ---------- disegno ---------- */
function resize() {
  const d = Math.min(1.5, window.devicePixelRatio || 1);
  cv.width = Math.round(innerWidth * d); cv.height = Math.round(innerHeight * d);
  aspect = cv.width / cv.height;
}
addEventListener('resize', resize); resize();
function draw(v, alpha) {
  const src = v.p.hi; if (!src) return;
  const k = src.height, vw = v.z * aspect;
  const tx = v.z * 0.0012 * (Math.sin(clock * 13.1) + Math.sin(clock * 7.3 + 1.7));
  const ty = v.z * 0.0012 * (Math.sin(clock * 11.7 + 0.4) + Math.sin(clock * 5.9 + 2.2));
  ctx.globalAlpha = alpha;
  ctx.drawImage(src, (v.x + tx - vw / 2) * k, (v.y + ty - v.z / 2) * k, vw * k, v.z * k, 0, 0, cv.width, cv.height);
  ctx.globalAlpha = 1;
}

function frame(now) {
  const dt = Math.min(0.1, (now - prev) / 1000); prev = now; clock += dt;
  if (!A) {
    const p = pool.find(q => q.st === 2);
    if (p) { A = newView(p); recent.push(p); }
  } else {
    if (!next || next.st === 3) { next = chooseNext(A.p); if (next) prepare(next); }
    if (next && next.small && !next.det) detect(next);
    if (A.p.small && !A.p.det) detect(A.p);
    stepView(A);
    // dopo un genitale (o dopo un po' di pelle) dissolve in un altro corpo
    if (!fade && next && next.st === 2 && (next.det || !model) && ((A.done && R() < 0.3) || A.hops > 9)) {
      B = newView(next); fade = { t0: clock, dur: rr(2.5, 4) };
      recent.push(next); if (recent.length > Math.max(3, pool.length - 3)) recent.shift();
      next = null;
    }
    A.done = false;
    if (fade) stepView(B);
  }
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cv.width, cv.height);
  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
  if (A) draw(A, 1);
  if (fade) {
    const f = clamp((clock - fade.t0) / fade.dur, 0, 1);
    draw(B, ease(f));
    if (f >= 1) { const old = A.p; A = B; B = null; fade = null; if (old !== A.p) release(old); }
  }
  requestAnimationFrame(frame);
}

(async () => {
  const map = await infos(WORKS.flatMap(w => w.f));
  for (const w of WORKS) {
    const f = w.f.find(n => map.has(n));
    if (f) pool.push({ ii: map.get(f), ar: 0, year: w.y, st: 0, hi: null, small: null, skin: [], foc: [], det: false });
  }
  pool.forEach(p => { p.ar = p.ii.ar; });
  if (!pool.length) return;
  prepare(pool[(R() * pool.length) | 0]);
  requestAnimationFrame(frame);
  loadModel();
})();

/* ---------- schermo intero e cursore ---------- */
let idleT;
addEventListener('mousemove', () => {
  document.body.classList.remove('idle'); clearTimeout(idleT);
  idleT = setTimeout(() => document.body.classList.add('idle'), 1500);
});
function toggleFS() {
  if (!document.fullscreenElement) { const r = document.documentElement.requestFullscreen; if (r) r.call(document.documentElement).catch(() => {}); }
  else if (document.exitFullscreen) document.exitFullscreen();
}
addEventListener('click', toggleFS);
addEventListener('keydown', e => { if (e.key === 'f' || e.key === 'F') toggleFS(); });
}
</script>
</body>
