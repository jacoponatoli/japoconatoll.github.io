<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POLS</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  canvas{position:fixed;inset:0;z-index:1;display:block;width:100vw;height:100vh}
  #v{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  #v video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="v"></div>
<script>
/* POLS — a project by Jacopo Natoli
   Endless fluid montage of AI-generated video.
   Every clip decays while it plays (pixels, grain, chemical burns, colour drift).
   Every time a clip comes back it returns more corrupted; after enough returns it is gone.
   New generations are harvested periodically and enter fresh. */

const C=document.getElementById('c'),X=C.getContext('2d');
let W=0,H=0;
function rs(){const r=Math.min(window.devicePixelRatio||1,1.5);W=C.width=Math.floor(innerWidth*r);H=C.height=Math.floor(innerHeight*r);X.fillStyle='#000';X.fillRect(0,0,W,H);}
rs();addEventListener('resize',rs);

const S=document.createElement('canvas'),SX=S.getContext('2d');
const N=document.createElement('canvas');N.width=N.height=256;const NX=N.getContext('2d');
const NID=NX.createImageData(256,256);
function grain(){const a=NID.data;for(let i=0;i<a.length;i+=4){const g=Math.random()*255|0;a[i]=a[i+1]=a[i+2]=g;a[i+3]=255}NX.putImageData(NID,0,0)}
grain();

const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let seen=LS.get('slop_seen',{});
const RETIRE=14;                 // returns before a clip is fully dissolved
const pool=[],fresh=[],known=new Set();
function add(it,isFresh){
  if(known.has(it.key))return;known.add(it.key);
  if((seen[it.key]||0)>=RETIRE)return;
  (isFresh?fresh:pool).push(it);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function getJSON(u,ms){
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),ms||8000);
  try{const r=await fetch(u,{signal:ac.signal});if(!r.ok)throw 0;return await r.json();}finally{clearTimeout(to)}
}

/* ---------- SOURCES ---------- */
// Internet Archive: tagged / titled AI video
const T='("ai generated" OR "ai-generated" OR "generated by ai" OR "generated with ai" OR "ai slop" OR "ai video" OR "ai animation" OR "sora ai" OR "openai sora" OR "sora 2" OR "veo 3" OR "google veo" OR "kling ai" OR runwayml OR "runway ml" OR "text-to-video" OR "text to video" OR "hailuo ai" OR "pika labs" OR "midjourney video")';
const IAQ='(subject:'+T+' OR title:'+T+') AND mediatype:movies AND NOT title:(downloader OR translator OR converter)';
async function iaPage(page,sort){
  let u='https://archive.org/advancedsearch.php?q='+encodeURIComponent(IAQ)+'&fl[]=identifier&rows=100&page='+page+'&output=json';
  if(sort)u+='&sort[]='+encodeURIComponent(sort);
  return (await getJSON(u)).response;
}
let iaTotal=0;
async function harvestNew(){       // newest generations, enter fresh
  try{const r=await iaPage(1,'addeddate desc');iaTotal=r.numFound;
      r.docs.forEach(d=>add({key:'ia:'+d.identifier,id:d.identifier},true));}catch(e){}
}
async function harvestRandom(n){   // dig into the archive
  for(let k=0;k<n;k++){
    try{const pages=Math.max(1,Math.ceil((iaTotal||2000)/100));
        const r=await iaPage(1+Math.floor(Math.random()*pages),'');
        iaTotal=r.numFound||iaTotal;
        r.docs.forEach(d=>add({key:'ia:'+d.identifier,id:d.identifier},false));}catch(e){}
  }
}
// Wikimedia Commons: AI video categories + search
async function commons(params){
  let cont={};
  for(let k=0;k<4;k++){
    try{
      const p=new URLSearchParams(Object.assign({action:'query',prop:'imageinfo',iiprop:'url|mime',format:'json',origin:'*'},params,cont));
      const j=await getJSON('https://commons.wikimedia.org/w/api.php?'+p);
      for(const pg of Object.values((j.query&&j.query.pages)||{})){
        const ii=pg.imageinfo&&pg.imageinfo[0];
        if(ii&&/^video\//.test(ii.mime))add({key:'c:'+pg.title,src:ii.url},false);
      }
      if(!j.continue)break;cont=j.continue;
    }catch(e){break}
  }
}
function harvestCommons(){
  return Promise.all([
    commons({generator:'categorymembers',gcmtitle:'Category:AI-generated videos',gcmtype:'file',gcmlimit:'200'}),
    commons({generator:'search',gsrnamespace:'6',gsrlimit:'100',gsrsearch:'filetype:video "AI-generated"'}),
    commons({generator:'search',gsrnamespace:'6',gsrlimit:'100',gsrsearch:'filetype:video Sora OR RunwayML OR "AI generated video"'})
  ]);
}
async function resolve(it){
  if(it.src)return it.src;
  const j=await getJSON('https://archive.org/metadata/'+encodeURIComponent(it.id));
  const fs=(j.files||[]).filter(f=>/\.(mp4|webm)$/i.test(f.name)&&+f.size>0).sort((a,b)=>(+a.size)-(+b.size));
  if(!fs.length)return null;
  const f=fs.find(f=>+f.size>200000)||fs[0];
  it.src='https://archive.org/download/'+encodeURIComponent(it.id)+'/'+f.name.split('/').map(encodeURIComponent).join('/');
  return it.src;
}

/* ---------- PLAYBACK ---------- */
const box=document.getElementById('v');
let layers=[],readyQ=[],loaders=0,played=0,needTap=false;
const LOADERS=3,QUEUE=2;
function pick(){
  if(played<3){ // start with the fast-loading Commons clips
    const ids=[];pool.forEach((x,i)=>{if(x.src)ids.push(i)});
    if(ids.length)return pool.splice(ids[Math.random()*ids.length|0],1)[0];
  }
  if(fresh.length&&Math.random()<0.6)return fresh.shift();
  if(!pool.length)return fresh.length?fresh.shift():null;
  return pool.splice(Math.random()*pool.length|0,1)[0];
}
function mkVideo(src){
  const v=document.createElement('video');
  v.muted=true;v.defaultMuted=true;v.playsInline=true;v.loop=true;v.preload='auto';
  v.setAttribute('muted','');v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');
  v.src=src;box.appendChild(v);return v;
}
async function loadOne(){
  for(let tries=0;tries<6;tries++){
    const it=pick();if(!it){await sleep(600);continue;}
    let src=null;try{src=await resolve(it)}catch(e){}
    if(!src){continue;}
    const v=mkVideo(src);
    const ok=await new Promise(res=>{
      const to=setTimeout(()=>res(false),12000);
      v.oncanplay=()=>{clearTimeout(to);res(true)};
      v.onerror=()=>{clearTimeout(to);res(false)};
      v.load();
    });
    if(!ok){v.remove();continue;}
    if(isFinite(v.duration)&&v.duration>14){try{v.currentTime=Math.random()*(v.duration-12)}catch(e){}}
    try{await v.play()}catch(e){needTap=true;} // autoplay blocked (e.g. low-power mode): wait for a tap
    return {v,it};
  }
  return null;
}
function prepare(){
  while(loaders<LOADERS&&readyQ.length+loaders<QUEUE+1){
    loaders++;
    loadOne().then(r=>{loaders--;if(r)readyQ.push(r);});
  }
}
function wake(){
  document.querySelectorAll('#v video').forEach(v=>{if(v.paused)v.play().catch(()=>{})});
  needTap=false;
}
function startLayer(now){
  const {v,it}=readyQ.shift();played++;
  if(v.paused)v.play().catch(()=>{needTap=true});
  const returns=seen[it.key]||0;
  layers.push({v,it,t0:now,dur:7+Math.random()*6,fade:2.5+Math.random()*1.5,
               bias:Math.min(0.75,returns/RETIRE),           // older = already more corrupted
               hue:(Math.random()<.5?-1:1)*(40+Math.random()*140),
               spots:[],strips:[],seed:Math.random()});
  prepare();
}
function endLayer(L){
  L.v.pause();L.v.removeAttribute('src');L.v.load();L.v.remove();
  seen[L.it.key]=(seen[L.it.key]||0)+1;LS.set('slop_seen',seen);
  if(seen[L.it.key]<RETIRE)pool.push(L.it);
}

/* ---------- DECAY RENDER ---------- */
function drawLayer(L,now){
  const v=L.v;if(v.readyState<2||!v.videoWidth)return;
  const e=(now-L.t0)/1000,life=L.dur+L.fade;
  const p=Math.min(1,e/life);
  const d=Math.min(1,L.bias+(1-L.bias)*Math.pow(p,1.35));
  let a=Math.min(1,e/L.fade);if(e>L.dur)a*=Math.max(0,1-(e-L.dur)/L.fade);
  if(a<=0)return;

  // pixel block size grows with decay
  const px=1+Math.pow(d,2.1)*Math.min(W,H)/7;
  const sw=Math.max(2,Math.round(W/px)),sh=Math.max(2,Math.round(H/px));
  if(S.width!==sw||S.height!==sh){S.width=sw;S.height=sh;}
  // cover crop
  const vr=v.videoWidth/v.videoHeight,cr=W/H;
  let cx=0,cy=0,cw=v.videoWidth,ch=v.videoHeight;
  if(vr>cr){cw=ch*cr;cx=(v.videoWidth-cw)/2}else{ch=cw/cr;cy=(v.videoHeight-ch)/2}
  SX.filter='saturate('+Math.max(0,1+d*1.6-d*d*2.4)+') contrast('+(1+d*0.9)+') sepia('+(d*0.55)+') hue-rotate('+(d*L.hue)+'deg) brightness('+(1-d*0.3)+')';
  SX.globalAlpha=1;SX.drawImage(v,cx,cy,cw,ch,0,0,sw,sh);
  SX.filter='none';

  X.save();
  X.imageSmoothingEnabled=d<0.06;
  X.globalAlpha=a;X.globalCompositeOperation='source-over';
  // horizontal tearing
  const n=d>0.25?14:1;
  if(Math.random()<0.15+d*0.3)L.strips=Array.from({length:n},()=>Math.random()<d*0.6?(Math.random()-.5)*d*d*W*0.2:0);
  for(let i=0;i<n;i++){
    const y0=Math.floor(i*sh/n),y1=Math.floor((i+1)*sh/n);if(y1<=y0)continue;
    const off=L.strips[i]||0;
    X.drawImage(S,0,y0,sw,y1-y0,off,y0*H/sh,W,(y1-y0)*H/sh);
  }

  // chemical burns: spots that bloom and eat the emulsion
  if(Math.random()<d*0.35)L.spots.push({x:Math.random()*W,y:Math.random()*H,r:0,g:(0.4+Math.random()*2.2)*(Math.min(W,H)/900),k:Math.random()});
  for(const s of L.spots){
    s.r+=s.g*(1+d*3);
    const g=X.createRadialGradient(s.x,s.y,s.r*0.15,s.x,s.y,s.r);
    if(s.k<0.55){g.addColorStop(0,'rgba(20,8,0,0.95)');g.addColorStop(0.6,'rgba(120,60,10,0.5)');g.addColorStop(1,'rgba(255,200,120,0)');X.globalCompositeOperation='multiply';}
    else if(s.k<0.8){g.addColorStop(0,'rgba(255,250,235,0.9)');g.addColorStop(0.7,'rgba(255,220,160,0.35)');g.addColorStop(1,'rgba(255,255,255,0)');X.globalCompositeOperation='screen';}
    else{g.addColorStop(0,'rgba(255,255,255,0.8)');g.addColorStop(1,'rgba(255,255,255,0)');X.globalCompositeOperation='difference';}
    X.globalAlpha=a*Math.min(1,d*1.4);X.fillStyle=g;
    X.beginPath();X.arc(s.x,s.y,s.r,0,6.2832);X.fill();
  }
  if(L.spots.length>60)L.spots.splice(0,L.spots.length-60);

  // grain, coarser as it rots
  const pat=X.createPattern(N,'repeat');
  const gs=(1+d*5)*(W/1400+0.5);
  pat.setTransform(new DOMMatrix().translate(Math.random()*256,Math.random()*256).scale(gs));
  X.globalCompositeOperation='overlay';X.globalAlpha=a*(0.12+d*0.75);
  X.fillStyle=pat;X.fillRect(0,0,W,H);
  X.restore();
}

let frame=0;
function loop(t){
  frame++;if(frame%2===0)grain();
  // trails: never fully clear, the image smears into the next
  X.globalCompositeOperation='source-over';X.globalAlpha=1;
  X.fillStyle='rgba(0,0,0,0.3)';X.fillRect(0,0,W,H);

  const top=layers[layers.length-1];
  if(readyQ.length&&(!top||(t-top.t0)/1000>=top.dur))startLayer(t);
  if(frame%30===0)prepare();

  for(const L of layers)drawLayer(L,t);
  layers=layers.filter(L=>{if((t-L.t0)/1000>L.dur+L.fade){endLayer(L);return false}return true});

  if(!layers.length){ // waiting: bare grain
    X.globalAlpha=0.35;X.fillStyle=X.createPattern(N,'repeat');X.fillRect(0,0,W,H);X.globalAlpha=1;
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- START ---------- */
(async()=>{
  await Promise.race([harvestCommons(),sleep(4000)]);
  harvestNew().then(()=>harvestRandom(4));
  prepare();
})();
setInterval(harvestNew,3*60*1000);          // new generations of slop
setInterval(()=>harvestRandom(2),6*60*1000); // keep digging
addEventListener('touchstart',wake,{passive:true});
addEventListener('click',()=>{wake();const el=document.documentElement;
  if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().catch(()=>{});
  else if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});});
</script>
</body>
</html>
