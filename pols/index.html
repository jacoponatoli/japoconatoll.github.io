<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POLS</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;cursor:none}
  canvas{position:fixed;inset:0;z-index:1;display:block;width:100vw;height:100vh}
  #v{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  #v video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="v"></div>
<script>
/* POLS — a project by Jacopo Natoli
   Endless fluid montage of AI-generated video.
   Each clip is shown clean for a few seconds, then it is taken apart by a transition that
   exposes how it was made: reverse diffusion back to latent noise, token patches, its own
   prompt, VAE latents, compression motion vectors, feedback hallucination — or simply acid,
   fire, melting plastic, crumbling. Every transition is drawn with random parameters.
   Clips that return come back more worn; after enough returns they are gone.
   New generations are harvested every two minutes. */

const C=document.getElementById('c'),box=document.getElementById('v');
let gl=null;
try{gl=C.getContext('webgl2',{alpha:false,antialias:false,depth:false,stencil:false,premultipliedAlpha:false});}catch(e){}

const LS={get(k,d){try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},
          set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let seen=LS.get('slop_seen',{});
const RETIRE=14;
const pool=[],fresh=[],known=new Set();
function add(it,isFresh){
  if(known.has(it.key))return;known.add(it.key);
  if((seen[it.key]||0)>=RETIRE)return;
  (isFresh?fresh:pool).push(it);
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=(a,b)=>a+Math.random()*(b-a);
async function getJSON(u,ms){
  const ac=new AbortController(),to=setTimeout(()=>ac.abort(),ms||8000);
  try{const r=await fetch(u,{signal:ac.signal});if(!r.ok)throw 0;return await r.json();}finally{clearTimeout(to)}
}

/* ---------- SOURCES ----------
   CIVITAI — public feed of a generation platform: everything there is AI-made, with its prompt
             (safe-for-work filter on). Newest = new generations; top-reacted = the archive.
   COMMONS — Wikimedia's curated category "AI-generated videos". */
const MIX_CIV=0.88;
function civSrc(u){return u.replace('/original=true/','/transcode=true,width=720/')}
async function civitai(params,isFresh,pages){
  let u='https://civitai.com/api/v1/images?'+new URLSearchParams(Object.assign({limit:'100',nsfw:'None',type:'video',withMeta:'true'},params));
  for(let k=0;k<pages&&u;k++){
    try{
      const j=await getJSON(u,12000);
      (j.items||[]).forEach(i=>{
        if(i.type==='video'&&i.nsfwLevel==='None'&&i.url)
          add({key:'cv:'+i.id,src:civSrc(i.url),alt:i.url,s:'civ',prompt:(i.meta&&i.meta.prompt)||''},isFresh);
      });
      u=j.metadata&&j.metadata.nextPage;
    }catch(e){break}
  }
}
function civNew(){return civitai({sort:'Newest'},true,2)}
function civDig(){
  const periods=['Day','Week','Month','Year','AllTime'],sorts=['Most Reactions','Most Comments','Most Collected'];
  return civitai({sort:sorts[Math.random()*sorts.length|0],period:periods[Math.random()*periods.length|0]},false,2+(Math.random()*3|0));
}
async function commons(){
  let cont={};
  for(let k=0;k<4;k++){
    try{
      const p=new URLSearchParams(Object.assign({action:'query',prop:'imageinfo',iiprop:'url|mime',format:'json',origin:'*',
        generator:'categorymembers',gcmtitle:'Category:AI-generated videos',gcmtype:'file',gcmlimit:'200'},cont));
      const j=await getJSON('https://commons.wikimedia.org/w/api.php?'+p);
      for(const pg of Object.values((j.query&&j.query.pages)||{})){
        const ii=pg.imageinfo&&pg.imageinfo[0];
        if(ii&&/^video\//.test(ii.mime))
          add({key:'c:'+pg.title,src:ii.url,s:'com',prompt:pg.title.replace(/^File:/,'').replace(/\.\w+$/,'')},false);
      }
      if(!j.continue)break;cont=j.continue;
    }catch(e){break}
  }
}

/* ---------- LOADING ---------- */
let readyQ=[],loaders=0;
const LOADERS=3,QUEUE=2;
function takeFrom(s){
  const ids=[];pool.forEach((x,i)=>{if(x.s===s)ids.push(i)});
  return ids.length?pool.splice(ids[Math.random()*ids.length|0],1)[0]:null;
}
function pick(){
  if(fresh.length&&Math.random()<0.5)return fresh.shift();   // new generations first
  const a=Math.random()<MIX_CIV?'civ':'com',b=a==='civ'?'com':'civ';
  return takeFrom(a)||takeFrom(b)||fresh.shift()||null;
}
function mkVideo(src){
  const v=document.createElement('video');
  v.crossOrigin='anonymous';
  v.muted=true;v.defaultMuted=true;v.playsInline=true;v.loop=true;v.preload='auto';
  v.setAttribute('muted','');v.setAttribute('playsinline','');v.setAttribute('webkit-playsinline','');
  box.appendChild(v);v.src=src;return v;
}
function waitReady(v,ms){
  return new Promise(res=>{const to=setTimeout(()=>res(false),ms);
    v.oncanplay=()=>{clearTimeout(to);res(true)};v.onerror=()=>{clearTimeout(to);res(false)};});
}
async function loadOne(){
  for(let tries=0;tries<6;tries++){
    const it=pick();if(!it){await sleep(600);continue;}
    const v=mkVideo(it.src);
    let ok=await waitReady(v,12000);
    if(!ok&&it.alt){v.src=it.alt;ok=await waitReady(v,12000);}
    if(!ok||!v.videoWidth){v.remove();continue;}
    if(isFinite(v.duration)&&v.duration>14){try{v.currentTime=Math.random()*(v.duration-12)}catch(e){}}
    try{await v.play()}catch(e){}
    return {v,it};
  }
  return null;
}
function prepare(){
  while(loaders<LOADERS&&readyQ.length+loaders<QUEUE+1){
    loaders++;
    loadOne().then(r=>{loaders--;if(r)readyQ.push(r);});
  }
}
function wake(){document.querySelectorAll('#v video').forEach(v=>{if(v.paused)v.play().catch(()=>{})});}

/* ---------- SHADERS ---------- */
const VS=`#version 300 es
in vec2 p;out vec2 vUv;
void main(){vUv=p*.5+.5;gl_Position=vec4(p,0.,1.);}`;

const FS_COPY=`#version 300 es
precision mediump float;in vec2 vUv;out vec4 o;uniform sampler2D t;
void main(){o=texture(t,vUv);}`;

const FS=`#version 300 es
precision highp float;
in vec2 vUv;out vec4 o;
uniform sampler2D uA,uAo,uB,uBo,uPrev,uPA,uPB;
uniform vec2 uRes;
uniform float uAspA,uAspB,uT,uTime,uSeed,uAge,uCell,uG;
uniform int uFx,uMode;
uniform vec4 uP;

float hash(vec2 p){vec3 p3=fract(vec3(p.xyx)*.1031);p3+=dot(p3,p3.yzx+33.33);return fract((p3.x+p3.y)*p3.z);}
vec2 hash2(vec2 p){vec3 p3=fract(vec3(p.xyx)*vec3(.1031,.1030,.0973));p3+=dot(p3,p3.yzx+33.33);return fract((p3.xx+p3.yz)*p3.zy);}
float noise(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);
  return mix(mix(hash(i),hash(i+vec2(1.,0.)),f.x),mix(hash(i+vec2(0.,1.)),hash(i+vec2(1.,1.)),f.x),f.y);}
float fbm(vec2 p){float s=0.,a=.5;for(int i=0;i<5;i++){s+=a*noise(p);p=p*2.03+vec2(17.1,9.2);a*=.5;}return s;}
float g1(vec2 p){return (hash(p)+hash(p+13.1)+hash(p+29.7)-1.5)*1.15;}
vec3 gauss3(vec2 p){return vec3(g1(p),g1(p+51.3),g1(p+97.9));}
float lum(vec3 c){return dot(c,vec3(.299,.587,.114));}
float tfr(){return mod(floor(uTime*24.),997.);}
vec2 cover(vec2 uv,float at){float as=uRes.x/uRes.y;vec2 s=vec2(1.);if(at>as)s.x=as/at;else s.y=at/as;return (uv-.5)*s+.5;}
vec3 A(vec2 uv){return texture(uA,cover(uv,uAspA)).rgb;}
vec3 AL(vec2 uv,float l){return textureLod(uA,cover(uv,uAspA),l).rgb;}
vec3 B(vec2 uv){return texture(uB,cover(uv,uAspB)).rgb;}
vec3 BL(vec2 uv,float l){return textureLod(uB,cover(uv,uAspB),l).rgb;}
vec3 BoL(vec2 uv,float l){return textureLod(uBo,cover(uv,uAspB),l).rgb;}
vec2 TT(vec2 uv){if(uMode==1)return vec2(uv.x,1.-uv.y);if(uMode==2)return uv.yx;return uv;}

/* clean playback, slightly worn by returns */
vec3 holdfx(vec2 uv){
  vec2 off=vec2(uAge*.006,0.);
  return vec3(A(uv+off).r,A(uv).g,A(uv-off).b);
}

/* 1 — reverse diffusion: back to latent noise, then the next one denoises in discrete sampler steps */
vec3 diffusion(vec2 uv){
  float steps=floor(8.+uP.x*22.);
  vec2 px=uv*uRes;float lat=8.;
  float tt=uMode==2?.5+uT*.5:uT;
  if(tt<.5){
    float s=floor(tt*2.*steps)/steps;
    vec3 c=AL(uv,s*5.);
    vec3 n=gauss3(floor(px/mix(1.,lat,s*s))+tfr()*7.3)*.35+.5;
    return mix(c,n,smoothstep(0.,.9,s));
  }
  float s=floor((tt-.5)*2.*steps)/steps;
  vec3 c=BL(uv,(1.-s)*6.);
  vec3 n=gauss3(floor(px/mix(lat,1.,s))+tfr()*7.3)*.35+.5;
  return mix(c,n,clamp((1.-s)*1.15,0.,1.));
}

/* 2 — spacetime patches / tokens: shuffled, flattened to embeddings, regenerated token by token */
vec3 patches(vec2 uv){
  float n=floor(8.+uP.x*40.);
  vec2 grid=vec2(n,floor(n*uRes.y/uRes.x)+1.);
  vec2 cid=floor(uv*grid),f=fract(uv*grid);
  float ord;
  if(uMode==0)ord=hash(cid+uSeed);
  else if(uMode==1)ord=((grid.y-1.-cid.y)*grid.x+cid.x)/(grid.x*grid.y);
  else ord=clamp(length((cid+.5)/grid-.5)*1.4,0.,1.);
  float p=clamp((uT-ord*.72)/.28,0.,1.);
  if(p<=0.)return A(uv);
  if(p>=1.)return B(uv);
  vec2 other=floor(hash2(cid+mod(floor(uTime*12.),97.)+uSeed)*grid);
  vec2 suv=(other+f)/grid;
  vec3 c=hash(cid+mod(floor(uTime*20.),89.))<p?B(suv):A(suv);
  if(hash(cid*3.1+mod(floor(uTime*6.),71.))>.55)c=(p>.5?BL((cid+.5)/grid,7.):AL((cid+.5)/grid,7.));
  float b=max(step(f.x,.05),step(f.y,.05));
  return mix(c,vec3(1.)-c,b*.7);
}

/* 3 — the prompt: the image is rewritten by its own prompt, then by the next one's */
float glyph(sampler2D P,float ci,vec2 f){
  ci=mod(ci,uG*uG);
  vec2 g=vec2(mod(ci,uG),floor(ci/uG));
  f=clamp(f,.03,.97);
  return texture(P,vec2((g.x+f.x)/uG,(uG-g.y-1.+f.y)/uG)).r;
}
vec3 promptfx(vec2 uv){
  vec2 px=uv*uRes;float cell=uCell;
  float cols=floor(uRes.x/cell),rows=floor(uRes.y/cell)+1.;
  vec2 pt=vec2(px.x,uRes.y-px.y);
  vec2 cc=floor(pt/cell),ft=fract(pt/cell);
  vec2 f=vec2(ft.x,1.-ft.y);
  float ci=cc.y*cols+cc.x;
  vec2 cuv=vec2((cc.x+.5)*cell,uRes.y-(cc.y+.5)*cell)/uRes;
  float scroll=floor(uTime*(2.+uP.y*28.));
  vec3 ca=AL(cuv,1.),cb=BL(cuv,1.);
  vec3 ta=mix(ca*.22,ca*2.+.12,glyph(uPA,ci+scroll,f));
  vec3 tb=mix(cb*.22,cb*2.+.12,glyph(uPB,ci+scroll,f));
  float ord=uMode==1?ci/(cols*rows):hash(cc+uSeed);
  if(uT<.35)return ord<uT/.35?ta:A(uv);
  if(uT<.65)return ord<(uT-.35)/.3?tb:ta;
  return hash(cc*2.3+uSeed)<(uT-.65)/.35?B(uv):tb;
}

/* 4 — acid on paper / 5 — fire on plastic */
vec3 erode(vec2 uv,bool fire){
  float sc=2.+uP.x*5.;
  vec2 q=uv*vec2(uRes.x/uRes.y,1.)*sc;
  float m=fbm(q+vec2(0.,uTime*.05)+uSeed);
  if(fire){vec2 dir=vec2(cos(uP.z*6.283),sin(uP.z*6.283));m=m*.55+(dot(uv-.5,dir)+.5)*.6;}
  float th=mix(-.05,1.1,uT);
  float d=m-th;
  if(d<0.)return B(uv);
  float edge=smoothstep(.12,0.,d);
  vec2 w=vec2(fbm(q*3.+uTime),fbm(q*3.+7.-uTime))-.5;
  vec3 c=A(uv+w*edge*(fire?.03:.015)+(fire?vec2(0.,edge*.025):vec2(0.)));
  if(fire){
    c=mix(c,c*vec3(.35,.25,.2),smoothstep(.12,.04,d));
    c=mix(c,vec3(.02),smoothstep(.05,.015,d));
    vec3 hot=mix(vec3(1.,.92,.6),vec3(1.,.35,.05),smoothstep(0.,.03,d));
    c+=hot*smoothstep(.03,0.,d)*1.6*(.6+.4*noise(q*20.+uTime*8.));
  }else{
    vec3 ac=uMode==0?vec3(.75,1.,.2):uMode==1?vec3(1.,.2,.85):vec3(.2,.95,1.);
    float bub=step(.8,noise(q*25.+uTime*3.))*edge;
    c=mix(c,vec3(lum(c))*vec3(1.,.95,.7),edge*.8);
    c=mix(c,ac,clamp(smoothstep(.04,0.,d)*.9+bub*.6,0.,1.));
    c*=1.-smoothstep(.015,0.,d)*.6;
  }
  return c;
}

/* 6 — melting: the image drips off the screen */
vec3 melt(vec2 uv){
  vec2 tu=TT(uv);
  float fr=4.+uP.x*30.;
  float off=(noise(vec2(tu.x*fr,uSeed*9.))*.8+.2)*uT*uT*1.8+noise(vec2(tu.x*fr*6.,uSeed))*uT*.15;
  vec2 su=tu+vec2(0.,off);
  if(su.y>1.)return B(uv);
  vec3 c=A(TT(su));
  c=mix(vec3(lum(c)),c,1.+uT*1.5);
  c+=pow(max(0.,noise(vec2(tu.x*fr*3.,su.y*40.-uTime))),8.)*uT*.8;
  return c;
}

/* 7 — pixel stretch: bright pixels are dragged along a moving cut */
vec3 stretchfx(vec2 uv){
  vec2 tu=TT(uv);
  float front=mix(1.15,-.25,uT)+(noise(vec2(tu.x*(3.+uP.x*40.),uSeed))-.5)*.35;
  if(tu.y>front)return B(uv);
  vec3 a=A(uv);
  float L=(.08+uP.y*.5)*smoothstep(0.,.3,uT);
  float thr=mix(.85,.15,uP.z);
  if(tu.y>front-L&&lum(a)>thr*(1.-(front-tu.y)/L))return A(TT(vec2(tu.x,front)));
  return a;
}

/* 8 — datamosh: the old image is pushed around by the motion vectors of the new one */
vec3 mosh(vec2 uv){
  if(uT<.03)return A(uv);
  vec2 bs=vec2(16.)/uRes;
  vec2 bid=floor(uv/bs),bq=(bid+.5)*bs;
  vec2 ex=vec2(bs.x,0.),ey=vec2(0.,bs.y);
  float It=lum(BL(bq,2.))-lum(BoL(bq,2.));
  vec2 gr=vec2(lum(BL(bq+ex,2.))-lum(BL(bq-ex,2.)),lum(BL(bq+ey,2.))-lum(BL(bq-ey,2.)));
  vec2 fl=-It*gr/(dot(gr,gr)+.002)*bs*(2.+uP.x*6.);
  fl+=(hash2(bid+mod(floor(uTime*1.5),97.))-.5)*bs*.6*uP.y;
  fl=clamp(fl,-bs*3.,bs*3.);
  vec2 fp=floor(fl*uRes+.5);
  vec3 pv=texelFetch(uPrev,ivec2(clamp(floor(uv*uRes-fp),vec2(0.),uRes-1.)),0).rgb;
  float key=step(1.-.004-.3*pow(uT,4.),hash(bid+mod(floor(uTime*10.),113.)));
  return mix(pv,B(uv),clamp(pow(uT,7.)+key,0.,1.));
}

/* 9 — feedback hallucination: the frame keeps re-dreaming itself until the next clip surfaces */
vec3 dream(vec2 uv){
  float ar=uRes.x/uRes.y;
  vec2 c=uv-.5;c.x*=ar;
  float z=1.-(.006+.012*uP.x)*(uMode==1?-1.:1.);
  float an=(uP.y-.5)*.04;
  c=mat2(cos(an),-sin(an),sin(an),cos(an))*c*z;
  c+=(vec2(noise(c*3.+uTime*.3+uSeed),noise(c*3.+9.-uTime*.3))-.5)*.008;
  c.x/=ar;
  vec2 s0=c+.5,e1=1./uRes;
  vec3 pv=texture(uPrev,s0).rgb;
  vec3 nb=(texture(uPrev,s0+vec2(e1.x,0.)).rgb+texture(uPrev,s0-vec2(e1.x,0.)).rgb+texture(uPrev,s0+vec2(0.,e1.y)).rgb+texture(uPrev,s0-vec2(0.,e1.y)).rgb)*.25;
  pv+=(pv-nb)*(.7+uP.w*.9);
  pv=mix(pv,pv.gbr,.02+.05*uP.z);
  pv=mix(vec3(lum(pv)),pv,1.04);
  float inj=uT<.5?mix(.25,0.,uT*2.):mix(0.,.2,(uT-.5)*2.);
  vec3 o2=mix(pv,uT<.5?A(uv):B(uv),inj);
  return mix(o2,B(uv),smoothstep(.88,1.,uT));
}

/* 10 — crumbling: cracks, then pieces fall away */
vec3 crumble(vec2 uv){
  vec2 asp=vec2(uRes.x/uRes.y,1.);
  float cs=(24.+uP.x*90.)/uRes.y;
  vec2 q=uv*asp;
  vec2 cid=floor(q/cs);
  for(int k=0;k<14;k++){
    vec2 id=vec2(cid.x,cid.y+float(k));
    float o1=uMode==0?hash(id+uSeed):uMode==1?clamp(id.y*cs,0.,1.):1.-clamp(abs((id.x+.5)*cs/asp.x-.5)*2.,0.,1.);
    float ts=o1*.6+hash(id*1.3+uSeed)*.15;
    float tt=max(0.,uT-ts);
    float dy=tt*tt*(2.+hash(id*2.1)*3.);
    float y0=id.y*cs-dy;
    if(q.y>=y0&&q.y<y0+cs){
      vec2 f=vec2(fract(q.x/cs),(q.y-y0)/cs);
      vec3 c=A((q+vec2(0.,dy))/asp);
      float e=min(min(f.x,1.-f.x),min(f.y,1.-f.y));
      float pre=smoothstep(ts-.15,ts,uT);
      float cr=smoothstep(.07*pre+.001,0.,e+(noise(q*90.)-.5)*.04);
      c*=1.-cr*.9*pre;
      if(tt>0.)c*=.85;
      return c;
    }
  }
  return B(uv);
}

/* 11 — VAE latents: the image is encoded into false-colour blocks, interpolated, decoded */
vec3 latent(vec2 uv){
  float b=8.*(1.+floor(uP.x*3.));
  vec2 bs=vec2(b)/uRes;
  vec2 bid=floor(uv/bs),bq=(bid+.5)*bs,f=fract(uv/bs);
  vec3 la=AL(bq,3.),lb=BL(bq,3.);
  mat3 M=mat3(.2,-.9,.6,.9,.3,-.5,-.4,.6,.8);
  float k=1.5+uP.y*2.;
  vec3 za=fract(M*la*k+uSeed*.1),zb=fract(M*lb*k+uSeed*.1);
  float ord=uMode==1?1.-bq.y:uMode==2?clamp(length(bq-.5)*1.4,0.,1.):hash(bid+uSeed);
  float gl1=max(step(f.x,.08),step(f.y,.08));
  vec3 c;bool lat=true;
  if(uT<.3){if(ord<uT/.3)c=za;else{c=A(uv);lat=false;}}
  else if(uT<.6){c=mix(za,zb,smoothstep(ord*.6,ord*.6+.4,(uT-.3)/.3));}
  else{if(ord<(uT-.6)/.4){c=B(uv);lat=false;}else c=zb;}
  if(lat)c=mix(c,c*.5+.3,gl1*.6);
  return c;
}

void main(){
  vec2 uv=vUv;vec3 c;
  if(uFx<0)c=gauss3(floor(uv*uRes/3.)+tfr()*7.3)*.3+.5;
  else if(uFx==0)c=holdfx(uv);
  else if(uFx==1)c=diffusion(uv);
  else if(uFx==2)c=patches(uv);
  else if(uFx==3)c=promptfx(uv);
  else if(uFx==4)c=erode(uv,false);
  else if(uFx==5)c=erode(uv,true);
  else if(uFx==6)c=melt(uv);
  else if(uFx==7)c=stretchfx(uv);
  else if(uFx==8)c=mosh(uv);
  else if(uFx==9)c=dream(uv);
  else if(uFx==10)c=crumble(uv);
  else c=latent(uv);
  c+=(hash(uv*uRes+tfr()*1.7)-.5)*(.03+uAge*.08);
  o=vec4(clamp(c,0.,1.),1.);
}`;

/* ---------- GL SETUP ---------- */
let W=0,H=0,RS=1,PR=null,PC=null,U={},BLACK=null,fb=[],ft=[],ping=0,GL=false;
function compile(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);
  if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;}
function program(fs){const p=gl.createProgram();gl.attachShader(p,compile(gl.VERTEX_SHADER,VS));gl.attachShader(p,compile(gl.FRAGMENT_SHADER,fs));
  gl.bindAttribLocation(p,0,'p');gl.linkProgram(p);if(!gl.getProgramParameter(p,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(p));return p;}
function mkTex(mips){const t=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,t);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,mips?gl.LINEAR_MIPMAP_LINEAR:gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);return t;}
function mkFbo(){
  for(let i=0;i<2;i++){
    if(ft[i])gl.deleteTexture(ft[i]);if(fb[i])gl.deleteFramebuffer(fb[i]);
    ft[i]=mkTex(false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,W,H,0,gl.RGBA,gl.UNSIGNED_BYTE,null);
    fb[i]=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,fb[i]);
    gl.framebufferTexture2D(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.TEXTURE_2D,ft[i],0);
    gl.clearColor(0,0,0,1);gl.clear(gl.COLOR_BUFFER_BIT);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);
}
function rs(){
  const r=Math.min(window.devicePixelRatio||1,1.5,1280/Math.max(innerWidth,innerHeight));
  W=C.width=Math.max(2,Math.floor(innerWidth*r));H=C.height=Math.max(2,Math.floor(innerHeight*r));RS=r;
  if(GL)mkFbo();
}
if(gl){
  try{
    PR=program(FS);PC=program(FS_COPY);
    const buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);
    gl.bufferData(gl.ARRAY_BUFFER,new Float32Array([-1,-1,1,-1,-1,1,1,1]),gl.STATIC_DRAW);
    gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,2,gl.FLOAT,false,0,0);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL,true);
    ['uA','uAo','uB','uBo','uPrev','uPA','uPB','uRes','uAspA','uAspB','uT','uTime','uSeed','uAge','uCell','uG','uFx','uMode','uP']
      .forEach(n=>U[n]=gl.getUniformLocation(PR,n));
    gl.useProgram(PR);
    [['uA',0],['uAo',1],['uB',2],['uBo',3],['uPrev',4],['uPA',5],['uPB',6]].forEach(([n,i])=>gl.uniform1i(U[n],i));
    gl.useProgram(PC);gl.uniform1i(gl.getUniformLocation(PC,'t'),0);
    BLACK=mkTex(false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,1,1,0,gl.RGBA,gl.UNSIGNED_BYTE,new Uint8Array([0,0,0,255]));
    GL=true;
  }catch(e){console.error(e);GL=false;}
}
if(!GL)C.style.display='none';   // fallback: plain cuts between the raw videos
rs();addEventListener('resize',rs);

/* prompt atlas: the prompt typed into a grid of glyphs */
const PG=48;
function promptTex(text){
  const S=1024,cs=S/PG;
  const cv=document.createElement('canvas');cv.width=cv.height=S;const x=cv.getContext('2d');
  x.fillStyle='#000';x.fillRect(0,0,S,S);x.fillStyle='#fff';
  x.font='bold '+Math.floor(cs*.9)+'px ui-monospace,Menlo,Consolas,monospace';
  x.textAlign='center';x.textBaseline='middle';
  let t=(text||'').replace(/\s+/g,' ').trim();if(!t)t='untitled';t+='   ';
  let i=0;
  for(let r=0;r<PG;r++)for(let c=0;c<PG;c++){const ch=t[i++%t.length];if(ch!==' ')x.fillText(ch,(c+.5)*cs,(r+.52)*cs);}
  const tx=mkTex(false);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,cv);return tx;
}

/* ---------- CLIPS ---------- */
let zc=1;
function makeClip(r){
  const cl={v:r.v,it:r.it,cur:0,ok:false,bad:false,w:[0,0],h:[0,0],age:Math.min(1,(seen[r.it.key]||0)/RETIRE)};
  if(GL){cl.tex=[mkTex(true),mkTex(true)];cl.ptex=promptTex(r.it.prompt);}
  else r.v.style.zIndex=++zc;
  if(r.v.paused)r.v.play().catch(()=>{});
  return cl;
}
function disposeClip(cl){
  if(GL){gl.deleteTexture(cl.tex[0]);gl.deleteTexture(cl.tex[1]);gl.deleteTexture(cl.ptex);}
  cl.v.pause();cl.v.removeAttribute('src');try{cl.v.load()}catch(e){}cl.v.remove();
  seen[cl.it.key]=(seen[cl.it.key]||0)+1;LS.set('slop_seen',seen);
  if(seen[cl.it.key]<RETIRE)pool.push(cl.it);
}
function upload(cl){
  const v=cl.v;if(v.readyState<2||!v.videoWidth)return;
  const i=1-cl.cur;
  try{
    gl.bindTexture(gl.TEXTURE_2D,cl.tex[i]);
    if(cl.w[i]!==v.videoWidth||cl.h[i]!==v.videoHeight){
      gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,v);cl.w[i]=v.videoWidth;cl.h[i]=v.videoHeight;
    }else gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,gl.RGBA,gl.UNSIGNED_BYTE,v);
    gl.generateMipmap(gl.TEXTURE_2D);cl.cur=i;cl.ok=true;
  }catch(e){cl.bad=true;}
}
function bindClip(cl,u1,u2){
  let a=BLACK,b=BLACK;
  if(cl&&cl.ok){a=cl.tex[cl.cur];b=cl.w[1-cl.cur]?cl.tex[1-cl.cur]:a;}
  gl.activeTexture(gl.TEXTURE0+u1);gl.bindTexture(gl.TEXTURE_2D,a);
  gl.activeTexture(gl.TEXTURE0+u2);gl.bindTexture(gl.TEXTURE_2D,b);
}
const asp=cl=>cl&&cl.v.videoWidth?cl.v.videoWidth/cl.v.videoHeight:1;

/* ---------- MONTAGE ---------- */
// 1 diffusion · 2 patches · 3 prompt · 4 acid · 5 fire · 6 melt · 7 stretch · 8 datamosh · 9 dream · 10 crumble · 11 latent
const DUR={1:[3.5,6],2:[2.5,5],3:[5,8],4:[3,6],5:[3,6],6:[2.5,5],7:[2,4],8:[3,6],9:[4,7],10:[3,5],11:[3,6]};
let A=null,Bc=null,phase='wait',pt0=0,pdur=0,fx=-1,mode=0,P=[0,0,0,0],seed=0,cell=14,lastFx=[],frameN=0;
function chooseFx(){let f;do{f=1+Math.floor(Math.random()*11)}while(lastFx.includes(f));lastFx.push(f);if(lastFx.length>4)lastFx.shift();return f;}
function startTrans(now){
  Bc=makeClip(readyQ.shift());
  if(!A){fx=1;mode=2;pdur=rnd(2.5,4);}
  else{
    fx=chooseFx();
    if(fx===3&&!(A.it.prompt&&Bc.it.prompt)){lastFx.pop();fx=chooseFx();if(fx===3)fx=1;}
    mode=Math.floor(Math.random()*3);const d=DUR[fx];pdur=rnd(d[0],d[1]);
  }
  P=[Math.random(),Math.random(),Math.random(),Math.random()];seed=Math.random()*50;
  cell=Math.round(rnd(10,20)*RS);
  phase='trans';pt0=now;prepare();
}
function endTrans(now){if(A)disposeClip(A);A=Bc;Bc=null;phase='hold';pt0=now;pdur=rnd(2.5,5);}

function render(f,uT,t,age){
  gl.useProgram(PR);gl.bindFramebuffer(gl.FRAMEBUFFER,fb[1-ping]);gl.viewport(0,0,W,H);
  bindClip(A,0,1);bindClip(Bc,2,3);
  gl.activeTexture(gl.TEXTURE4);gl.bindTexture(gl.TEXTURE_2D,ft[ping]);
  gl.activeTexture(gl.TEXTURE5);gl.bindTexture(gl.TEXTURE_2D,A?A.ptex:BLACK);
  gl.activeTexture(gl.TEXTURE6);gl.bindTexture(gl.TEXTURE_2D,Bc?Bc.ptex:BLACK);
  gl.uniform2f(U.uRes,W,H);gl.uniform1f(U.uAspA,asp(A));gl.uniform1f(U.uAspB,asp(Bc));
  gl.uniform1f(U.uT,uT);gl.uniform1f(U.uTime,(t/1000)%1000);gl.uniform1f(U.uSeed,seed);
  gl.uniform1f(U.uAge,age);gl.uniform1f(U.uCell,cell);gl.uniform1f(U.uG,PG);
  gl.uniform1i(U.uFx,f);gl.uniform1i(U.uMode,mode);gl.uniform4f(U.uP,P[0],P[1],P[2],P[3]);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);gl.viewport(0,0,W,H);
  gl.useProgram(PC);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,ft[1-ping]);
  gl.drawArrays(gl.TRIANGLE_STRIP,0,4);
  ping=1-ping;
}

function loop(t){
  frameN++;
  const el=(t-pt0)/1000;
  if(phase==='wait'&&readyQ.length)startTrans(t);
  else if(phase==='hold'&&(el>pdur||(A&&A.bad))&&readyQ.length)startTrans(t);
  if(!GL&&phase==='trans'){endTrans(t);}            // fallback: hard cuts
  let uT=0;
  if(phase==='trans'){
    if(Bc&&Bc.bad){disposeClip(Bc);Bc=null;phase=A?'hold':'wait';pt0=t;pdur=0;}
    else{uT=Math.min(1,(t-pt0)/1000/pdur);if(uT>=1){endTrans(t);uT=0;}}
  }
  if(frameN%30===0)prepare();
  if(GL){
    if(A)upload(A);if(Bc)upload(Bc);
    const age=A?Math.min(1,A.age+(phase==='hold'?Math.max(0,(t-pt0)/1000-pdur)/20:0)):0;
    render(phase==='wait'?-1:phase==='hold'?0:fx,uT,t,age);
  }
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ---------- START ---------- */
(async()=>{
  await Promise.race([civNew(),sleep(5000)]);
  prepare();
  commons();civDig();
})();
setInterval(civNew,2*60*1000);   // new generations of slop
setInterval(civDig,5*60*1000);   // dig into the past
addEventListener('touchstart',wake,{passive:true});
addEventListener('click',()=>{wake();const el=document.documentElement;
  if(!document.fullscreenElement&&el.requestFullscreen)el.requestFullscreen().catch(()=>{});
  else if(document.exitFullscreen)document.exitFullscreen().catch(()=>{});});
</script>
