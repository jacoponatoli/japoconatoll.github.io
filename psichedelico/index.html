    Object.assign(FLU, { on: true, until: performance.now() + rnd(4, 12) * 1000, modo: pick(d < .35 ? ['liscio', 'liscio', 'corsa'] : d > .7 ? ['scia', 'corsa', 'scia'] : ['liscio', 'scia', 'corsa']) });
    FLU.px = FLU.modo === 'liscio' ? rnd(110000, 170000) : rnd(70000, 130000); FLU.scia = FLU.modo === 'scia' ? rnd(.3, .6) : 1; FLU.vel = FLU.modo === 'corsa' ? rnd(1.6, 2.8) : rnd(1, 1.4); }
  else FLU.on = false;
  resize(); return true;
}
let W, H, N, label, prevColor, img, mask, maskA, maskB, dist, stack, PR, PT, rowOff, colOff, RMAX;
const echoC = document.createElement('canvas'); const ectx = echoC.getContext('2d');

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.width = innerWidth * dpr; view.height = innerHeight * dpr;
  const s = Math.min(1, Math.sqrt((FLU.on ? FLU.px : 300000) / (innerWidth * innerHeight)));
  W = Math.max(160, Math.round(innerWidth * s)); H = Math.max(100, Math.round(innerHeight * s)); N = W * H;
  for (const c of [work, snap, echoC]) { c.width = W; c.height = H; }
  label = new Int32Array(N); prevColor = new Uint8Array(N).fill(255);
  img = wctx.createImageData(W, H); maskA = new Uint8Array(N); maskB = new Uint8Array(N); mask = maskA;
  rowOff = new Float32Array(H); colOff = new Float32Array(W);
  // coordinate polari precalcolate (per vortici, lenti, tunnel)
  PR = new Float32Array(N); PT = new Float32Array(N); RMAX = Math.hypot(W, H) / 2;
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) { const dx = x - W / 2, dy = y - H / 2; PR[y * W + x] = Math.hypot(dx, dy); PT[y * W + x] = Math.atan2(dy, dx); } dist = new Uint16Array(N); stack = new Int32Array(N + 8);
  for (const a of active) { a.proc.layer = null; a.proc.init(); }
}

/* =================== PROCESSI STOCASTICI =================== */
const P = {};

// rette di Poisson in moto browniano, con nascite e morti
P.tagli = {
  name: 'tagli',
  init() { this.l = []; const n = 6 + poisson(5); for (let i = 0; i < n; i++) this.l.push(this.nl()); },
  nl() { return { x: rnd(W), y: rnd(H), a: rnd(Math.PI), va: 0, vx: 0, vy: 0 }; },
  step() {
    for (const l of this.l) {
      l.va = .96 * l.va + .0009 * gauss(); l.a += l.va;
      l.vx = .96 * l.vx + .08 * gauss(); l.vy = .96 * l.vy + .08 * gauss();
      l.x = (l.x + l.vx + W) % W; l.y = (l.y + l.vy + H) % H;
    }
    if (Math.random() < .006 && this.l.length < 20) this.l.push(this.nl());
    if (Math.random() < .005 && this.l.length > 4) this.l.splice((Math.random() * this.l.length) | 0, 1);
  },
  render(c) {
    const R = W + H; c.beginPath();
    for (const l of this.l) { const dx = Math.cos(l.a) * R, dy = Math.sin(l.a) * R; c.moveTo(l.x - dx, l.y - dy); c.lineTo(l.x + dx, l.y + dy); }
    c.stroke();
  }
};

// passeggiate aleatorie da bordo a bordo, che vibrano
P.cammini = {
  name: 'cammini',
  init() { this.w = []; const n = 5 + poisson(3); for (let i = 0; i < n; i++) this.w.push(this.nw()); },
  nw() {
    const pts = [], hz = Math.random() < .5, steps = 40;
    let x = hz ? -10 : rnd(W), y = hz ? rnd(H) : -10, ang = hz ? 0 : Math.PI / 2; const base = ang;
    const len = (hz ? W + 20 : H + 20) / steps;
    for (let i = 0; i <= steps * 3; i++) {
      pts.push({ x, y, ox: 0, oy: 0, vx: 0, vy: 0 });
      if (i > 2 && (x < -15 || y < -15 || x > W + 15 || y > H + 15)) break;
      ang = base + .8 * (ang - base) + .3 * gauss(); x += Math.cos(ang) * len; y += Math.sin(ang) * len;
    }
    return pts;
  },
  step() {
    for (const w of this.w) for (const p of w) {
      p.vx = .9 * p.vx + .12 * gauss() - .01 * p.ox; p.vy = .9 * p.vy + .12 * gauss() - .01 * p.oy; p.ox += p.vx; p.oy += p.vy;
    }
    if (Math.random() < .004 && this.w.length < 11) this.w.push(this.nw());
    if (Math.random() < .003 && this.w.length > 3) this.w.shift();
  },
  render(c) {
    c.beginPath();
    for (const p of this.w) {
      c.moveTo(p[0].x + p[0].ox, p[0].y + p[0].oy);
      for (let i = 1; i < p.length - 1; i++) {
        const a = p[i], b = p[i + 1];
        c.quadraticCurveTo(a.x + a.ox, a.y + a.oy, (a.x + a.ox + b.x + b.ox) / 2, (a.y + a.oy + b.y + b.oy) / 2);
      }
      const q = p[p.length - 1]; c.lineTo(q.x + q.ox, q.y + q.oy);
    }
    c.stroke();
  }
};

// tasselli con archi: una catena di Markov ruota un tassello alla volta
P.tasselli = {
  name: 'tassellatura',
  init() {
    this.s = Math.round(Math.min(W, H) / rnd(4, 10));
    this.cols = Math.ceil(W / this.s) + 1; this.rows = Math.ceil(H / this.s) + 1;
    this.t = []; for (let i = 0; i < this.cols * this.rows; i++) this.t.push({ r: Math.random() < .5 ? 0 : 1, from: 0, k: Math.random() < .12 ? 2 : 0, an: 1 });
  },
  step() {
    for (let f = poisson(.4); f > 0; f--) { const t = pick(this.t); if (t.an >= 1) { t.from = t.r; t.r = 1 - t.r; t.an = 0; if (Math.random() < .1) t.k = Math.random() < .12 ? 2 : 0; } }
    for (const t of this.t) if (t.an < 1) t.an = Math.min(1, t.an + .04);
  },
  render(c) {
    const s = this.s, h = s / 2; c.beginPath();
    for (let j = 0; j < this.rows; j++) for (let i = 0; i < this.cols; i++) {
      const t = this.t[j * this.cols + i];
      const rot = (t.an < 1 ? t.from + (t.r - t.from) * ease(t.an) : t.r) * Math.PI / 2;
      const cx = i * s + h, cy = j * s + h, co = Math.cos(rot), si = Math.sin(rot);
      const T = (x, y) => [cx + (x - h) * co - (y - h) * si, cy + (x - h) * si + (y - h) * co];
      if (t.k === 2) { let a = T(h, 0), b = T(h, s); c.moveTo(...a); c.lineTo(...b); a = T(0, h); b = T(s, h); c.moveTo(...a); c.lineTo(...b); }
      else {
        let o = T(0, 0); let st = T(h, 0); c.moveTo(...st); c.arc(o[0], o[1], h, rot, rot + Math.PI / 2);
        o = T(s, s); st = T(h, s); c.moveTo(...st); c.arc(o[0], o[1], h, rot + Math.PI, rot + Math.PI * 1.5);
      }
    }
    c.stroke();
  }
};

// alberi di Galton-Watson: rami come tubi, ogni albero è una regione
P.alberi = {
  name: 'alberi',
  init() { this.tr = []; const n = 2 + poisson(2); for (let i = 0; i < n; i++) this.tr.push(this.nt()); this.t = 0; },
  nt() {
    const sd = (Math.random() * 4) | 0;
    const r = sd === 0 ? { x: rnd(W), y: H + 5, a: -Math.PI / 2 } : sd === 1 ? { x: rnd(W), y: -5, a: Math.PI / 2 } : sd === 2 ? { x: -5, y: rnd(H), a: 0 } : { x: W + 5, y: rnd(H), a: Math.PI };
    const k0 = Math.min(W, H) / 600;
    const grow = (d, len) => {
      const kids = []; if (d < 6) { const k = d === 0 ? 2 + poisson(1) : poisson(1.6); for (let i = 0; i < Math.min(k, 4); i++) kids.push(grow(d + 1, len * rnd(.55, .85))); }
      return { da: d === 0 ? .3 * gauss() : .75 * gauss(), len, w: Math.max(6, 34 * Math.pow(.68, d)) * k0, ph: rnd(6.28), kids };
    };
    return { ...r, n: grow(0, Math.min(W, H) * rnd(.28, .42)), g: 0 };
  },
  step() {
    this.t += .01; for (const t of this.tr) t.g = Math.min(1, t.g + .004);
    if (Math.random() < .004) { if (this.tr.length > 2) this.tr.shift(); this.tr.push(this.nt()); }
  },
  render(c) {
    const segs = [], T = this.t;
    const rec = (n, x, y, a, g) => {
      const aa = a + n.da + .08 * Math.sin(T * 1.3 + n.ph), l = n.len * Math.min(1, g);
      const x2 = x + Math.cos(aa) * l, y2 = y + Math.sin(aa) * l; segs.push([x, y, x2, y2, n.w]);
      if (g > 1) for (const k of n.kids) rec(k, x2, y2, aa, g - 1);
    };
    for (const t of this.tr) rec(t.n, t.x, t.y, t.a, t.g * 7);
    for (const [a, b, x, y, w] of segs) { c.lineWidth = w + LW; c.beginPath(); c.moveTo(a, b); c.lineTo(x, y); c.stroke(); }
    c.globalCompositeOperation = 'destination-out';
    for (const [a, b, x, y, w] of segs) { c.lineWidth = Math.max(1, w - LW); c.beginPath(); c.moveTo(a, b); c.lineTo(x, y); c.stroke(); }
    c.globalCompositeOperation = 'source-over'; c.lineWidth = LW;
  }
};

// Voronoi di punti in moto browniano
P.celle = {
  name: 'celle',
  init() { this.p = []; const n = 10 + poisson(10); for (let i = 0; i < n; i++) this.p.push({ x: rnd(W), y: rnd(H), vx: 0, vy: 0 }); },
  step() {
    for (const p of this.p) {
      p.vx = .95 * p.vx + .06 * gauss(); p.vy = .95 * p.vy + .06 * gauss(); p.x += p.vx; p.y += p.vy;
      if (p.x < 0 || p.x > W) { p.vx *= -1; p.x = clamp(p.x, 0, W); } if (p.y < 0 || p.y > H) { p.vy *= -1; p.y = clamp(p.y, 0, H); }
    }
    if (Math.random() < .006 && this.p.length < 36) this.p.push({ x: rnd(W), y: rnd(H), vx: 0, vy: 0 });
    if (Math.random() < .005 && this.p.length > 7) this.p.splice((Math.random() * this.p.length) | 0, 1);
  },
  render(c) {
    const Q = this.p, R = W + H; c.beginPath();
    for (let i = 0; i < Q.length; i++) for (let j = i + 1; j < Q.length; j++) {
      const a = Q[i], b = Q[j], mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2, dx = -(b.y - a.y), dy = b.x - a.x, dl = Math.hypot(dx, dy) || 1, ux = dx / dl, uy = dy / dl;
      let t0 = -R, t1 = R;
      for (let k = 0; k < Q.length && t0 < t1; k++) {
        if (k === i || k === j) continue; const q = Q[k];
        const nx = q.x - a.x, ny = q.y - a.y, cc = (q.x * q.x + q.y * q.y - a.x * a.x - a.y * a.y) / 2, A = nx * ux + ny * uy, B = cc - (nx * mx + ny * my);
        if (Math.abs(A) < 1e-9) { if (B < 0) t0 = t1; continue; }
        const t = B / A; if (A > 0) t1 = Math.min(t1, t); else t0 = Math.max(t0, t);
      }
      if (t0 < t1) { c.moveTo(mx + ux * t0, my + uy * t0); c.lineTo(mx + ux * t1, my + uy * t1); }
    }
    c.stroke();
  }
};

// famiglie di onde parallele che scorrono (op-art)
P.onde = {
  name: 'onde',
  init() {
    this.a = rnd(Math.PI); this.n = 5 + poisson(6); this.sp = Math.max(W, H) / this.n * rnd(.35, .8);
    this.A = rnd(.2, 1.2) * this.sp; this.lam = rnd(60, 260); this.ph = rnd(6.28); this.v = rnd(.01, .04) * (Math.random() < .5 ? -1 : 1);
    this.twist = rnd(-.6, .6); this.va = 0;
  },
  step() { this.ph += this.v; this.va = .98 * this.va + .00025 * gauss(); this.a += this.va; this.A *= 1 + .004 * gauss(); this.A = clamp(this.A, 4, this.sp * 1.6); },
  render(c) {
    const R = Math.hypot(W, H) / 2 + 20, co = Math.cos(this.a), si = Math.sin(this.a); c.beginPath();
    for (let k = -this.n; k <= this.n; k++) {
      const off = k * this.sp;
      for (let x = -R, f = true; x <= R; x += 6) {
        const y = off + this.A * Math.sin(x / this.lam * 6.283 + this.ph + k * this.twist);
        const px = W / 2 + x * co - y * si, py = H / 2 + x * si + y * co;
        f ? c.moveTo(px, py) : c.lineTo(px, py); f = false;
      }
    }
    c.stroke();
  }
};

// gocce: cerchi concentrici che nascono secondo un processo di Poisson e si espandono
P.cerchi = {
  name: 'gocce',
  init() { this.r = []; this.rate = rnd(.015, .05); this.v = rnd(.5, 1.6); this.gap = rnd(14, 40); for (let i = 0; i < 3; i++) this.drop(); },
  drop() { this.r.push({ x: rnd(W), y: rnd(H), r: 0, max: rnd(.3, .9) * Math.max(W, H), n: 2 + poisson(2) }); },
  step() {
    if (Math.random() < this.rate) this.drop();
    for (const d of this.r) d.r += this.v; this.r = this.r.filter(d => d.r - d.n * this.gap < d.max);
    if (this.r.length > 14) this.r.shift();
  },
  render(c) {
    c.beginPath();
    for (const d of this.r) for (let i = 0; i < d.n; i++) { const rr = d.r - i * this.gap; if (rr > 1 && rr < d.max) { c.moveTo(d.x + rr, d.y); c.arc(d.x, d.y, rr, 0, 6.2832); } }
    c.stroke();
  }
};

// spirali archimedee che ruotano e vagano
P.spirali = {
  name: 'spirali',
  init() { this.s = []; const n = 1 + poisson(1.2); for (let i = 0; i < n; i++) this.s.push({ x: rnd(W), y: rnd(H), vx: 0, vy: 0, a: rnd(6.28), w: rnd(.01, .04) * (Math.random() < .5 ? -1 : 1), b: rnd(4, 12), arms: 1 + ((Math.random() * 3) | 0), turns: rnd(4, 9) }); },
  step() { for (const s of this.s) { s.a += s.w; s.vx = .97 * s.vx + .05 * gauss(); s.vy = .97 * s.vy + .05 * gauss(); s.x = clamp(s.x + s.vx, 0, W); s.y = clamp(s.y + s.vy, 0, H); s.b = clamp(s.b * (1 + .003 * gauss()), 3, 16); } },
  render(c) {
    c.beginPath();
    for (const s of this.s) for (let m = 0; m < s.arms; m++) {
      const a0 = s.a + m * 6.2832 / s.arms; c.moveTo(s.x, s.y);
      for (let th = 0; th < s.turns * 6.2832; th += .12) { const r = s.b * th; c.lineTo(s.x + r * Math.cos(th + a0), s.y + r * Math.sin(th + a0)); }
    }
    c.stroke();
  }
};

// griglia deformata da un campo di onde che cambia
P.griglia = {
  name: 'griglia',
  init() { this.n = 4 + poisson(4); this.t = 0; this.f = [rnd(.004, .02), rnd(.004, .02), rnd(.004, .02), rnd(.004, .02)]; this.A = rnd(10, 60); this.v = rnd(.01, .03); },
  step() { this.t += this.v; this.A = clamp(this.A * (1 + .006 * gauss()), 6, 90); },
  render(c) {
    const n = this.n, sx = W / n, sy = H / n, f = this.f, t = this.t, A = this.A; c.beginPath();
    for (let i = 0; i <= n; i++) {
      for (let y = -10, s = true; y <= H + 10; y += 8) { const x = i * sx + A * Math.sin(y * f[0] + t) * Math.cos(i * .7 + t * .6); s ? c.moveTo(x, y) : c.lineTo(x, y); s = false; }
      for (let x = -10, s = true; x <= W + 10; x += 8) { const y = i * sy + A * Math.sin(x * f[1] - t * 1.1) * Math.cos(i * .9 - t * .4); s ? c.moveTo(x, y) : c.lineTo(x, y); s = false; }
    }
    c.stroke();
  }
};

// caduta casuale di forme geometriche (cerchi, quadrati, triangoli) che vivono e muoiono
P.forme = {
  name: 'forme',
  init() { this.f = []; for (let i = 0; i < 6; i++) this.add(); },
  add() { const m = Math.min(W, H); this.f.push({ x: rnd(W), y: rnd(H), r: rnd(.06, .35) * m, k: (Math.random() * 4) | 0, a: rnd(6.28), w: .01 * gauss(), life: rnd(300, 1200), g: 0 }); },
  step() {
    if (Math.random() < .03 && this.f.length < 24) this.add();
    for (const s of this.f) { s.a += s.w; s.life--; s.g = clamp(s.life < 60 ? s.life / 60 : s.g + .03, 0, 1); }
    this.f = this.f.filter(s => s.life > 0);
  },
  render(c) {
    c.beginPath();
    for (const s of this.f) {
      const r = s.r * ease(s.g);
      if (s.k === 0) { c.moveTo(s.x + r, s.y); c.arc(s.x, s.y, r, 0, 6.2832); }
      else { const nv = s.k === 1 ? 4 : s.k === 2 ? 3 : 6; for (let i = 0; i <= nv; i++) { const a = s.a + i * 6.2832 / nv; i ? c.lineTo(s.x + r * Math.cos(a), s.y + r * Math.sin(a)) : c.moveTo(s.x + r * Math.cos(a), s.y + r * Math.sin(a)); } }
    }
    c.stroke();
  }
};

// raggiera: raggi da un centro vagante, angoli che tremano
P.raggi = {
  name: 'raggiera',
  init() { this.x = rnd(W); this.y = rnd(H); this.vx = 0; this.vy = 0; this.r = []; const n = 6 + poisson(10); for (let i = 0; i < n; i++) this.r.push({ a: rnd(6.28), v: 0 }); this.rot = rnd(-.01, .01); },
  step() {
    this.vx = .97 * this.vx + .1 * gauss(); this.vy = .97 * this.vy + .1 * gauss(); this.x = clamp(this.x + this.vx, -W * .2, W * 1.2); this.y = clamp(this.y + this.vy, -H * .2, H * 1.2);
    for (const r of this.r) { r.v = .95 * r.v + .002 * gauss(); r.a += r.v + this.rot; }
  },
  render(c) { const R = W + H; c.beginPath(); for (const r of this.r) { c.moveTo(this.x, this.y); c.lineTo(this.x + Math.cos(r.a) * R, this.y + Math.sin(r.a) * R); } c.stroke(); }
};

// rose (rodonee) che ruotano e cambiano numero di petali
P.rose = {
  name: 'rose',
  init() { this.r = []; const n = 1 + poisson(1.3); for (let i = 0; i < n; i++) this.r.push({ x: rnd(W * .2, W * .8), y: rnd(H * .2, H * .8), A: rnd(.25, .7) * Math.min(W, H), p: 2 + ((Math.random() * 6) | 0), q: 1 + ((Math.random() * 3) | 0), m: rnd(6.28), a: rnd(6.28), w: rnd(-.01, .01), rings: 1 + poisson(1.5) }); },
  step() { for (const r of this.r) { r.a += r.w; r.m += .006; } },
  render(c) {
    c.beginPath();
    for (const r of this.r) for (let g = 0; g < r.rings; g++) {
      const k = r.p / r.q + .15 * Math.sin(r.m), A = r.A * (1 - g / (r.rings + .5)), end = 6.2832 * r.q;
      for (let th = 0, f = true; th <= end + .01; th += .02) { const rr = A * Math.cos(k * th); const px = r.x + rr * Math.cos(th + r.a), py = r.y + rr * Math.sin(th + r.a); f ? c.moveTo(px, py) : c.lineTo(px, py); f = false; }
    }
    c.stroke();
  }
};

// figure di Lissajous con fase che deriva
P.lissajous = {
  name: 'lissajous',
  init() { this.l = []; const n = 1 + poisson(.8); for (let i = 0; i < n; i++) this.l.push({ a: 1 + ((Math.random() * 5) | 0), b: 1 + ((Math.random() * 5) | 0), d: rnd(6.28), v: rnd(.004, .012), Ax: rnd(.3, .55) * W, Ay: rnd(.3, .55) * H }); },
  step() { for (const l of this.l) l.d += l.v; },
  render(c) {
    c.beginPath();
    for (const l of this.l) for (let t = 0, f = true; t <= 6.2832 + .01; t += .006) { const x = W / 2 + l.Ax * Math.sin(l.a * t + l.d), y = H / 2 + l.Ay * Math.sin(l.b * t); f ? c.moveTo(x, y) : c.lineTo(x, y); f = false; }
    c.stroke();
  }
};

/* ---------- MOTORI CAOTICI: deterministici, ma nati da un seme casuale ---------- */
// piccola tela di servizio per i campi calcolati a bassa risoluzione
function fieldCanvas(o, gw, gh) { o.gw = gw; o.gh = gh; o.sc = document.createElement('canvas'); o.sc.width = gw; o.sc.height = gh; o.sx = o.sc.getContext('2d'); o.im = o.sx.createImageData(gw, gh); }
function drawField(o, c, smooth = true) { o.sx.putImageData(o.im, 0, 0); c.save(); c.imageSmoothingEnabled = smooth; c.drawImage(o.sc, 0, 0, W, H); c.restore(); }

// reazione-diffusione di Gray-Scott (i motivi di Turing): macchie, labirinti, coralli che crescono
const RD = [[.0545, .062], [.029, .057], [.022, .051], [.03, .062], [.025, .06], [.042, .063], [.046, .063], [.034, .063], [.0367, .0649], [.018, .051]];
P.turing = {
  name: 'reazione-diffusione',
  init() {

// automa elementare di Wolfram (regole 30, 90, 110...): una riga genera la successiva, il quadro scorre
P.wolfram = {
  name: 'automa di Wolfram',
  init() {

// attrattori strani (Lorenz, Rössler, Thomas): una traiettoria caotica che non si ripete mai, vista in 3D che ruota
const ATTR = {
  lorenz: { dt: .006, f: ([x, y, z]) => [10 * (y - x), x * (28 - z) - y, x * y - 8 / 3 * z], p: [.1, 0, 0] },
  rossler: { dt: .02, f: ([x, y, z]) => [-y - z, x + .2 * y, .2 + z * (x - 5.7)], p: [1, 1, 0] },
  thomas: { dt: .05, f: ([x, y, z]) => [Math.sin(y) - .208 * x, Math.sin(z) - .208 * y, Math.sin(x) - .208 * z], p: [1.1, 1.1, -.01] },
};
P.attrattore = {
  name: 'attrattore strano',
  init() {
    this.kind = pick(Object.keys(ATTR)); const A = ATTR[this.kind]; this.len = 500 + ((Math.random() * 900) | 0);
    let q = A.p.map(v => v + .01 * gauss()); for (let i = 0; i < 1500; i++) q = this.adv(q);
    this.pts = []; for (let i = 0; i < this.len; i++) { q = this.adv(q); this.pts.push(q); }
    this.ax = rnd(6.28); this.ay = rnd(6.28); this.vx = rnd(-.006, .006); this.vy = rnd(-.006, .006); this.sc = 0;
  },
  adv(q) { const A = ATTR[this.kind], d = A.f(q); return [q[0] + d[0] * A.dt, q[1] + d[1] * A.dt, q[2] + d[2] * A.dt]; },
  step() { for (let i = 0; i < 2; i++) { this.pts.push(this.adv(this.pts[this.pts.length - 1])); this.pts.shift(); } this.ax += this.vx; this.ay += this.vy; },
  render(c) {
    const ca = Math.cos(this.ax), sa = Math.sin(this.ax), cb = Math.cos(this.ay), sb = Math.sin(this.ay), P2 = [];
    let mx = 0, my = 0; for (const p of this.pts) { mx += p[0]; my += p[1]; } mx /= this.pts.length; my /= this.pts.length;
    let mz = 0; for (const p of this.pts) mz += p[2]; mz /= this.pts.length;
    let ext = 1e-6;
    for (const p of this.pts) { const x = p[0] - mx, y = p[1] - my, z = p[2] - mz; const x1 = x * ca - y * sa, y1 = x * sa + y * ca; const y2 = y1 * cb - z * sb; P2.push([x1, y2]); ext += Math.abs(x1) / W + Math.abs(y2) / H; }
    ext /= 2 * P2.length;
    this.sc = this.sc ? this.sc + (.24 / ext - this.sc) * .05 : .24 / ext;
    c.beginPath(); P2.forEach(([x, y], i) => i ? c.lineTo(W / 2 + x * this.sc, H / 2 + y * this.sc) : c.moveTo(W / 2 + x * this.sc, H / 2 + y * this.sc)); c.stroke();
  }

// ogni stile è una sequenza di anelli dal centro verso fuori; misure in frazioni del raggio, variate dal caso

P.mandala = {
  name: 'mandala',
  init() {

    const m = Math.min(W, H); this.R = Math.random() < .25 ? Math.max(W, H) * rnd(.6, .9) : m * rnd(.44, .6);
    this.cx = Math.random() < .75 ? W / 2 : rnd(W * .3, W * .7); this.cy = Math.random() < .75 ? H / 2 : rnd(H * .3, H * .7);
    let dir = Math.random() < .5 ? 1 : -1;
    for (const r of this.rings) { r.rot = rnd(6.28) * (Math.random() < .5 ? 0 : 1); r.w = dir * rnd(.0015, .006); dir = -dir; }
    this.t = 0; this.breath = rnd(.01, .04);

  step() { this.t += .01; for (const r of this.rings) r.rot += r.w; },

        case 'denti': { const o = (g.off || 0) * step; for (let k = 0; k <= n; k++) { const a = rot + o + k * step; k ? c.lineTo(...P2(g.r0, a - step / 2)) : c.moveTo(...P2(g.r0, a - step / 2)); c.lineTo(...P2(g.r1, a)); } } break;

        case 'celle': c.moveTo(...P2(g.r0, 0)); c.arc(cx, cy, g.r0 * R, 0, 6.2832); c.moveTo(...P2(g.r1, 0)); c.arc(cx, cy, g.r1 * R, 0, 6.2832);
          for (let k = 0; k < n; k++) { const a = rot + k * step; c.moveTo(...P2(g.r0, a)); c.lineTo(...P2(g.r1, a)); } break;

            ? [[-s, -s], [-s * .35, -s], [-s * .35, -s * 1.12], [-s * .22, -s * 1.12], [-s * .22, -s * 1.22], [s * .22, -s * 1.22], [s * .22, -s * 1.12], [s * .35, -s * 1.12], [s * .35, -s]]

};

/* =================== CICLO =================== */
let last = performance.now(), paused = false, showLines = false;
function loop(t) {

  if (MONO.phase) {
    if (MONO.phase === 'in') { MONO.a = Math.min(1, MONO.a + dt / (MONO.fin || (REGIA.on ? .35 : 1.4))); if (MONO.a >= 1) { MONO.phase = 'ferma'; MONO.t = 0; drawMono(1); } }

    if (!(fermo ? FERMO.colorsStill : RIT.colorsStill)) { S.hue += S.hueV * dt; S.cyc += (S.cycV || .25) * dt; S.bandOff += S.bandV * 30 * dt; }
    frame(t, 0); return;
  }
  S.hueV += (S.hueVt - S.hueV) * dt * .4; S.hue += S.hueV * dt;
  S.spatial += (S.spatialT - S.spatial) * dt * .3;

  { const w = S.warp; // le distorsioni entrano ed escono gradualmente
    if (w.next !== w.type) { w.amt -= dt * .35; if (w.amt <= 0) { w.amt = 0; w.type = w.next; } }
    else if (w.type !== 'nessuna') w.amt = Math.min(1, w.amt + dt * .2); }

  const f0 = performance.now(); frame(t, dt); if (TD.phase) draw3D(dt); if (!MO.phase) mostroPasso(false); window.__ft = .9 * (window.__ft || 0) + .1 * (performance.now() - f0);
  if (document.body.classList.contains('ui')) updateInfo();
}

/* =================== INTERAZIONE =================== */
const info = document.getElementById('info');
let noteUntil = 0;
function updateInfo() {
  if (performance.now() < noteUntil) return;
  info.textContent = (REGIA.on ? `${FO.kind ? 'fosfeni: ' + FONOMI[FO.kind] + ' · ' : ''}${FL.on ? 'lampeggio ' + (FL.tipo || '') + (FLF.forma ? ' → ' + FLF.forma : '') + ' · ' : ''}${REGIA.modo} · ${asse()} ${REGIA.dis.toFixed(2)} · tempo: ${REGIA.over ? 'SOVRACCARICO' : REGIA.tempo}${REGIA.voce ? ' · voce' : ''} · velocità ${S.tscale.toFixed(1)} · tagli ${REGIA.n}\n` : '') + `${active.map(a => a.proc.name + (a.target ? '' : ' ↘')).join(' × ')}  ·  ${S.palTo.name}  ·  simmetria: ${S.sym}\n` +
    `mosaico: ${S.tile.nx}×${S.tile.ny} ${S.tile.nx > 1 ? S.tile.mode : ''}  ·  distorsione: ${S.warp.next}  ·  eco: ${S.echo.on ? 'sì' : 'no'}\n` +
    `spazio/clic: nuovo processo · ↓: togli · C: colori · K: simmetria · T: mosaico · D: distorsione · E: eco · M: mandala · V: telecamera · A: figura · O: omaggio · I: illusione · X: lettere · N: monocromo · H: bande · B: Boetti · J: arte islamica · Q: solidi · Y: quadri classici · W: arte concreta · 7: Yturralde · 6: Rorschach · 5: sagome · 4: lettera a piena pagina · 3: entrata nel 3D · 2: labirinto fermo · 1: labirinto nel flusso · Invio: cambia tempo · , canale di Shannon · . gioco del caos · - caso/caos · ? immagine ambigua · ! mostro (MOSTRAI) · ' volto · + natura · < blotter · * fosfeni · 9: tessuto fermo · 8: tessuto nel flusso · U: spirali (girasoli, mosaici romani, dischi polari, Douady–Couder) · R: glitch · Z: lampeggio · 0: lampeggio sì/no · G: fiori · S: serie · ; metamorfosi · : zoom infinito · _ loop · % retroazione · $ Rutt-Etra · / disco iperbolico · & luce liquida · ( cimatica · ) kené · " o ì lettering · é o | ipercubo · L: confini · P: pausa · F: schermo intero`;
}
let uiTimer;
function note(msg) { noteUntil = performance.now() + 4000; document.body.classList.add('ui'); info.textContent = msg; clearTimeout(uiTimer); uiTimer = setTimeout(() => document.body.classList.remove('ui'), 4000); }
addEventListener('mousemove', () => { document.body.classList.add('ui'); updateInfo(); clearTimeout(uiTimer); uiTimer = setTimeout(() => document.body.classList.remove('ui'), 2500); });
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  if (k === ' ' || k === 'arrowright' || k === 'arrowup') { if (active.length >= 3) leave(); enter(); }
  else if (k === 'arrowdown') leave();
  else if (k === 'c') newPalette();

  else if (k === 'h') newBands();
  else if (k === 't') newTile();
  else if (k === 'd') newWarp();
  else if (k === 'e') newEcho();

  else if (k === 'i') apparizione(P.illusioni);

  else if (k === 'b') apparizione(P.boetti);

  else if (k === 'q') apparizione(P.solidi);
  else if (k === 'y') quadro();
  else if (k === 'w') apparizione(P.concreto);
  else if (k === '9') apparizione(P.tessuti);

  else if (k === '5') apparizione(P.sagome);
  else if (k === '4') letteraSecca();
  else if (k === '3') entra3D();
  else if (k === '2') apparizione(P.labirinto);
  else if (k === ',') { enter(P.canale); note('canale di Shannon'); }
  else if (k === '.') { enter(P.caos); note('gioco del caos'); }
  else if (k === '>') { if (lotta()) note('lotta · ' + LT.modo + ' · ' + LT.fonte); }
  else if (k === '~' || k === 'ù') { if (fluido()) note(FLU.on ? 'fluido · ' + FLU.modo : 'fine del fluido'); }
  else if (k === '^' || k === 'ò') { if (formaSecca()) note('forma · ' + MONO.segno); }
  else if (k === 'è' || k === '[') { if (astratto()) note('astratto · ' + MONO.segno); }
  else if (k === 'à' || k === ']') { if (microscopio()) note('microscopio'); }
  else if (k === '@' || k === '°') { if (cielo()) note('cielo: ' + SC.o.cost.map(c => c.nome).join(', ')); }
  else if (k === 'ç' || k === '`' || k === '\\') { if (cinema()) note('cinema · ' + CINE_NOMI[SC.o.k]); }
  else if (k === ';') { if (metamorfosi()) note('metamorfosi'); }
  else if (k === ':') { if (zoomInfinito()) note('zoom infinito'); }
  else if (k === '_') { if (loopImmagine()) note('loop · ' + LP.dev); }

  else if (k === '$') { if (ruttEtra()) note('Rutt-Etra · ' + NV.o.colore); }

  else if (k === "'" || k === '+' || k === '<' || k === '*' || k === '?') { const q = k === '?' ? P.ambigua : k === "'" ? P.volto : k === '+' ? P.natura : k === '<' ? P.blotter : (Math.random() < .5 ? P.fosfeni : P.knoll); if (active.filter(a => a.target && !a.proc.persist).length >= 3) leave(); enter(q); note(q.name); }
  else if (k === '-') { REGIA.modo = REGIA.modo === 'caso' ? 'caos' : 'caso'; REGIA.modoT = rnd(40, 90); note('montaggio: ' + REGIA.modo); }

  else if (k === '1') { if (active.length >= 3) leave(); enter(P.labirinto); }
  else if (k === '8') { if (active.length >= 3) leave(); enter(P.tessuti); }

  else if (k === 'g') apparizione(P.fiori);
  else if (k === 's') serie();
  else if (k === 'v') toggleCam();
  else if (k === 'a') { if (active.length >= 3) leave(); enter(P.bestiario); }
  else if (k === 'o') { if (active.length >= 3) leave(); enter(P.omaggi); }
  else if (k === 'l') showLines = !showLines;
  else if (k === 'p') paused = !paused;
  else if (k === 'f') { document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {}); }
  updateInfo();
});
view.addEventListener('click', () => { if (active.length >= 3) leave(); enter(); });

S.palTo = S.palFrom = pick(PALETTES); newBands();

if (REGIA.on) { S.tscale = S.tscaleT = 2; enter(motoreNuovo()); } else enter(); active[0].p = 1; active[0].shape = 'tutto';
requestAnimationFrame(loop);
window.__S = S; window.__active = active; window.__enter = enter; window.__P = P; window.__MONO = MONO; window.__tav = tavolaRorschach; window.__INK = INK; window.__PS = { REGIA, S, RIT, MONO, TD, GL, FL, P, flDiv, enter, letteraSecca, apparizione, active, FO, FLF, fosfeni, passaggio, XF, FERMO, MO, MZ, mostro, LT, lotta, PX, pixela, LN, linee, FLU, fluido, MC, macchia, letteraSecca, formaSecca, astratto, SC, microscopio, cielo, cinema, TD, MF, LP, NV }; window.__NUOVI = { metamorfosi, zoomInfinito, loopImmagine, retroazione, ruttEtra, iperbolico, luceLiquida, cimatica, kene, lettering, ipercubo, SC, NV, LP, MF }; window.__R = REGIA; window.__TD = TD; window.__e3 = entra3D;
