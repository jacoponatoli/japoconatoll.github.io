<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMBIENET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:2;background:#000;transition:opacity 4s}
#start h1{font-weight:400;letter-spacing:.6em;font-size:clamp(28px,6vw,72px);margin:0 0 0 .6em}
#start p{opacity:.5;letter-spacing:.3em;font-size:12px;margin-top:2em;text-transform:uppercase}
#now{position:fixed;top:20px;left:24px;right:24px;font-size:11px;letter-spacing:.15em;opacity:.55;text-transform:uppercase}
#stage,#r{font-family:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:800;font-stretch:125%;white-space:nowrap;text-transform:uppercase;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;row-gap:1.2vh;color:#ff2a1a;pointer-events:none}
#stage div{line-height:.8;flex:none;animation:in 1.2s}
#r{position:absolute;left:-99999px;top:0;font-size:100px;visibility:hidden}
#msg{position:fixed;bottom:40px;left:24px;right:24px;font-size:10px;letter-spacing:.15em;opacity:.45;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes in{from{opacity:0}to{opacity:1}}
#foot{position:fixed;bottom:20px;left:24px;right:24px;font-size:10px;letter-spacing:.2em;opacity:.35;text-transform:uppercase}
</style>
</head>
<body>
<div id="start"><h1>AMBIENET</h1><p>click to listen</p></div>
<div id="now"></div>
<div id="stage"></div><span id="r" aria-hidden="true"></span><div id="msg"></div>
<div id="foot">AMBIENET — endless ambient music generated from the internet · A project by Jacopo Natoli</div>
<script>
'use strict';
/* ============ utils ============ */
const R=Math.random,pick=a=>a[Math.floor(R()*a.length)],rr=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rr(a,b+1));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mtof=m=>440*Math.pow(2,(m-69)/12);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const wpick=o=>{let s=0;for(const k in o)s+=o[k];let x=R()*s;for(const k in o){x-=o[k];if(x<=0)return k}return Object.keys(o)[0]};
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const WEST={ionian:[0,2,4,5,7,9,11],dorian:[0,2,3,5,7,9,10],lydian:[0,2,4,6,7,9,11],mixolydian:[0,2,4,5,7,9,10],aeolian:[0,2,3,5,7,8,10],phrygian:[0,1,3,5,7,8,10],'major pentatonic':[0,2,4,7,9],'minor pentatonic':[0,3,5,7,10]};
const PIANOSC={ionian:WEST.ionian,lydian:WEST.lydian,dorian:WEST.dorian,aeolian:WEST.aeolian,'major pentatonic':WEST['major pentatonic'],mixolydian:WEST.mixolydian};
const RAGAS={'raga Yaman':[0,2,4,6,7,9,11],'raga Bhairav':[0,1,4,5,7,8,11],'raga Todi':[0,1,3,6,7,8,11],'raga Marwa':[0,1,4,6,9,11],'raga Bhupali':[0,2,4,7,9],'raga Malkauns':[0,3,5,8,10],'raga Darbari':[0,2,3,5,7,8,10],'raga Bhimpalasi':[0,2,3,5,7,9,10],'raga Purvi':[0,1,4,6,7,8,11],'raga Kafi':[0,2,3,5,7,9,10],'raga Bilawal':[0,2,4,5,7,9,11]};
const EAST={'in (Japan)':[0,1,5,7,8],'yo (Japan)':[0,2,5,7,9],'hirajoshi (Japan)':[0,2,3,7,8],'iwato (Japan)':[0,1,5,6,10],'ryukyu (Okinawa)':[0,4,5,7,11],'pelog (Bali)':[0,1,3,7,8],'slendro (Java)':[0,2,5,7,9]};
const TIBET={'minor pentatonic':[0,3,5,7,10],'major pentatonic':[0,2,4,7,9],'dorian':[0,2,3,5,7,9,10],'open fifths':[0,5,7]};
// samay: the raga follows the real hour of the day
function ragaNow(){const h=new Date().getHours();
  const m=h<4?['raga Darbari','raga Malkauns']:h<7?['raga Bhairav','raga Todi']:h<10?['raga Todi','raga Bilawal','raga Bhairav']:h<13?['raga Bilawal','raga Bhupali']:h<16?['raga Bhimpalasi','raga Kafi']:h<18?['raga Bhimpalasi','raga Marwa']:h<20?['raga Marwa','raga Purvi','raga Yaman']:h<22?['raga Yaman','raga Bhupali']:['raga Darbari','raga Malkauns','raga Kafi'];
  return R()<.75?pick(m):pick(Object.keys(RAGAS))}
const S={root:38,scaleName:'dorian',scale:WEST.dorian,scene:0,color:'ambient'};
const deg=(d,base)=>{const sc=S.scale,n=sc.length,o=Math.floor(d/n),i=((d%n)+n)%n;return base+sc[i]+12*o};
const paInt=()=>S.scale.includes(7)?7:S.scale.includes(5)?5:S.scale[S.scale.length-1];

/* scene colours: what each scene leans towards */
const COLORS={
  ambient:{w:.18,scales:WEST,ia:{ambient:.38,drone:.2,indian:.14,nature:.1,tibet:.08,japan:.06,piano:.04},
    prob:{drone:.8,loops:.7,arp:.1,phase:.08,data:0.24,radio:.5,archive:.6,grains:.45,tanpura:.05,piano:.2,voices:.3,net:.4,hum:.35,city:.4,bigdrone:.5,nature:.35,sho:.1,airwaves:.3,tanpura:.15,phrase:.35,bowls:.25,chant:.08,classical:.3,slogan:.3,animals:.3}},
  indian:{w:.27,raga:true,ia:{indian:.8,drone:.1,ambient:.1},
    prob:{drone:.6,loops:.2,data:0.12,radio:.4,archive:.7,grains:.35,tanpura:.95,alap:.7,piano:.08,voices:.2,net:.15,hum:.1,city:.2,bigdrone:.2,nature:.2,airwaves:.2,phrase:.45,bowls:.15,classical:.05,slogan:.15,animals:.2}},
  piano:{w:.1,scales:PIANOSC,ia:{piano:.75,ambient:.15,nature:.1},
    prob:{drone:.65,loops:.35,phase:.06,data:0.14,radio:.35,archive:.65,grains:.4,piano:.95,voices:.25,net:.25,hum:.3,city:.3,bigdrone:.15,nature:.3,airwaves:.3,phrase:.3,bowls:.1,classical:.45,slogan:.25,animals:.15}},
  east:{w:.16,scales:EAST,ia:{japan:.42,pacific:.3,tibet:.1,nature:.09,ambient:.09},
    prob:{drone:.6,loops:.3,data:0.1,radio:.35,archive:.7,grains:.35,piano:.05,voices:.15,net:.15,hum:.1,city:.15,bigdrone:.2,nature:.5,flute:.7,koto:.5,sho:.5,gamelan:.45,airwaves:.2,phrase:.4,bowls:.3,chant:.1,classical:.08,slogan:.15,animals:.3}},
  tibet:{w:.14,scales:TIBET,ia:{tibet:.7,drone:.15,ambient:.15},
    prob:{drone:.7,bigdrone:.45,bowls:.95,chant:.65,archive:.7,phrase:.35,grains:.35,nature:.35,data:0.08,radio:.3,loops:.2,sho:.15,classical:.1,slogan:.15,voices:.1,net:.1,hum:.05,animals:.2}},
  mixed:{w:.15,raga:true,ia:{indian:.28,ambient:.18,japan:.13,tibet:.1,piano:.08,drone:.13,pacific:.1},
    prob:{drone:.6,loops:.4,data:0.18,radio:.4,archive:.65,grains:.5,tanpura:.6,alap:.3,piano:.6,voices:.35,net:.35,hum:.3,city:.4,bigdrone:.3,nature:.35,flute:.2,koto:.2,sho:.2,gamelan:.2,airwaves:.35,phrase:.45,bowls:.3,chant:.15,classical:.25,slogan:.3,animals:.3}}
};
const BASE={drone:.95,loops:.8,arp:.35,phase:.3,data:.4,radio:.5,archive:.7,grains:.65,tanpura:.75,alap:.6,piano:.75,voices:.45,net:.4,hum:.45,city:.45,bigdrone:.85,nature:.6,flute:.55,koto:.5,sho:.6,gamelan:.5,airwaves:.4,phrase:.65,bowls:.7,chant:.55,classical:.35,animals:.55,slogan:.6};
// the bed: minimal / ambient / drone. Accents: rare, quiet, never more than two at a time
const NO_RADIO=true;
const ACCENTS=['net','voices','city','airwaves','hum','slogan'];
const RHYTHMIC=['arp','phase'];

let ctx,master,reverb,delayIn,noiseBuf,rider,masterAn,preAn,meterSink,running=false;const LA={},LN={},LNv={};const L={},T={};
const nowEl=document.getElementById('now'),stage=document.getElementById('stage'),ruler=document.getElementById('r'),msgEl=document.getElementById('msg');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* what is sounding right now, in red, as large as possible: one line per sound (like SLOGAN).
   Long-lasting sounds keep their line until they end; short events (an edit, a ping) share one line. */
const live=new Map();let liveId=0,flash=null;
const clip=(t,mx=46)=>{t=String(t).replace(/\s+/g,' ').trim();return t.length>mx?t.slice(0,mx-1).trim()+'…':t};
function log(k,t,liveSec,mx){
  const text=clip(k+' · '+t,mx);
  if(liveSec===0){msgEl.textContent=text;return null}
  if(liveSec>0&&liveSec<5){flash={text,until:performance.now()+liveSec*1000};render();setTimeout(render,liveSec*1000+50);return null}
  const id=++liveId;live.set(id,text);render();
  if(liveSec>0)setTimeout(()=>unlive(id),liveSec*1000);
  return id;
}
const unlive=id=>{if(id!=null&&live.delete(id))render()};
function render(){
  const items=[...live.values()];if(flash&&performance.now()<flash.until)items.push(flash.text);
  const W=innerWidth*.92,H=innerHeight*.8,cap=innerHeight*.22;
  let sz=items.map(t=>{ruler.textContent=t;return W/(ruler.getBoundingClientRect().width||1)*100});
  const tot=sz.reduce((a,x)=>a+Math.min(x,cap)*.8,0)+innerHeight*.012*Math.max(0,items.length-1);
  const f=Math.min(1,H/tot);sz=sz.map(x=>Math.min(x,cap)*f); // fill a lot, never everything
  const old=[...stage.children].map(d=>d.textContent);
  stage.textContent='';
  items.forEach((t,i)=>{const d=document.createElement('div');d.textContent=t;d.style.fontSize=sz[i]+'px';if(old.includes(t))d.style.animation='none';stage.appendChild(d)});
}
addEventListener('resize',render);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
async function fetchJSON(u,ms=12000){const c=new AbortController();const to=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(to)}}

/* ============ audio graph ============ */
function impulse(sec,dec){const n=Math.floor(ctx.sampleRate*sec),b=ctx.createBuffer(2,n,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(R()*2-1)*Math.pow(1-i/n,dec)}return b}
function setup(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=20;comp.ratio.value=3;comp.attack.value=.05;comp.release.value=.8;
  master=ctx.createGain();master.gain.value=0;master.connect(comp);
  // brickwall limiter + meter at the very end
  const lim=ctx.createDynamicsCompressor();lim.threshold.value=-12;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.001;lim.release.value=.2;
  rider=ctx.createGain();rider.gain.value=.6;comp.connect(rider);rider.connect(lim);lim.connect(ctx.destination);
  preAn=ctx.createAnalyser();preAn.fftSize=2048;comp.connect(preAn);
  masterAn=ctx.createAnalyser();masterAn.fftSize=2048;lim.connect(masterAn);
  meterSink=ctx.createGain();meterSink.gain.value=0;meterSink.connect(ctx.destination);masterAn.connect(meterSink);preAn.connect(meterSink);
  master.gain.setTargetAtTime(.8,ctx.currentTime,3);
  reverb=ctx.createConvolver();reverb.buffer=impulse(10,2.4);const rv=ctx.createGain();rv.gain.value=.75;reverb.connect(rv);rv.connect(master);
  delayIn=ctx.createGain();const dl=ctx.createDelay(4);dl.delayTime.value=.75;const fb=ctx.createGain();fb.gain.value=.5;const lp=ctx.createBiquadFilter();lp.frequency.value=2200;
  delayIn.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);const dOut=ctx.createGain();dOut.gain.value=.5;lp.connect(dOut);dOut.connect(master);dOut.connect(reverb);
  const mk=(n,wet,del,dry=1)=>{const g=ctx.createGain();g.gain.value=0;const ng=ctx.createGain();ng.gain.value=1;g.connect(ng);
    const dr=ctx.createGain();dr.gain.value=dry;ng.connect(dr);dr.connect(master);const s=ctx.createGain();s.gain.value=wet;ng.connect(s);s.connect(reverb);
    if(del){const d=ctx.createGain();d.gain.value=del;ng.connect(d);d.connect(delayIn)}
    L[n]=g;T[n]=0;LN[n]=ng;LNv[n]=1;const an=ctx.createAnalyser();an.fftSize=2048;ng.connect(an);an.connect(meterSink);LA[n]=an};
  mk('drone',.5,0);mk('loops',.8,.15);mk('arp',.6,.4);mk('phase',.6,.15);mk('data',.9,.2);mk('radio',.55,0);mk('archive',.6,.1);mk('grains',.8,.2);
  mk('tanpura',.45,0);mk('alap',.7,.2);mk('piano',.9,.05);
  mk('voices',1.6,.35,.25); // voices: mostly reverb = a far away room
  mk('netdry',0,0,1);mk('netdelay',.25,.9,.5);mk('netverb',2.2,0,.04); // internet sounds: dry, delayed or reflected
  mk('hum',.35,0,1);mk('city',.5,0,1);mk('bigdrone',.4,0);mk('nature',.3,0,1);mk('flute',.8,.2);mk('koto',.6,.15);mk('sho',.9,0);mk('gamelan',.7,.1);mk('airwaves',1.1,.2,.6);mk('phrase',.7,.2);mk('bowls',.9,.1);mk('chant',.9,0,.6);mk('classical',2.0,.1,.15);mk('animals',.8,.15,.7);mk('slogan',1.8,.4,.3); // slogans: a far demonstration, mostly reverb // classical: almost all reverb, far away
  // pings: a message, a ring — always possible, outside the scenes
  mk('pingdry',0,0,1);mk('pingdelay',.25,.9,.5);mk('pingverb',2.2,0,.04);['pingdry','pingdelay','pingverb'].forEach(n=>L[n].gain.value=.4);
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);{const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1}
}
function tone(f,t,dur,o){
  const osc=ctx.createOscillator();osc.type=o.type||'sine';osc.frequency.value=f;if(o.detune)osc.detune.value=o.detune;
  let n=osc;if(o.cutoff){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.cutoff;fl.Q.value=o.q||.7;n.connect(fl);n=fl}
  const g=ctx.createGain(),a=Math.min(o.attack||.01,dur*.5),p=o.gain||.1;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);n.connect(g);n=g;
  if(o.pan!=null&&ctx.createStereoPanner){const pn=ctx.createStereoPanner();pn.pan.value=Math.max(-1,Math.min(1,o.pan));n.connect(pn);n=pn}
  n.connect(o.dest);osc.start(t);osc.stop(t+dur+.05);
}
const bell=(f,t,dur,gain,dest,pan)=>{tone(f,t,dur,{gain,attack:.004,dest,pan});tone(f*2.005,t,dur*.45,{gain:gain*.28,attack:.003,dest,pan});tone(f*3.99,t,dur*.18,{gain:gain*.12,attack:.002,dest,pan})};
const mallet=(f,t,gain,dest,pan,dur=2)=>{tone(f,t,dur,{gain,attack:.004,dest,pan});tone(f*4,t,.15,{gain:gain*.25,attack:.003,dest,pan})};
// soft piano: inharmonic partials, long sustain
function piano(f,t,vel,dest,pan){const B=.00035,dur=rr(6,10);for(let n=1;n<=7;n++){const fn=f*n*Math.sqrt(1+B*n*n);if(fn>11000)break;tone(fn,t,dur/(1+n*.55),{gain:vel/Math.pow(n,1.5),attack:.005,dest,pan,detune:rr(-2,2)})}}

/* ============ DRONE (Young, Radigue, Niblock) ============ */
const D={oscs:[],filter:null,lfo:null,ints:[0,7,12,19,24]};
function startDrone(){
  const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=700;f.Q.value=2;
  const lfo=ctx.createOscillator();lfo.frequency.value=.012;const lg=ctx.createGain();lg.gain.value=450;lfo.connect(lg);lg.connect(f.frequency);lfo.start();
  const out=ctx.createGain();out.gain.value=.11;f.connect(out);out.connect(L.drone);D.filter=f;D.lfo=lfo;
  ['sawtooth','triangle','sine','triangle','sine'].forEach((ty,i)=>{
    const o=ctx.createOscillator();o.type=ty;o.frequency.value=mtof(S.root+D.ints[i]);o.detune.value=rr(-7,7);
    const g=ctx.createGain();g.gain.value=.22;const tl=ctx.createOscillator();tl.frequency.value=rr(.008,.05);const tg=ctx.createGain();tg.gain.value=.18;tl.connect(tg);tg.connect(g.gain);tl.start();
    o.connect(g);let n=g;if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=[-.6,.6,-.3,.3,0][i];g.connect(p);n=p}n.connect(f);o.start();D.oscs.push(o);
  });
}
function retuneDrone(){
  const t=ctx.currentTime,sc=S.scale,pa=paInt(),third=sc[Math.min(2,sc.length-1)],top=sc[sc.length-1];
  D.ints=pick([[0,pa,12,pa+12,24],[0,12,pa+12,third+24,24],[0,pa,12,third+12,top+12]]);
  D.oscs.forEach((o,i)=>o.frequency.setTargetAtTime(mtof(S.root+D.ints[i]),t,6));
  D.filter.frequency.setTargetAtTime(rr(250,1300),t,8);
}

/* ============ LOOPS (Eno: incommensurable cycles) ============ */
let loops=[];
function newLoops(){
  loops.forEach(v=>clearTimeout(v.to));loops=[];
  for(let i=0,n=ri(3,5);i<n;i++){
    const v={d:ri(0,7),period:+rr(20,50).toFixed(1),pan:rr(-.8,.8),soft:R()<.82};
    const tick=()=>{if(T.loops>.01){const t=ctx.currentTime+.05,f=mtof(deg(v.d,S.root+24));
      if(v.soft)tone(f,t,rr(6,10),{type:'triangle',gain:.06,attack:rr(.8,2),cutoff:1500,dest:L.loops,pan:v.pan});else bell(f,t,rr(5,8),.065,L.loops,v.pan)}
      v.to=setTimeout(tick,v.period*1000)};
    v.to=setTimeout(tick,rr(0,v.period)*1000);loops.push(v);
  }
}

/* ============ sequencer (look-ahead) ============ */
const seqs=[];
setInterval(()=>{if(!running)return;const now=ctx.currentTime;for(const s of seqs){if(s.next<now)s.next=now+.05;while(s.next<now+.3){s.play(s.next);s.next+=s.interval()}}},60);

/* ============ ARP (Glass additive process) — slow and blurred ============ */
const A={pat:[0,2,4],k:1,dir:1,i:0,bpm:48,oct:2,sweep:40};
function newArp(){A.pat=Array.from({length:ri(4,7)},()=>ri(0,7));A.k=1;A.dir=1;A.i=0;A.bpm=rr(36,56);A.oct=pick([2,3]);A.sweep=rr(30,80)}
seqs.push({next:0,interval:()=>60/A.bpm/2,play:t=>{
  const sub=A.pat.slice(0,A.k),d=sub[A.i%sub.length];A.i++;
  if(A.i>=sub.length*2){A.i=0;A.k+=A.dir;if(A.k>=A.pat.length){A.k=A.pat.length;A.dir=-1}if(A.k<=1){A.k=1;A.dir=1}}
  if(T.arp<.01)return;
  const c=300+1600*(.5+.5*Math.sin(t*2*Math.PI/A.sweep));
  tone(mtof(deg(d,S.root+12*A.oct)),t,1.8,{type:'triangle',gain:.035,attack:.08,cutoff:c,q:3,dest:L.arp,pan:A.i%2?-.4:.4});
}});

/* ============ PHASE (Reich) — slow glass shimmer ============ */
const P={pat:[],iv:.34},pA={i:0},pB={i:0};
function newPhase(){const pool=shuffle([0,1,2,3,4,5,6]).slice(0,5);P.pat=Array.from({length:12},()=>pick(pool));P.iv=rr(.28,.4);pA.i=pB.i=0;if(ctx){const n=ctx.currentTime+.1;seqs[1].next=seqs[2].next=n}}
seqs.push({next:0,interval:()=>P.iv,play:t=>{const d=P.pat[pA.i++%12];if(T.phase>.01)mallet(mtof(deg(d,S.root+36)),t,.035,L.phase,-.6)}});
seqs.push({next:0,interval:()=>P.iv*.9965,play:t=>{const d=P.pat[pB.i++%12];if(T.phase>.01)mallet(mtof(deg(d,S.root+36)),t,.035,L.phase,.6)}});

/* ============ TANPURA (the drone of Indian classical music) ============ */
const TP={i:0};
function tanpuraPluck(f,t,g,pan){
  const dur=rr(5,7);
  [0,-4,4].forEach((dt,j)=>{
    const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt+rr(-1,1);
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=7; // jawari: a resonance sweeping up the harmonics
    bp.frequency.setValueAtTime(f*2,t);bp.frequency.linearRampToValueAtTime(f*rr(8,14),t+1.4);bp.frequency.exponentialRampToValueAtTime(f*3,t+dur);
    const gg=ctx.createGain();gg.gain.setValueAtTime(0,t);gg.gain.linearRampToValueAtTime(g*(j?.5:1),t+.012);gg.gain.exponentialRampToValueAtTime(.0001,t+dur);

  if(first||R()<.6){const w={};for(const k in COLORS)w[k]=COLORS[k].w;S.color=wpick(w)}
  const C=COLORS[S.color];

  while(cnt<2){const k=ks.find(k=>!on[k]);if(!k)break;on[k]=true;cnt++}

  if(!['loops','grains','archive','sho','nature','tanpura','phrase','bowls','chant'].some(k=>on[k]))on[pick(['loops','grains','archive'])]=true;
  // few things at once: the drone bed + at most 3 other layers, of which at most 1 accent
  {const acc=shuffle(ACCENTS.filter(k=>on[k]));while(acc.length>1)on[acc.pop()]=false}
  {const TEX=['loops','grains','archive','sho','nature','tanpura','phrase','bowls','chant'],keep=TEX.find(k=>on[k]);
   const act=shuffle(Object.keys(on).filter(k=>on[k]&&k!=='drone'&&k!=='bigdrone'&&k!==keep));const MAX=keep?2:3;while(act.length>MAX)on[act.pop()]=false}
  if(on.arp&&(!T.arp||R()<.5))newArp();

  if(R()<.3)newLoops();
  for(const k in on){const v=on[k]?BASE[k]*rr(.6,1):0;T[k]=v;
    (k==='net'?['netdry','netdelay','netverb']:[k]).forEach(n=>L[n]&&L[n].gain.setTargetAtTime(v,ctx.currentTime,on[k]?15:12))}
  const act=Object.keys(on).filter(k=>on[k]);
  const key=C.raga?`Sa = ${NOTES[S.root%12]} · ${S.scaleName}`:`${NOTES[S.root%12]} ${S.scaleName}`;
  nowEl.textContent=`scene ${S.scene} · ${S.color} · ${key} · ${act.join(' · ')}`;
  log('SCENE '+S.scene,`${S.color} — ${key} — ${act.join(', ')}`,0);
  setTimeout(()=>newScene(false),rr(240,420)*1000);
}

/* ============ RHYTHM FILTER ============
   every stream/file is first listened to in silence for 7 seconds;
   if it has too many attacks or a regular pulse, it is slowed to 25-50% and blurred.
   While playing it keeps being checked: if it becomes rhythmic it is slowed down. */
function score(e){
  const n=e.length;if(n<30)return{rate:0,ac:0,mean:0};
  let mean=0;for(const x of e)mean+=x;mean/=n;
  const fl=[];for(let i=1;i<n;i++)fl.push(Math.max(0,e[i]-e[i-1]));
  let on=0;for(let i=1;i<fl.length-1;i++)if(fl[i]>3.5&&fl[i]>=fl[i-1]&&fl[i]>=fl[i+1])on++;
  const m=fl.reduce((a,b)=>a+b,0)/fl.length,f=fl.map(x=>x-m);let e0=0;for(const x of f)e0+=x*x;e0=e0||1e-9;
  let ac=0;for(let lag=5;lag<=30;lag++){let s=0;for(let i=0;i+lag<f.length;i++)s+=f[i]*f[i+lag];ac=Math.max(ac,s/e0)}
  return{rate:on/(n/20),ac,mean};
}
function judge(F,H){const a=score(F),b=score(H),rate=Math.max(a.rate,b.rate),ac=Math.max(a.ac,b.ac),silent=F.length>=30&&a.mean<-58;
  return{ok:!silent&&rate<1.6&&!(ac>.4&&rate>1.0),silent,rate,ac}}

/* ============ GRAINS: new music from the dust of old tracks ============ */
async function fetchHead(url,max){
  const c=new AbortController(),to=setTimeout(()=>c.abort(),25000);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);const rd=r.body.getReader(),chunks=[];let n=0;
    while(n<max){const {done,value}=await rd.read();if(done)break;chunks.push(value);n+=value.length}
    try{c.abort()}catch(e){}
    const out=new Uint8Array(n);let o=0;for(const ch of chunks){out.set(ch,o);o+=ch.length}return out.buffer;
  }finally{clearTimeout(to)}
}
async function grainsDeck(){
  let fails=0;
  while(true){
    if(T.grains<.01){await sleep(8000);continue}
    const it=await iaNext(catNow());if(!it){fails++;await sleep(fails>8?30000:2000);continue}
    let buf=null;try{buf=await ctx.decodeAudioData(await fetchHead(it.url,2000000))}catch(e){buf=null}
    if(!buf||buf.duration<4){fails++;await sleep(fails>8?30000:1500);continue}
    fails=0;const gn=Math.max(.05,Math.min(3,Math.pow(10,(-22-bufDb(buf))/20)));
    const dur=rr(90,200),t0=ctx.currentTime,end=t0+dur,drift=rr(-.05,.05),dens=rr(.06,.16);
    const line=log('GRAINS',`new music from the dust of “${it.title}”`,dur);
    const rates=S.scale.map(s=>Math.pow(2,(s-12)/12)).concat([.5,1]);let pos=rr(0,buf.duration-3);
    const dg=ctx.createGain();dg.gain.setValueAtTime(0,t0);dg.gain.linearRampToValueAtTime(gn,t0+12);dg.gain.setValueAtTime(gn,end-12);dg.gain.linearRampToValueAtTime(0,end);dg.connect(L.grains);
    while(ctx.currentTime<end){
      const t=ctx.currentTime+.03,gd=rr(.2,.8),src=ctx.createBufferSource();src.buffer=buf;src.playbackRate.value=pick(rates);
      const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+gd/2);g.gain.linearRampToValueAtTime(0,t+gd);
      src.connect(g);let n=g;if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=rr(-.9,.9);g.connect(p);n=p}n.connect(dg);
      pos=Math.min(buf.duration-1,Math.max(0,pos+drift+rr(-.15,.15)));src.start(t,pos,gd*2);
      await sleep(dens*1000*rr(.6,1.4));
    }
    unlive(line);setTimeout(()=>dg.disconnect(),2000);await sleep(rr(0,8000));
  }
}

function noise(t,dur,o){const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=ctx.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.freq,t);if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+dur);f.Q.value=o.q||1;

  s.connect(f);f.connect(g);g.connect(o.dest);s.start(t,rr(0,1.5));s.stop(t+dur+.05);return g}

const tuned=(raw)=>R()<.5?raw:mtof(deg(ri(0,7),S.root+36)); // sometimes the notification is in the scene's key
const NET={
  'ta-tan':d=>{const f=tuned(pick([659,740,784,880])),iv=Math.pow(2,pick([4,5,7,12])/12),t=ctx.currentTime+.05;mallet(f,t,.09,d,rr(-.5,.5),.8);mallet(f*iv,t+rr(.1,.16),.09,d,rr(-.5,.5),1.2)},

  'pop':d=>{const t=ctx.currentTime+.05,o=ctx.createOscillator();o.frequency.setValueAtTime(rr(800,1300),t);o.frequency.exponentialRampToValueAtTime(rr(180,320),t+.07);const g=ctx.createGain();g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g);g.connect(d);o.start(t);o.stop(t+.15)},

  'group chat':d=>{const n=ri(3,6);for(let i=0;i<n;i++)setTimeout(()=>NET[pick(['ta-tan','message','pop'])](d),i*rr(500,1600))},

/* ============ PHRASE LOOPS: a phrase cut from the archive and repeated, like a DJ / a tape loop ============
   a 2.5–9 s phrase is cut with a crossfade (no click), repeated by 1–3 voices: same speed,
   slightly different speeds (phasing, Reich), or an octave down; with slow DJ filter sweeps. */
function bufDb(b){const d=b.getChannelData(0);let s=0,n=0;for(let i=0;i<d.length;i+=4){s+=d[i]*d[i];n++}return 10*Math.log10(s/(n||1)+1e-12)}

function loopBuffer(buf,start,len){const sr=buf.sampleRate,X=Math.floor(sr*.06),s0=Math.floor(start*sr),n=Math.floor(len*sr),out=ctx.createBuffer(buf.numberOfChannels,n,sr);
  for(let c=0;c<buf.numberOfChannels;c++){const a=buf.getChannelData(c),o=out.getChannelData(c);for(let i=0;i<n;i++){let v=a[s0+i]||0;if(i<X){const k=i/X;v=v*Math.sqrt(k)+(a[s0+n+i]||0)*Math.sqrt(1-k)}o[i]=v}}
  return out}
async function phraseDeck(){
  await sleep(rr(20,50)*1000);let fails=0;
  while(true){
    if(T.phrase<.01){await sleep(8000);continue}
    const it=await iaNext(catNow());if(!it){fails++;await sleep(fails>8?30000:2000);continue}
    let buf=null;try{buf=await ctx.decodeAudioData(await fetchHead(it.url,2500000))}catch(e){buf=null}
    if(!buf||buf.duration<14){fails++;await sleep(fails>8?30000:1500);continue}
    fails=0;
    const len=rr(2.5,9),start=rr(1,buf.duration-len-1.5),lb=loopBuffer(buf,start,len),env=bufEnv(lb),v=judge(env,env);
    if(v.silent){await sleep(1500);continue}
    let rate=pick([1,1,.75,.5]),dark=R()<.4;if(!v.ok){rate=pick([.5,.4,.33]);dark=true} // rhythmic phrases: slowed and darkened
    const norm=Math.max(.03,Math.min(3,Math.pow(10,(-24-bufDb(lb))/20)));
    const dur=rr(90,200),t=ctx.currentTime+.1,fi=rr(18,30),fo=rr(20,35);
    const out=ctx.createGain();out.gain.setValueAtTime(0,t);out.gain.linearRampToValueAtTime(1,t+fi);out.gain.setValueAtTime(1,t+dur-fo);out.gain.linearRampToValueAtTime(0,t+dur);out.connect(L.phrase);
    const filt=ctx.createBiquadFilter();filt.type=dark?'lowpass':pick(['lowpass','lowpass','highpass','bandpass']);
    const range={lowpass:[300,dark?1800:9000],highpass:[40,1200],bandpass:[300,3000]}[filt.type];if(filt.type==='bandpass')filt.Q.value=1.2;
    filt.frequency.setValueAtTime(rr(range[0],range[1]),t);for(let tt=t+rr(8,20);tt<t+dur;tt+=rr(8,20))filt.frequency.exponentialRampToValueAtTime(rr(range[0],range[1]),tt);
    const cmp=ctx.createDynamicsCompressor();cmp.threshold.value=-28;cmp.ratio.value=6;cmp.attack.value=.005;filt.connect(cmp);cmp.connect(out);
    const n=pick([1,2,2,3]),mode=n===1?'':pick(['phasing','phasing','octave']);
    for(let j=0;j<n;j++){
      const src=ctx.createBufferSource();src.buffer=lb;src.loop=true;
      src.playbackRate.value=rate*(j===0?1:mode==='octave'&&j===1?.5:pick([1.003,.997,1.006,.994]));
      const vg=ctx.createGain();vg.gain.value=norm/Math.sqrt(n)*.8;src.connect(vg);
      if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=n===1?rr(-.3,.3):(j/(n-1)*2-1)*.7;vg.connect(p);p.connect(filt)}else vg.connect(filt);
      src.start(t,rr(0,len*.9));src.stop(t+dur+.3);
    }
    log('LOOP',`${len.toFixed(1)} s phrase from “${it.title}”${n>1?' · '+n+' voices'+(mode?' · '+mode:''):''}${slowTag(rate)}`,dur);
    setTimeout(()=>{try{out.disconnect()}catch(e){}},(dur+1)*1000);
    await sleep(rr(dur*.6,dur+30)*1000);

      gg.gain.linearRampToValueAtTime(g*(j?.7:1),t+(rubbed&&i<2?d*.35:.004));gg.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(gg);let n=gg;if(ctx.createStereoPanner){const pn=ctx.createStereoPanner();pn.pan.value=Math.max(-1,Math.min(1,pan+(j?.15:-.15)));gg.connect(pn);n=pn}
      n.connect(L.bowls);o.start(t);o.stop(t+d+.1)})});

    const sum=ctx.createGain(),out=ctx.createGain();out.gain.setValueAtTime(0,t0);
    const forms=VOW[0].map((fq,i)=>{const b=ctx.createBiquadFilter();b.type='bandpass';b.frequency.value=fq;b.Q.value=[6,8,10][i];const bg=ctx.createGain();bg.gain.value=[1,.6,.25][i];sum.connect(b);b.connect(bg);bg.connect(out);return b});
    const ot=ctx.createBiquadFilter();ot.type='bandpass';ot.Q.value=30;ot.frequency.value=f0*8;const og=ctx.createGain();og.gain.value=.9;sum.connect(ot);ot.connect(og);og.connect(out); // the overtone that sings above
    const n=ri(3,5),oscs=[];
    for(let i=0;i<n;i++){const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f0*(1+rr(-.004,.004));const og2=ctx.createGain();og2.gain.value=.3;o.connect(og2);og2.connect(sum);o.start(t0);o.stop(t0+dur+1);oscs.push(o)}
    // vowels and overtones move slowly; the voices breathe in phrases
    for(let t=t0;t<t0+dur;t+=rr(4,8)){const v=pick(VOW);forms.forEach((b,i)=>b.frequency.setTargetAtTime(v[i],t,1.2));ot.frequency.setTargetAtTime(f0*pick([5,6,8,10,12]),t,.8)}
    for(let t=t0;t<t0+dur-3;){const ph=rr(6,12);out.gain.setTargetAtTime(1.2,t,.8);out.gain.setTargetAtTime(.0001,t+ph-1,.4);t+=ph+rr(.6,1.2)}
    out.gain.setTargetAtTime(0,t0+dur,.6);
    let n2=out;if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=rr(-.3,.3);out.connect(p);n2=p}n2.connect(L.chant);
    const horn=R()<.35;
    if(horn)for(let k=0;k<2;k++){const t=t0+rr(5,dur-15);tone(f0,t,rr(6,9),{type:'sawtooth',gain:.08,attack:2,cutoff:380,q:2,dest:L.chant,detune:rr(-10,10)})} // dungchen
    log('TIBETAN CHANT',`chord singing · ${NOTES[m%12]} · ${n} voices${horn?' · dungchen':''}`,dur);
    setTimeout(()=>{try{out.disconnect();sum.disconnect()}catch(e){}},(dur+3)*1000);
    await sleep(rr(dur*.7,dur+60)*1000);
  }
}

/* ============ ANIMALS: atmospheric creatures, generated ============ */
const AN={
  'birdsong':(t,d)=>{const n=ri(2,4);for(let k=0;k<n;k++){const base=rr(2400,4800),syl=ri(3,8),t0=t+k*rr(1.5,4),pan=rr(-.8,.8);
    for(let i=0;i<syl;i++){const tt=t0+i*rr(.07,.16),o=ctx.createOscillator(),g=ctx.createGain(),f=base*rr(.8,1.2);o.frequency.setValueAtTime(f,tt);o.frequency.exponentialRampToValueAtTime(f*rr(.6,1.7),tt+rr(.04,.12));
      g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.025,tt+.01);g.gain.exponentialRampToValueAtTime(.0001,tt+.14);o.connect(g);let n2=g;if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=pan;g.connect(p);n2=p}n2.connect(d);o.start(tt);o.stop(tt+.16)}}},
  'owl':(t,d)=>{const f=rr(320,420);[[0,.8],[1.3,.45],[1.85,.7]].forEach(([dt,len])=>{const tt=t+dt,o=ctx.createOscillator(),g=ctx.createGain();o.frequency.setValueAtTime(f*1.03,tt);o.frequency.linearRampToValueAtTime(f*.95,tt+len);
    g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.06,tt+.08);g.gain.linearRampToValueAtTime(0,tt+len);o.connect(g);g.connect(d);o.start(tt);o.stop(tt+len+.05);noise(tt,len,{freq:f*2,q:2,gain:.006,attack:.08,release:.2,dest:d})})},
  'whale song':(t,d)=>{const lp=ctx.createBiquadFilter();lp.frequency.value=1600;lp.connect(d);let tt=t;
    for(let k=0,n=ri(3,6);k<n;k++){const len=rr(2,4.5),o=ctx.createOscillator(),o2=ctx.createOscillator(),g=ctx.createGain(),f1=rr(150,600),f2=rr(100,900);
      [o,o2].forEach((x,j)=>{x.frequency.setValueAtTime(f1*(j+1),tt);x.frequency.exponentialRampToValueAtTime(f2*(j+1),tt+len)});
      const g2=ctx.createGain();g2.gain.value=.3;o2.connect(g2);g2.connect(g);o.connect(g);g.gain.setValueAtTime(0,tt);g.gain.linearRampToValueAtTime(.07,tt+len*.3);g.gain.linearRampToValueAtTime(0,tt+len);g.connect(lp);
      [o,o2].forEach(x=>{x.start(tt);x.stop(tt+len+.1)});tt+=len+rr(1.5,4)}},
  'distant wolf':(t,d)=>{const lp=ctx.createBiquadFilter();lp.frequency.value=1200;lp.connect(d);const o=ctx.createOscillator(),g=ctx.createGain(),v=ctx.createOscillator(),vg=ctx.createGain(),f=rr(330,420),len=rr(4,6);
    o.type='triangle';o.frequency.setValueAtTime(f,t);o.frequency.linearRampToValueAtTime(f*1.6,t+1.4);o.frequency.setValueAtTime(f*1.6,t+len-1.5);o.frequency.linearRampToValueAtTime(f*1.1,t+len);
    v.frequency.value=5;vg.gain.value=12;v.connect(vg);vg.connect(o.detune);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+1);g.gain.setValueAtTime(.05,t+len-1.5);g.gain.linearRampToValueAtTime(0,t+len);
    o.connect(g);g.connect(lp);[o,v].forEach(x=>{x.start(t);x.stop(t+len+.1)})},
  'loon':(t,d)=>{const o=ctx.createOscillator(),g=ctx.createGain(),v=ctx.createOscillator(),vg=ctx.createGain(),f=rr(650,800),len=rr(3,4.5);
    o.frequency.setValueAtTime(f,t);o.frequency.linearRampToValueAtTime(f*1.5,t+.8);o.frequency.setValueAtTime(f*1.5,t+len*.6);o.frequency.linearRampToValueAtTime(f*1.25,t+len);
    v.frequency.value=7;vg.gain.setValueAtTime(0,t);vg.gain.linearRampToValueAtTime(40,t+len);v.connect(vg);vg.connect(o.detune);
    g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.04,t+.4);g.gain.linearRampToValueAtTime(0,t+len);o.connect(g);g.connect(d);[o,v].forEach(x=>{x.start(t);x.stop(t+len+.1)})},
  'crickets':(t,d,dur)=>{for(let c=0;c<2;c++){const f=rr(4200,4900),pan=rr(-.8,.8);for(let tt=t+rr(0,1);tt<t+dur;tt+=rr(.5,.95)){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;
    g.gain.setValueAtTime(0,tt);for(let i=0;i<4;i++){g.gain.linearRampToValueAtTime(.012,tt+i*.03+.01);g.gain.linearRampToValueAtTime(0,tt+i*.03+.025)}o.connect(g);let n2=g;if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=pan;g.connect(p);n2=p}n2.connect(d);o.start(tt);o.stop(tt+.15)}}},
  'cicadas':(t,d,dur)=>{const g=noise(t,dur,{freq:rr(5500,7000),q:4,gain:.05,attack:dur*.3,release:dur*.3,dest:d})},
  'frogs at night':(t,d,dur)=>{const lp=ctx.createBiquadFilter();lp.frequency.value=700;lp.connect(d);for(let tt=t+rr(0,2);tt<t+dur;tt+=rr(1.2,4.5)){const f=rr(110,190),n=ri(6,12);
    for(let i=0;i<n;i++){const ti=tt+i*.025,o=ctx.createOscillator(),g=ctx.createGain();o.type='sawtooth';o.frequency.value=f;g.gain.setValueAtTime(0,ti);g.gain.linearRampToValueAtTime(.02,ti+.004);g.gain.linearRampToValueAtTime(0,ti+.02);o.connect(g);g.connect(lp);o.start(ti);o.stop(ti+.03)}}}
};
const AN_LONG=['crickets','cicadas','frogs at night'];
async function animalsLoop(){
  await sleep(rr(20,50)*1000);
  while(true){
    if(T.animals<.01){await sleep(8000);continue}
    const kind=pick(Object.keys(AN)),long=AN_LONG.includes(kind),dur=long?rr(50,110):12,t=ctx.currentTime+.1;

/* ============ SLOGANS: the voice of SLOGAN, as a demonstration far away ============
   every slogan of jacoponatoli.net/slogan (invented and read in the streets) is spoken by a robotic
   synthetic voice (espeak-ng, rendered by a GitHub Action into the "ambienet-voice" branch).
   Here it arrives through a radio / megaphone filter, a slow echo and a lot of reverb;
   sometimes repeated, sometimes as a small robotic crowd. Until the voices exist, the browser's own voice reads them. */
const VOICE_BASE='https://raw.githubusercontent.com/jacoponatoli/japoconatoll.github.io/ambienet-voice/';
let sloganIdx=null,sloganText=[];const sloganSeen=new Set(),sloganBuf=new Map();
async function loadSlogans(){
  try{const j=await fetchJSON(VOICE_BASE+'index.json?'+Date.now());if(j.items&&j.items.length)sloganIdx=j.items}catch(e){}
  try{const c=await fetchJSON('../slogan/corpo.json?'+Date.now());sloganText=[].concat(...(c.slogan||[]).map(g=>g.t||[]),...(c.letti||[]).map(g=>g.t||[]))}catch(e){}
}
function megaphone(dest){
  const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=rr(280,450);
  const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=rr(900,1600);bp.Q.value=rr(.8,1.6);
  const sh=ctx.createWaveShaper(),k=rr(2,5),c=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;c[i]=Math.tanh(k*x)/Math.tanh(k)}sh.curve=c;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=rr(1800,3000);
  const dl=ctx.createDelay(2);dl.delayTime.value=rr(.35,.7);const fb=ctx.createGain();fb.gain.value=rr(.25,.45);const out=ctx.createGain();out.gain.value=1;
  hp.connect(bp);bp.connect(sh);sh.connect(lp);lp.connect(out);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(out);out.connect(dest);
  return{input:hp,out};
}
async function sloganBuffer(it){
  if(sloganBuf.has(it.f))return sloganBuf.get(it.f);
  const r=await fetch(VOICE_BASE+it.f);if(!r.ok)throw new Error(r.status);const b=await ctx.decodeAudioData(await r.arrayBuffer());
  sloganBuf.set(it.f,b);if(sloganBuf.size>40)sloganBuf.delete(sloganBuf.keys().next().value);return b;
}
async function sloganLoop(){
  await sleep(rr(40,90)*1000);await loadSlogans();setInterval(loadSlogans,3600e3);
  while(true){
    if(T.slogan<.01){await sleep(10000);continue}
    if(sloganIdx&&sloganIdx.length){
      let pool=sloganIdx.filter(x=>!sloganSeen.has(x.f));if(!pool.length){sloganSeen.clear();pool=sloganIdx}
      const it=pick(pool);sloganSeen.add(it.f);
      let buf;try{buf=await sloganBuffer(it)}catch(e){await sleep(20000);continue}
      const m=megaphone(L.slogan),reps=pick([1,2,2,3]),crowd=R()<.35,rate=pick([1,1,.92,.85]),t0=ctx.currentTime+.3;let t=t0;
      for(let r=0;r<reps;r++){
        const copies=crowd?3:1;
        for(let c=0;c<copies;c++){const src=ctx.createBufferSource();src.buffer=buf;src.playbackRate.value=rate*(c?pick([.985,1.015,.97]):1);
          const g=ctx.createGain();g.gain.value=(c?.45:.9)*Math.pow(.75,r);src.connect(g);
          if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=c?rr(-.8,.8):rr(-.4,.4);g.connect(p);p.connect(m.input)}else g.connect(m.input);
          src.start(t+c*rr(.02,.09))}
        t+=buf.duration/rate+rr(1.5,4);
      }
      const total=t-t0+4;
      log('SLOGAN',it.t+(reps>1?`  ×${reps}`:'')+(crowd?' · crowd':''),total,90);
      setTimeout(()=>{try{m.out.disconnect()}catch(e){}},(total+6)*1000);
      await sleep((total+rr(90,220))*1000);
    }else if(sloganText.length&&'speechSynthesis'in window){ // fallback: the browser's voice, quiet
      const text=pick(sloganText),vs=speechSynthesis.getVoices().filter(v=>/^it/i.test(v.lang));
      const u=new SpeechSynthesisUtterance(text);if(vs.length)u.voice=pick(vs);u.lang='it-IT';u.rate=.8;u.pitch=.3;u.volume=.25;
      const id=log('SLOGAN',text,undefined,90);await new Promise(res=>{u.onend=res;u.onerror=res;setTimeout(res,15000);try{speechSynthesis.speak(u)}catch(e){res()}});unlive(id);
      await sleep(rr(90,220)*1000);
    }else await sleep(30000);
  }
}

/* ============ VOLUME GUARDIAN ============
   three levels of control, ten times a second:
   1. every layer has a ceiling: if it goes over, it is pulled down at once and released slowly;
   2. the whole mix is levelled (fast down, slow up) to stay calm and even;
   3. if the total still stays too loud for ~2 s, the loudest accent is faded out.
   (and every file/stream is already normalised on its own before it enters) */
const vbuf=new Float32Array(2048);
const rmsDb=an=>{an.getFloatTimeDomainData(vbuf);let s=0;for(let i=0;i<vbuf.length;i++)s+=vbuf[i]*vbuf[i];return 10*Math.log10(s/vbuf.length+1e-12)};
const CEIL={slogan:-31,animals:-30,bowls:-27,chant:-28,classical:-34,drone:-24,bigdrone:-23,archive:-25,radio:-27,grains:-26,loops:-27,phrase:-25,airwaves:-32,voices:-30,city:-30,hum:-33,nature:-28,data:-30,tanpura:-26,alap:-28,piano:-26,flute:-28,koto:-28,sho:-28,gamelan:-27,arp:-30,phase:-30};
let over=0,cool=0,longDb=-40,riderV=.6;
function guardian(){
  if(!running)return;const now=ctx.currentTime;
  // 1. per-layer ceilings
  for(const n in LA){const d=rmsDb(LA[n]);if(d<-90)continue;const c=CEIL[n]??(n.startsWith('ping')||n.startsWith('net')?-27:-27);
    if(d>c+2){LNv[n]=Math.max(.02,LNv[n]*Math.pow(10,(c-d)/20));LN[n].gain.setTargetAtTime(LNv[n],now,.03)}
    else if(d<c-6&&LNv[n]<1){LNv[n]=Math.min(1,LNv[n]*1.004);LN[n].gain.setTargetAtTime(LNv[n],now,.5)}}
  // 2. leveler on the whole mix
  // measured at the output (what you actually hear), aiming for about -23 dB RMS
  const out=rmsDb(masterAn);longDb=longDb*.85+out*.15;const level=Math.max(longDb,out-4);
  const want=Math.max(.08,Math.min(1,riderV*Math.pow(10,(-23-level)/20)));
  if(want<riderV){riderV=want;rider.gain.setTargetAtTime(riderV,now,.04)}
  else{riderV=Math.min(want,riderV*1.004);rider.gain.setTargetAtTime(riderV,now,.4)}
  // 3. too much for too long: an accent goes
  if(cool>0){cool--;return}
  const db=rmsDb(masterAn);over=db>-17?over+1:Math.max(0,over-1);
  if(over>=20){
    const lv={};for(const n in LA){const k=n.startsWith('net')?'net':n;if(T[k]>.01)lv[k]=Math.max(lv[k]??-200,rmsDb(LA[n]))}
    const cand=Object.keys(lv).filter(k=>k!=='drone'&&k!=='bigdrone'),acc=cand.filter(k=>ACCENTS.includes(k)||k==='data'||k==='radio');
    const loud=(acc.length?acc:cand).sort((a,b)=>lv[b]-lv[a])[0];
    if(loud){T[loud]=0;(loud==='net'?['netdry','netdelay','netverb']:[loud]).forEach(n=>L[n].gain.setTargetAtTime(0,now,2.5));
      log('VOLUME',`too much at once (${db.toFixed(1)} dB) → ${loud} fades out`,0)}
    over=0;cool=100; // wait 10 s before acting again
  }
}
setInterval(guardian,100);
