<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AMBIENET</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:ui-monospace,Menlo,Consolas,monospace;overflow:hidden}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;z-index:2;background:#000;transition:opacity 4s}
#start h1{font-weight:400;letter-spacing:.6em;font-size:clamp(28px,6vw,72px);margin:0 0 0 .6em}
#start p{opacity:.5;letter-spacing:.3em;font-size:12px;margin-top:2em;text-transform:uppercase}
#now{position:fixed;top:20px;left:24px;right:24px;font-size:11px;letter-spacing:.15em;opacity:.55;text-transform:uppercase}
#stage,#r{font-family:"Archivo","Arial Black","Helvetica Neue",Arial,sans-serif;font-weight:800;font-stretch:125%;white-space:nowrap;text-transform:uppercase;-webkit-user-select:none;user-select:none}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;row-gap:1.2vh;color:#ff2a1a;pointer-events:none}
#stage div{line-height:.8;flex:none;animation:in 1.2s}
#r{position:absolute;left:-99999px;top:0;font-size:100px;visibility:hidden}
#msg{position:fixed;bottom:40px;left:24px;right:24px;font-size:10px;letter-spacing:.15em;opacity:.45;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@keyframes in{from{opacity:0}to{opacity:1}}
#foot{position:fixed;bottom:20px;left:24px;right:24px;font-size:10px;letter-spacing:.2em;opacity:.35;text-transform:uppercase}
</style>
</head>
<body>
<div id="start"><h1>AMBIENET</h1><p>click to listen</p></div>
<div id="now"></div>
<div id="stage"></div><span id="r" aria-hidden="true"></span><div id="msg"></div>
<div id="foot">AMBIENET — endless ambient music generated from the internet · A project by Jacopo Natoli</div>
<script>
'use strict';
/* ============ utils ============ */
const R=Math.random,pick=a=>a[Math.floor(R()*a.length)],rr=(a,b)=>a+R()*(b-a),ri=(a,b)=>Math.floor(rr(a,b+1));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const mtof=m=>440*Math.pow(2,(m-69)/12);
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const wpick=o=>{let s=0;for(const k in o)s+=o[k];let x=R()*s;for(const k in o){x-=o[k];if(x<=0)return k}return Object.keys(o)[0]};
const NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const WEST={ionian:[0,2,4,5,7,9,11],dorian:[0,2,3,5,7,9,10],lydian:[0,2,4,6,7,9,11],mixolydian:[0,2,4,5,7,9,10],aeolian:[0,2,3,5,7,8,10],phrygian:[0,1,3,5,7,8,10],'major pentatonic':[0,2,4,7,9],'minor pentatonic':[0,3,5,7,10]};
const PIANOSC={ionian:WEST.ionian,lydian:WEST.lydian,dorian:WEST.dorian,aeolian:WEST.aeolian,'major pentatonic':WEST['major pentatonic'],mixolydian:WEST.mixolydian};
const RAGAS={'raga Yaman':[0,2,4,6,7,9,11],'raga Bhairav':[0,1,4,5,7,8,11],'raga Todi':[0,1,3,6,7,8,11],'raga Marwa':[0,1,4,6,9,11],'raga Bhupali':[0,2,4,7,9],'raga Malkauns':[0,3,5,8,10],'raga Darbari':[0,2,3,5,7,8,10],'raga Bhimpalasi':[0,2,3,5,7,9,10],'raga Purvi':[0,1,4,6,7,8,11],'raga Kafi':[0,2,3,5,7,9,10],'raga Bilawal':[0,2,4,5,7,9,11]};
const EAST={'in (Japan)':[0,1,5,7,8],'yo (Japan)':[0,2,5,7,9],'hirajoshi (Japan)':[0,2,3,7,8],'iwato (Japan)':[0,1,5,6,10],'ryukyu (Okinawa)':[0,4,5,7,11],'pelog (Bali)':[0,1,3,7,8],'slendro (Java)':[0,2,5,7,9]};
// samay: the raga follows the real hour of the day
function ragaNow(){const h=new Date().getHours();
  const m=h<4?['raga Darbari','raga Malkauns']:h<7?['raga Bhairav','raga Todi']:h<10?['raga Todi','raga Bilawal','raga Bhairav']:h<13?['raga Bilawal','raga Bhupali']:h<16?['raga Bhimpalasi','raga Kafi']:h<18?['raga Bhimpalasi','raga Marwa']:h<20?['raga Marwa','raga Purvi','raga Yaman']:h<22?['raga Yaman','raga Bhupali']:['raga Darbari','raga Malkauns','raga Kafi'];
  return R()<.75?pick(m):pick(Object.keys(RAGAS))}
const S={root:38,scaleName:'dorian',scale:WEST.dorian,scene:0,color:'ambient'};
const deg=(d,base)=>{const sc=S.scale,n=sc.length,o=Math.floor(d/n),i=((d%n)+n)%n;return base+sc[i]+12*o};
const paInt=()=>S.scale.includes(7)?7:S.scale.includes(5)?5:S.scale[S.scale.length-1];

/* scene colours: what each scene leans towards */
const COLORS={
  ambient:{w:.27,scales:WEST,ia:{ambient:.5,drone:.2,nature:.12,piano:.08,indian:.05,japan:.05},
    prob:{drone:.8,loops:.7,arp:.1,phase:.08,data:.6,radio:.5,archive:.6,grains:.45,tanpura:.05,piano:.2,voices:.3,net:.4,hum:.35,city:.4,bigdrone:.35,nature:.35,sho:.1,airwaves:.3}},
  indian:{w:.2,raga:true,ia:{indian:.8,drone:.1,ambient:.1},
    prob:{drone:.25,loops:.2,data:.35,radio:.4,archive:.7,grains:.35,tanpura:.95,alap:.7,piano:.08,voices:.2,net:.15,hum:.1,city:.2,bigdrone:.2,nature:.2,airwaves:.2}},
  piano:{w:.18,scales:PIANOSC,ia:{piano:.75,ambient:.15,nature:.1},
    prob:{drone:.45,loops:.35,phase:.06,data:.35,radio:.35,archive:.65,grains:.4,piano:.95,voices:.25,net:.25,hum:.3,city:.3,bigdrone:.15,nature:.3,airwaves:.3}},
  east:{w:.18,scales:EAST,ia:{japan:.45,pacific:.35,nature:.1,ambient:.1},
    prob:{drone:.3,loops:.25,data:.3,radio:.35,archive:.7,grains:.35,piano:.05,voices:.15,net:.15,hum:.1,city:.15,bigdrone:.2,nature:.5,flute:.7,koto:.5,sho:.5,gamelan:.45,airwaves:.2}},
  mixed:{w:.17,raga:true,ia:{ambient:.25,indian:.2,piano:.2,japan:.15,pacific:.1,drone:.1},
    prob:{drone:.6,loops:.4,data:.45,radio:.4,archive:.65,grains:.5,tanpura:.6,alap:.3,piano:.6,voices:.35,net:.35,hum:.3,city:.4,bigdrone:.3,nature:.35,flute:.2,koto:.2,sho:.2,gamelan:.2,airwaves:.35}}
};
const BASE={drone:.9,loops:.8,arp:.4,phase:.35,data:.65,radio:.6,archive:.65,grains:.6,tanpura:.75,alap:.65,piano:.85,voices:.7,net:.8,hum:.7,city:.65,bigdrone:.75,nature:.7,flute:.6,koto:.6,sho:.55,gamelan:.6,airwaves:.55};
const RHYTHMIC=['arp','phase'];

let ctx,master,reverb,delayIn,noiseBuf,rider,masterAn,meterSink,running=false;const LA={};const L={},T={};
const nowEl=document.getElementById('now'),stage=document.getElementById('stage'),ruler=document.getElementById('r'),msgEl=document.getElementById('msg');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
/* what is sounding right now, in red, as large as possible: one line per sound (like SLOGAN).
   Long-lasting sounds keep their line until they end; short events (an edit, a ping) share one line. */
const live=new Map();let liveId=0,flash=null;
const clip=t=>{t=String(t).replace(/\s+/g,' ').trim();return t.length>46?t.slice(0,45).trim()+'…':t};
function log(k,t,liveSec){
  const text=clip(k+' · '+t);
  if(liveSec===0){msgEl.textContent=text;return null}
  if(liveSec>0&&liveSec<5){flash={text,until:performance.now()+liveSec*1000};render();setTimeout(render,liveSec*1000+50);return null}
  const id=++liveId;live.set(id,text);render();
  if(liveSec>0)setTimeout(()=>unlive(id),liveSec*1000);
  return id;
}
const unlive=id=>{if(id!=null&&live.delete(id))render()};
function render(){
  const items=[...live.values()];if(flash&&performance.now()<flash.until)items.push(flash.text);
  const W=innerWidth*.92,H=innerHeight*.8,cap=innerHeight*.22;
  let sz=items.map(t=>{ruler.textContent=t;return W/(ruler.getBoundingClientRect().width||1)*100});
  const tot=sz.reduce((a,x)=>a+Math.min(x,cap)*.8,0)+innerHeight*.012*Math.max(0,items.length-1);
  const f=Math.min(1,H/tot);sz=sz.map(x=>Math.min(x,cap)*f); // fill a lot, never everything
  const old=[...stage.children].map(d=>d.textContent);
  stage.textContent='';
  items.forEach((t,i)=>{const d=document.createElement('div');d.textContent=t;d.style.fontSize=sz[i]+'px';if(old.includes(t))d.style.animation='none';stage.appendChild(d)});
}
addEventListener('resize',render);if(document.fonts&&document.fonts.ready)document.fonts.ready.then(render);
async function fetchJSON(u,ms=12000){const c=new AbortController();const to=setTimeout(()=>c.abort(),ms);try{const r=await fetch(u,{signal:c.signal});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(to)}}

/* ============ audio graph ============ */
function impulse(sec,dec){const n=Math.floor(ctx.sampleRate*sec),b=ctx.createBuffer(2,n,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<n;i++)d[i]=(R()*2-1)*Math.pow(1-i/n,dec)}return b}
function setup(){
  ctx=new (window.AudioContext||window.webkitAudioContext)();
  const comp=ctx.createDynamicsCompressor();comp.threshold.value=-20;comp.knee.value=20;comp.ratio.value=3;comp.attack.value=.05;comp.release.value=.8;
  master=ctx.createGain();master.gain.value=0;master.connect(comp);
  // brickwall limiter + meter at the very end
  const lim=ctx.createDynamicsCompressor();lim.threshold.value=-6;lim.knee.value=0;lim.ratio.value=20;lim.attack.value=.003;lim.release.value=.25;
  rider=ctx.createGain();rider.gain.value=1;comp.connect(rider);rider.connect(lim);lim.connect(ctx.destination);
  masterAn=ctx.createAnalyser();masterAn.fftSize=2048;lim.connect(masterAn);
  meterSink=ctx.createGain();meterSink.gain.value=0;meterSink.connect(ctx.destination);masterAn.connect(meterSink);
  master.gain.setTargetAtTime(.9,ctx.currentTime,3);
  reverb=ctx.createConvolver();reverb.buffer=impulse(10,2.4);const rv=ctx.createGain();rv.gain.value=.75;reverb.connect(rv);rv.connect(master);
  delayIn=ctx.createGain();const dl=ctx.createDelay(4);dl.delayTime.value=.75;const fb=ctx.createGain();fb.gain.value=.5;const lp=ctx.createBiquadFilter();lp.frequency.value=2200;
  delayIn.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);const dOut=ctx.createGain();dOut.gain.value=.5;lp.connect(dOut);dOut.connect(master);dOut.connect(reverb);
  const mk=(n,wet,del,dry=1)=>{const g=ctx.createGain();g.gain.value=0;const dr=ctx.createGain();dr.gain.value=dry;g.connect(dr);dr.connect(master);const s=ctx.createGain();s.gain.value=wet;g.connect(s);s.connect(reverb);if(del){const d=ctx.createGain();d.gain.value=del;g.connect(d);d.connect(delayIn)}L[n]=g;T[n]=0;const an=ctx.createAnalyser();an.fftSize=2048;g.connect(an);an.connect(meterSink);LA[n]=an};
  mk('drone',.5,0);mk('loops',.8,.15);mk('arp',.6,.4);mk('phase',.6,.15);mk('data',.9,.2);mk('radio',.55,0);mk('archive',.6,.1);mk('grains',.8,.2);
  mk('tanpura',.45,0);mk('alap',.7,.2);mk('piano',.9,.05);
  mk('voices',1.6,.35,.25); // voices: mostly reverb = a far away room
  mk('netdry',0,0,1);mk('netdelay',.25,.9,.5);mk('netverb',2.2,0,.04); // internet sounds: dry, delayed or reflected
  mk('hum',.35,0,1);mk('city',.5,0,1);mk('bigdrone',.4,0);mk('nature',.3,0,1);mk('flute',.8,.2);mk('koto',.6,.15);mk('sho',.9,0);mk('gamelan',.7,.1);mk('airwaves',1.1,.2,.6);
  noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);{const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=R()*2-1}
}
function tone(f,t,dur,o){
  const osc=ctx.createOscillator();osc.type=o.type||'sine';osc.frequency.value=f;if(o.detune)osc.detune.value=o.detune;
  let n=osc;if(o.cutoff){const fl=ctx.createBiquadFilter();fl.type='lowpass';fl.frequency.value=o.cutoff;fl.Q.value=o.q||.7;n.connect(fl);n=fl}
  const g=ctx.createGain(),a=Math.min(o.attack||.01,dur*.5),p=o.gain||.1;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(p,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur);n.connect(g);n=g;
  if(o.pan!=null&&ctx.createStereoPanner){const pn=ctx.createStereoPanner();pn.pan.value=Math.max(-1,Math.min(1,o.pan));n.connect(pn);n=pn}
  n.connect(o.dest);osc.start(t);osc.stop(t+dur+.05);
}
const bell=(f,t,dur,gain,dest,pan)=>{tone(f,t,dur,{gain,attack:.004,dest,pan});tone(f*2.005,t,dur*.45,{gain:gain*.28,attack:.003,dest,pan});tone(f*3.99,t,dur*.18,{gain:gain*.12,attack:.002,dest,pan})};
const mallet=(f,t,gain,dest,pan,dur=2)=>{tone(f,t,dur,{gain,attack:.004,dest,pan});tone(f*4,t,.15,{gain:gain*.25,attack:.003,dest,pan})};
// soft piano: inharmonic partials, long sustain
function piano(f,t,vel,dest,pan){const B=.00035,dur=rr(6,10);for(let n=1;n<=7;n++){const fn=f*n*Math.sqrt(1+B*n*n);if(fn>11000)break;tone(fn,t,dur/(1+n*.55),{gain:vel/Math.pow(n,1.5),attack:.005,dest,pan,detune:rr(-2,2)})}}

/* ============ DRONE (Young, Radigue, Niblock) ============ */
const D={oscs:[],filter:null,lfo:null,ints:[0,7,12,19,24]};
function startDrone(){
  const f=ctx.createBiquadFilter();f.type='lowpass';f.frequency.value=700;f.Q.value=2;
  const lfo=ctx.createOscillator();lfo.frequency.value=.025;const lg=ctx.createGain();lg.gain.value=450;lfo.connect(lg);lg.connect(f.frequency);lfo.start();
  const out=ctx.createGain();out.gain.value=.11;f.connect(out);out.connect(L.drone);D.filter=f;D.lfo=lfo;
  ['sawtooth','triangle','sine','triangle','sine'].forEach((ty,i)=>{
    const o=ctx.createOscillator();o.type=ty;o.frequency.value=mtof(S.root+D.ints[i]);o.detune.value=rr(-7,7);
    const g=ctx.createGain();g.gain.value=.22;const tl=ctx.createOscillator();tl.frequency.value=rr(.008,.05);const tg=ctx.createGain();tg.gain.value=.18;tl.connect(tg);tg.connect(g.gain);tl.start();
    o.connect(g);let n=g;if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=[-.6,.6,-.3,.3,0][i];g.connect(p);n=p}n.connect(f);o.start();D.oscs.push(o);
  });
}
function retuneDrone(){
  const t=ctx.currentTime,sc=S.scale,pa=paInt(),third=sc[Math.min(2,sc.length-1)],top=sc[sc.length-1];
  D.ints=pick([[0,pa,12,pa+12,24],[0,12,pa+12,third+24,24],[0,pa,12,third+12,top+12]]);
  D.oscs.forEach((o,i)=>o.frequency.setTargetAtTime(mtof(S.root+D.ints[i]),t,6));
  D.filter.frequency.setTargetAtTime(rr(250,1300),t,8);
}

/* ============ LOOPS (Eno: incommensurable cycles) ============ */
let loops=[];
function newLoops(){
  loops.forEach(v=>clearTimeout(v.to));loops=[];
  for(let i=0,n=ri(5,7);i<n;i++){
    const v={d:ri(0,9),period:+rr(13,34).toFixed(1),pan:rr(-.8,.8),soft:R()<.55};
    const tick=()=>{if(T.loops>.01){const t=ctx.currentTime+.05,f=mtof(deg(v.d,S.root+24));
      if(v.soft)tone(f,t,rr(6,10),{type:'triangle',gain:.06,attack:rr(.8,2),cutoff:1500,dest:L.loops,pan:v.pan});else bell(f,t,rr(5,8),.065,L.loops,v.pan)}
      v.to=setTimeout(tick,v.period*1000)};
    v.to=setTimeout(tick,rr(0,v.period)*1000);loops.push(v);
  }
}

/* ============ sequencer (look-ahead) ============ */
const seqs=[];
setInterval(()=>{if(!running)return;const now=ctx.currentTime;for(const s of seqs){if(s.next<now)s.next=now+.05;while(s.next<now+.3){s.play(s.next);s.next+=s.interval()}}},60);

/* ============ ARP (Glass additive process) — slow and blurred ============ */
const A={pat:[0,2,4],k:1,dir:1,i:0,bpm:48,oct:2,sweep:40};
function newArp(){A.pat=Array.from({length:ri(4,7)},()=>ri(0,7));A.k=1;A.dir=1;A.i=0;A.bpm=rr(36,56);A.oct=pick([2,3]);A.sweep=rr(30,80)}
seqs.push({next:0,interval:()=>60/A.bpm/2,play:t=>{
  const sub=A.pat.slice(0,A.k),d=sub[A.i%sub.length];A.i++;
  if(A.i>=sub.length*2){A.i=0;A.k+=A.dir;if(A.k>=A.pat.length){A.k=A.pat.length;A.dir=-1}if(A.k<=1){A.k=1;A.dir=1}}
  if(T.arp<.01)return;
  const c=300+1600*(.5+.5*Math.sin(t*2*Math.PI/A.sweep));
  tone(mtof(deg(d,S.root+12*A.oct)),t,1.8,{type:'triangle',gain:.035,attack:.08,cutoff:c,q:3,dest:L.arp,pan:A.i%2?-.4:.4});
}});

/* ============ PHASE (Reich) — slow glass shimmer ============ */
const P={pat:[],iv:.34},pA={i:0},pB={i:0};
function newPhase(){const pool=shuffle([0,1,2,3,4,5,6]).slice(0,5);P.pat=Array.from({length:12},()=>pick(pool));P.iv=rr(.28,.4);pA.i=pB.i=0;if(ctx){const n=ctx.currentTime+.1;seqs[1].next=seqs[2].next=n}}
seqs.push({next:0,interval:()=>P.iv,play:t=>{const d=P.pat[pA.i++%12];if(T.phase>.01)mallet(mtof(deg(d,S.root+36)),t,.035,L.phase,-.6)}});
seqs.push({next:0,interval:()=>P.iv*.9965,play:t=>{const d=P.pat[pB.i++%12];if(T.phase>.01)mallet(mtof(deg(d,S.root+36)),t,.035,L.phase,.6)}});

/* ============ TANPURA (the drone of Indian classical music) ============ */
const TP={i:0};
function tanpuraPluck(f,t,g,pan){
  const dur=rr(5,7);
  [0,-4,4].forEach((dt,j)=>{
    const o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt+rr(-1,1);
    const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.Q.value=7; // jawari: a resonance sweeping up the harmonics
    bp.frequency.setValueAtTime(f*2,t);bp.frequency.linearRampToValueAtTime(f*rr(8,14),t+1.4);bp.frequency.exponentialRampToValueAtTime(f*3,t+dur);
    const gg=ctx.createGain();gg.gain.setValueAtTime(0,t);gg.gain.linearRampToValueAtTime(g*(j?.5:1),t+.012);gg.gain.exponentialRampToValueAtTime(.0001,t+dur);
    o.connect(bp);bp.connect(gg);let n=gg;if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=pan;gg.connect(p);n=p}n.connect(L.tanpura);o.start(t);o.stop(t+dur+.1);
  });
  tone(f,t,dur,{gain:g*.7,attack:.01,dest:L.tanpura,pan});
}
seqs.push({next:0,interval:()=>TP.i%4===0?rr(1.7,2.1):rr(1.15,1.4),play:t=>{
  const k=TP.i++%4;if(T.tanpura<.01)return;const sa=S.root+12;
  const m=[sa+paInt(),sa+12,sa+12,sa][k]; // Pa (or Ma/Ni) – Sa – Sa – low Sa
  tanpuraPluck(mtof(m),t,k===3?.08:.06,[-.35,.1,.25,-.1][k]);
}});

/* ============ ALAP: a slow raga line with meend (glides) ============ */
const AL={pos:0};
async function alapLoop(){
  while(true){
    if(T.alap<.01){await sleep(5000);continue}
    const t0=ctx.currentTime+.1,n=ri(3,7);
    const o1=ctx.createOscillator(),o2=ctx.createOscillator();o1.type='triangle';o2.type='sine';
    const vib=ctx.createOscillator();vib.frequency.value=rr(4.5,5.8);const vg=ctx.createGain();vg.gain.value=0;vib.connect(vg);vg.connect(o1.detune);vg.connect(o2.detune);
    const lp=ctx.createBiquadFilter();lp.frequency.value=1700;const g=ctx.createGain();g.gain.value=0;
    o1.connect(lp);o2.connect(lp);lp.connect(g);let out=g;if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=rr(-.3,.3);g.connect(p);out=p}out.connect(L.alap);
    const f0=mtof(deg(AL.pos,S.root+24));o1.frequency.setValueAtTime(f0,t0);o2.frequency.setValueAtTime(f0,t0);
    g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.06,t0+1.5);

function newScene(first){
  S.scene++;const prev=S.color;
  if(first||R()<.6){const w={};for(const k in COLORS)w[k]=COLORS[k].w;S.color=wpick(w)}
  const C=COLORS[S.color];
  if(first||S.color!==prev||R()<.45){
    S.root=36+ri(0,11);
    if(C.raga){S.scaleName=ragaNow();S.scale=RAGAS[S.scaleName]}else{S.scaleName=pick(Object.keys(C.scales));S.scale=C.scales[S.scaleName]}
    retuneDrone();
  }
  const on={};for(const k in BASE)on[k]=R()<(C.prob[k]||0);
  if(first){on.drone=on.loops=true;on.data=true}
  if(on.arp&&on.phase)on[R()<.5?'arp':'phase']=false;
  let cnt=Object.keys(on).filter(k=>on[k]&&!RHYTHMIC.includes(k)).length;
  const ks=shuffle(Object.keys(on).filter(k=>!RHYTHMIC.includes(k)&&(C.prob[k]||0)>.05));
  while(cnt<3){const k=ks.find(k=>!on[k]);if(!k)break;on[k]=true;cnt++}
  // never too many things at once: at most 6 layers per scene, plus the drone and the live data
  {const act=shuffle(Object.keys(on).filter(k=>on[k]&&k!=='data'&&k!=='drone'));const MAX=6;while(act.length>MAX)on[act.pop()]=false}
  if(on.arp&&(!T.arp||R()<.5))newArp();
  if(on.phase&&!T.phase)newPhase();
  if(R()<.3)newLoops();
  for(const k in on){const v=on[k]?BASE[k]*rr(.6,1):0;T[k]=v;
    (k==='net'?['netdry','netdelay','netverb']:[k]).forEach(n=>L[n].gain.setTargetAtTime(v,ctx.currentTime,on[k]?9:7))}
  const act=Object.keys(on).filter(k=>on[k]);
  const key=C.raga?`Sa = ${NOTES[S.root%12]} · ${S.scaleName}`:`${NOTES[S.root%12]} ${S.scaleName}`;
  nowEl.textContent=`scene ${S.scene} · ${S.color} · ${key} · ${act.join(' · ')}`;
  log('SCENE '+S.scene,`${S.color} — ${key} — ${act.join(', ')}`,0);
  setTimeout(()=>newScene(false),rr(80,170)*1000);
}

/* ============ RHYTHM FILTER ============
   every stream/file is first listened to in silence for 7 seconds;
   if it has too many attacks or a regular pulse, it is slowed to 25-50% and blurred.
   While playing it keeps being checked: if it becomes rhythmic it is slowed down. */
function score(e){
  const n=e.length;if(n<30)return{rate:0,ac:0,mean:0};
  let mean=0;for(const x of e)mean+=x;mean/=n;
  const fl=[];for(let i=1;i<n;i++)fl.push(Math.max(0,e[i]-e[i-1]));
  let on=0;for(let i=1;i<fl.length-1;i++)if(fl[i]>3.5&&fl[i]>=fl[i-1]&&fl[i]>=fl[i+1])on++;
  const m=fl.reduce((a,b)=>a+b,0)/fl.length,f=fl.map(x=>x-m);let e0=0;for(const x of f)e0+=x*x;e0=e0||1e-9;
  let ac=0;for(let lag=5;lag<=30;lag++){let s=0;for(let i=0;i+lag<f.length;i++)s+=f[i]*f[i+lag];ac=Math.max(ac,s/e0)}
  return{rate:on/(n/20),ac,mean};
}
function judge(F,H){const a=score(F),b=score(H),rate=Math.max(a.rate,b.rate),ac=Math.max(a.ac,b.ac),silent=F.length>=30&&a.mean<-58;
  return{ok:!silent&&rate<1.6&&!(ac>.4&&rate>1.0),silent,rate,ac}}

/* ============ media player (live streams + archive files) ============ */
function playMedia(url,o){return new Promise(resolve=>{

  const el=new Audio();el.preload='auto';el.crossOrigin='anonymous';
  el.preservesPitch=false;el.mozPreservesPitch=false;el.webkitPreservesPitch=false;
  let src;try{src=ctx.createMediaElementSource(el)}catch(e){resolve(false);return}
  nodes.push(src);let n=src;
  const blur=ctx.createBiquadFilter();blur.type='lowpass';blur.frequency.value=20000;n.connect(blur);n=blur;nodes.push(blur);
  if(o.filter){const f=ctx.createBiquadFilter();f.type=o.filter.type||'lowpass';f.frequency.value=o.filter.freq;f.Q.value=o.filter.q||.7;n.connect(f);n=f;nodes.push(f)}

  const g=ctx.createGain();g.gain.value=0;n.connect(g);nodes.push(g);let m=g;
  if(o.pan&&ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=o.pan;g.connect(p);m=p;nodes.push(p)}
  m.connect(o.dest);

  src.connect(aF);src.connect(hp);hp.connect(aH);aF.connect(sink);aH.connect(sink);sink.connect(ctx.destination);nodes.push(aF,aH,hp,sink);
  const buf=new Float32Array(1024),db=a=>{a.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++)s+=buf[i]*buf[i];return 10*Math.log10(s/buf.length+1e-12)};
  let F=[],H=[],t0=0,lastEval=0;
  let total=o.fadeIn+o.hold+o.fadeOut;const lvl=o.level||1,AUD=7000;
  // rhythmic material is not thrown away: it is slowed right down and blurred
  let slowed=false;
  const slowDown=(v,mid)=>{if(slowed)return;slowed=true;const target=pick([.5,.4,.33,.25]),from=el.playbackRate||1,steps=15;
    for(let i=1;i<=steps;i++)setTimeout(()=>{try{el.playbackRate=from+(target-from)*i/steps}catch(_){}},i*200);
    blur.frequency.setTargetAtTime(rr(700,1600),ctx.currentTime,1.5);o.onSlow&&o.onSlow(v,target,mid)};
  const fin=ok=>{if(done)return;done=true;clearTimeout(startT);clearTimeout(stopT);clearInterval(an);try{el.pause();el.removeAttribute('src');el.load()}catch(_){}
    nodes.forEach(x=>{try{x.disconnect()}catch(_){}});o.onEnd&&o.onEnd(ok);resolve(ok)};
  const fadeAway=sec=>{const t=ctx.currentTime;g.gain.cancelScheduledValues(t);g.gain.setValueAtTime(g.gain.value,t);g.gain.linearRampToValueAtTime(0,t+sec);clearTimeout(stopT);setTimeout(()=>fin(true),sec*1000+300)};
  // files: always leave room for the whole fade-in / hold / fade-out, so nothing ever ends dry
  el.addEventListener('loadedmetadata',()=>{
    if(isFinite(el.duration)&&el.duration>0){const r=o.rate||1,avail=el.duration/r-AUD/1000-4;
      if(total>avail&&avail>0){const k=avail/total;o.fadeIn=Math.max(3,o.fadeIn*k);o.fadeOut=Math.max(3,o.fadeOut*k);o.hold=Math.max(2,avail-o.fadeIn-o.fadeOut);total=o.fadeIn+o.hold+o.fadeOut}
      const need=(total+AUD/1000+4)*r;if(o.seek&&el.duration>need+5){try{el.currentTime=rr(0,el.duration-need)}catch(e){}}}
    if(o.rate)el.playbackRate=o.rate});
  el.addEventListener('playing',()=>{
    if(started)return;started=true;clearTimeout(startT);t0=performance.now();
    an=setInterval(()=>{
      F.push(db(aF));H.push(db(aH));const now=performance.now();
      if(!passed&&now-t0>AUD){
        const v=o.noJudge?{ok:F.length<30||score(F).mean>-58}:judge(F,H);
        if(!v.ok){if(v.silent){fin(false);return}slowDown(v,false)}
        passed=true;F=[];H=[];lastEval=now;o.onStart&&o.onStart();
        const t=ctx.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(lvl,t+o.fadeIn);g.gain.setValueAtTime(lvl,t+o.fadeIn+o.hold);g.gain.linearRampToValueAtTime(0,t+total);
        stopT=setTimeout(()=>fin(true),total*1000+400);
      }else if(passed&&!o.noJudge&&now-lastEval>AUD){
        const v=judge(F,H);F=[];H=[];lastEval=now;
        if(!v.ok&&!v.silent)slowDown(v,true)
      }
    },50);
  });
  el.addEventListener('error',()=>fin(started&&passed));
  el.addEventListener('ended',()=>fin(passed));
  el.src=url;el.play().catch(()=>{});
  startT=setTimeout(()=>{if(!started)fin(false)},15000);
})}

/* ============ GRAINS: new music from the dust of old tracks ============ */
async function fetchHead(url,max){
  const c=new AbortController(),to=setTimeout(()=>c.abort(),25000);
  try{const r=await fetch(url,{signal:c.signal});if(!r.ok)throw new Error(r.status);const rd=r.body.getReader(),chunks=[];let n=0;
    while(n<max){const {done,value}=await rd.read();if(done)break;chunks.push(value);n+=value.length}
    try{c.abort()}catch(e){}
    const out=new Uint8Array(n);let o=0;for(const ch of chunks){out.set(ch,o);o+=ch.length}return out.buffer;
  }finally{clearTimeout(to)}
}
async function grainsDeck(){
  let fails=0;
  while(true){
    if(T.grains<.01){await sleep(8000);continue}
    const it=await iaNext(catNow());if(!it){fails++;await sleep(fails>8?30000:2000);continue}
    let buf=null;try{buf=await ctx.decodeAudioData(await fetchHead(it.url,2000000))}catch(e){buf=null}
    if(!buf||buf.duration<4){fails++;await sleep(fails>8?30000:1500);continue}
    fails=0;
    const dur=rr(60,140),t0=ctx.currentTime,end=t0+dur,drift=rr(-.05,.05),dens=rr(.06,.16);
    const line=log('GRAINS',`new music from the dust of “${it.title}”`,dur);
    const rates=S.scale.map(s=>Math.pow(2,(s-12)/12)).concat([.5,1]);let pos=rr(0,buf.duration-3);
    const dg=ctx.createGain();dg.gain.setValueAtTime(0,t0);dg.gain.linearRampToValueAtTime(1,t0+12);dg.gain.setValueAtTime(1,end-12);dg.gain.linearRampToValueAtTime(0,end);dg.connect(L.grains);
    while(ctx.currentTime<end){
      const t=ctx.currentTime+.03,gd=rr(.2,.8),src=ctx.createBufferSource();src.buffer=buf;src.playbackRate.value=pick(rates);
      const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.2,t+gd/2);g.gain.linearRampToValueAtTime(0,t+gd);
      src.connect(g);let n=g;if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=rr(-.9,.9);g.connect(p);n=p}n.connect(dg);
      pos=Math.min(buf.duration-1,Math.max(0,pos+drift+rr(-.15,.15)));src.start(t,pos,gd*2);
      await sleep(dens*1000*rr(.6,1.4));
    }
    unlive(line);setTimeout(()=>dg.disconnect(),2000);await sleep(rr(0,8000));
  }
}

/* ============ INTERNET & PHONE SOUNDS: notifications, rings, dial tones, modems ============ */
function noise(t,dur,o){const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=ctx.createBiquadFilter();f.type=o.type||'bandpass';f.frequency.setValueAtTime(o.freq,t);if(o.to)f.frequency.exponentialRampToValueAtTime(o.to,t+dur);f.Q.value=o.q||1;
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(o.gain,t+(o.attack||.01));g.gain.setValueAtTime(o.gain,t+Math.max(.02,dur-(o.release||.05)));g.gain.linearRampToValueAtTime(0,t+dur);
  s.connect(f);f.connect(g);g.connect(o.dest);s.start(t,rr(0,1.5));s.stop(t+dur+.05);return g}
const beep=(fs,t,dur,gain,dest,type='sine')=>fs.forEach(f=>{const o=ctx.createOscillator();o.type=type;o.frequency.value=f;const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(gain,t+.008);g.gain.setValueAtTime(gain,t+dur-.01);g.gain.linearRampToValueAtTime(0,t+dur);o.connect(g);g.connect(dest);o.start(t);o.stop(t+dur+.02)});
const DTMF={1:[697,1209],2:[697,1336],3:[697,1477],4:[770,1209],5:[770,1336],6:[770,1477],7:[852,1209],8:[852,1336],9:[852,1477],0:[941,1336]};
const tuned=(raw)=>R()<.5?raw:mtof(deg(ri(0,7),S.root+48)); // sometimes the notification is in the scene's key
const NET={
  'ta-tan':d=>{const f=tuned(pick([880,988,1047,1175,1319])),iv=Math.pow(2,pick([4,5,7,12])/12),t=ctx.currentTime+.05;mallet(f,t,.09,d,rr(-.5,.5),.8);mallet(f*iv,t+rr(.1,.16),.09,d,rr(-.5,.5),1.2)},
  'message':d=>{const f=tuned(pick([1047,1319,1568])),t=ctx.currentTime+.05;bell(f,t,1.2,.07,d,rr(-.4,.4))},
  'three notes':d=>{const f=tuned(pick([784,880,1047])),t=ctx.currentTime+.05;[0,4,7].forEach((s,i)=>mallet(f*Math.pow(2,s/12),t+i*.09,.07,d,0,.7))},
  'uh-oh':d=>{const f=tuned(pick([700,820,900])),t=ctx.currentTime+.05;tone(f,t,.22,{type:'square',gain:.04,attack:.01,cutoff:2500,dest:d});tone(f*.75,t+.25,.35,{type:'square',gain:.04,attack:.01,cutoff:2500,dest:d})},
  'pop':d=>{const t=ctx.currentTime+.05,o=ctx.createOscillator();o.frequency.setValueAtTime(rr(800,1300),t);o.frequency.exponentialRampToValueAtTime(rr(180,320),t+.07);const g=ctx.createGain();g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.0001,t+.12);o.connect(g);g.connect(d);o.start(t);o.stop(t+.15)},
  'whoosh (sent)':d=>{const t=ctx.currentTime+.05;noise(t,.6,{freq:400,to:rr(3000,6000),q:2,gain:.08,attack:.2,release:.3,dest:d})},
  'group chat':d=>{const n=ri(3,6);for(let i=0;i<n;i++)setTimeout(()=>NET[pick(['ta-tan','message','pop'])](d),i*rr(500,1600))},
  'dial tone (IT)':d=>{beep([425],ctx.currentTime+.05,rr(2,4),.05,d)},
  'busy tone':d=>{const t=ctx.currentTime+.05;for(let i=0;i<6;i++)beep([425],t+i*.4,.2,.05,d)},
  'ringback (IT)':d=>{const t=ctx.currentTime+.05;beep([425],t,1,.05,d);beep([425],t+5,1,.05,d)},
  'ring (US)':d=>{const t=ctx.currentTime+.05;beep([440,480],t,2,.035,d)},
  'double ring (UK)':d=>{const t=ctx.currentTime+.05;for(let k=0;k<2;k++){beep([400,450],t+k*3,.4,.035,d);beep([400,450],t+k*3+.6,.4,.035,d)}},

  'old bell phone':d=>{const t=ctx.currentTime+.05;for(let k=0;k<2;k++)for(let i=0;i<30;i++){const tt=t+k*3+i*.05;[1,2.76,5.4].forEach((p,j)=>tone(1100*p,tt,.08,{gain:.03/(j+1),attack:.002,dest:d}))}},

function drops(t0,dur,d,rate){const end=t0+dur;const step=()=>{if(ctx.currentTime>end-1)return;const t=ctx.currentTime+.05;
  for(let i=0,n=Math.round(rate*.25*rr(.5,1.5));i<n;i++)noise(t+rr(0,.25),.02,{freq:rr(2000,7000),q:4,gain:rr(.02,.08),attack:.001,release:.015,dest:d});setTimeout(step,250)};step()}
function bubbles(t0,dur,d,rate){const end=t0+dur;const step=()=>{if(ctx.currentTime>end-1)return;const t=ctx.currentTime+.05;
  for(let i=0,n=Math.round(rate*.25*rr(.3,1.7));i<n;i++){const tt=t+rr(0,.25),f=rr(300,1100),o=ctx.createOscillator();o.frequency.setValueAtTime(f,tt);o.frequency.exponentialRampToValueAtTime(f*rr(1.5,2.6),tt+rr(.03,.07));
    const g=ctx.createGain();g.gain.setValueAtTime(rr(.01,.035),tt);g.gain.exponentialRampToValueAtTime(.0001,tt+.08);o.connect(g);g.connect(d);o.start(tt);o.stop(tt+.1)}setTimeout(step,250)};step()}

  s.connect(f);f.connect(g);g.connect(d);s.start(t0);s.stop(t+.1)}
function wind(t0,dur,d){const s=ctx.createBufferSource();s.buffer=noiseBuf;s.loop=true;const f=ctx.createBiquadFilter();f.type='bandpass';f.Q.value=rr(2,5);const g=ctx.createGain();g.gain.setValueAtTime(0,t0);f.frequency.setValueAtTime(400,t0);

      const vib=ctx.createOscillator();vib.frequency.value=rr(4,5.5);const vg=ctx.createGain();vg.gain.setValueAtTime(0,t);vg.gain.linearRampToValueAtTime(R()<.6?rr(8,20):0,t+dur*.8);vib.connect(vg);vg.connect(o.detune);vg.connect(o2.detune);
      const lp=ctx.createBiquadFilter();lp.frequency.value=1500;const o2g=ctx.createGain();o2g.gain.value=.4;o2.connect(o2g);o2g.connect(lp);
      const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05,t+dur*.25);g.gain.linearRampToValueAtTime(.033,t+dur*.6);g.gain.linearRampToValueAtTime(.045,t+dur*.8);g.gain.linearRampToValueAtTime(0,t+dur);
      o.connect(g);lp.connect(g);let out=g;if(ctx.createStereoPanner){const p=ctx.createStereoPanner();p.pan.value=rr(-.3,.3);g.connect(p);out=p}out.connect(L.flute);
      noise(t,dur,{freq:f*2,q:jp?1.5:.7,gain:jp?.012:.025,attack:dur*.25,release:dur*.4,dest:L.flute}); // breath
      [o,o2,vib].forEach(x=>{x.start(t);x.stop(t+dur+.1)});
      t+=dur+rr(.4,2.8); // ma: the silence between
    }
    log(name,`${S.scaleName} · ${n} breaths`,t-t0);
    await sleep((t-ctx.currentTime+rr(5,15))*1000);
  }
}
function kotoPluck(f,t,pan){tone(f,t,rr(2.5,4),{type:'triangle',gain:.06,attack:.002,dest:L.koto,pan});tone(f*2,t,.8,{gain:.025,attack:.002,dest:L.koto,pan});tone(f*3.01,t,.3,{gain:.012,attack:.001,dest:L.koto,pan});noise(t,.015,{freq:3000,q:1,gain:.03,attack:.001,release:.01,dest:L.koto});
  if(R()<.25)tone(f*Math.pow(2,pick([1,2])/12),t+rr(.4,.8),2,{type:'triangle',gain:.025,attack:.15,dest:L.koto,pan})} // oshide: the pressed bend
async function kotoLoop(){
  await sleep(12000);
  while(true){
    if(T.koto<.01){await sleep(5000);continue}
    const n=ri(2,6),t0=ctx.currentTime+.1;let t=t0,pos=ri(0,7);
    for(let k=0;k<n;k++){pos=Math.max(0,Math.min(12,pos+pick([-2,-1,1,2,3,-3])));const f=mtof(deg(pos,S.root+24)),pan=rr(-.5,.5);kotoPluck(f,t,pan);if(R()<.2)kotoPluck(f*2,t+.02,-pan);t+=rr(.35,1.6)}
    log('KOTO',`${S.scaleName} · ${n} plucks`,t-t0+2);
    await sleep((t-ctx.currentTime+rr(4,14))*1000);
  }
}
function templeBell(t){const f=mtof(S.root-12+pick([0,paInt()]))*2,dur=rr(14,22);
  [1,2,2.76,4.07,5.4].forEach((p,i)=>{tone(f*p,t,dur/(1+i*.5),{gain:.09/(i+1),attack:.005,dest:L.sho,detune:rr(-4,4)});tone(f*p*1.003,t,dur/(1+i*.5),{gain:.05/(i+1),attack:.005,dest:L.sho})});
  setTimeout(()=>log('TEMPLE BELL',`bonsho · ${NOTES[S.root%12]}`,12),Math.max(0,(t-ctx.currentTime)*1000))}
async function shoLoop(){
  await sleep(6000);
  while(true){
    if(T.sho<.01){await sleep(6000);continue}
    const t=ctx.currentTime+.1,hold=rr(8,16),dur=hold+8,degs=shuffle([0,1,2,3,4,5,6]).slice(0,ri(4,6));
    const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(1,t+4);g.gain.setValueAtTime(1,t+4+hold);g.gain.linearRampToValueAtTime(0,t+dur);g.connect(L.sho);
    degs.forEach(dd=>{const f=mtof(deg(dd,S.root+48));[['sine',.022],['triangle',.01]].forEach(([ty,gn])=>{const o=ctx.createOscillator();o.type=ty;o.frequency.value=f;o.detune.value=rr(-6,6);const og=ctx.createGain();og.gain.value=gn;o.connect(og);og.connect(g);o.start(t);o.stop(t+dur+.1)})});
    log('SHŌ',`${degs.length}-note cluster (aitake) · ${S.scaleName}`,dur);
    if(R()<.3)templeBell(t+dur*.5);
    setTimeout(()=>{try{g.disconnect()}catch(e){}},(dur+2)*1000);
    await sleep((dur+rr(6,20))*1000);
  }
}
function gongAgeng(t){const f=mtof(S.root-12);tone(f,t,18,{gain:.16,attack:.02,dest:L.gamelan});tone(f+1.2,t,18,{gain:.12,attack:.02,dest:L.gamelan});tone(f*2.01,t,9,{gain:.05,attack:.01,dest:L.gamelan});tone(f*2.95,t,5,{gain:.02,attack:.01,dest:L.gamelan})}
const metallo=(f,t,gain,pan)=>{bell(f,t,rr(3,5),gain,L.gamelan,pan);bell(f+rr(3,7),t,rr(3,5),gain*.8,L.gamelan,-pan)}; // ombak: the beating of paired instruments
async function gamelanLoop(){
  await sleep(10000);
  while(true){
    if(T.gamelan<.01){await sleep(6000);continue}
    const n=ri(4,10),beat=rr(1.6,3.2),t0=ctx.currentTime+.1;let t=t0,pos=ri(0,4);
    gongAgeng(t);
    for(let k=0;k<n;k++){pos=Math.max(0,Math.min(9,pos+pick([-1,1,-2,2,1,-1])));metallo(mtof(deg(pos,S.root+36)),t,.045,rr(-.6,.6));if(R()<.3)metallo(mtof(deg(pos,S.root+48)),t+beat/2,.025,rr(-.6,.6));t+=beat*rr(.9,1.15)}
    log('GAMELAN',`${S.scaleName} · slow irama · ${n} strokes`,t-t0);
    await sleep((t-ctx.currentTime+rr(4,14))*1000);
  }
}

/* ============ AIRWAVES: any live radio in the world, through a heavy radio filter ============
   news, talk, music from anywhere — squeezed into a narrow, distorted band, with static,
   left underneath as a carpet (Cage, Imaginary Landscape No. 4) */
let airPool=[];
async function nextAir(){
  for(let tries=0;tries<3&&!airPool.length;tries++){for(const h of shuffle(RB.slice())){try{
    const j=await fetchJSON(`${h}/json/stations/search?hidebroken=true&order=random&limit=100&is_https=true`);
    airPool=shuffle(j.filter(s=>s.url_resolved&&!s.hls&&(location.protocol!=='https:'||s.url_resolved.startsWith('https:'))));break}catch(e){}}}
  return airPool.pop();
}
function radioChain(){
  const hp=ctx.createBiquadFilter();hp.type='highpass';hp.frequency.value=rr(350,600);hp.Q.value=1.2;
  const bp=ctx.createBiquadFilter();bp.type='bandpass';bp.frequency.value=rr(800,1700);bp.Q.value=rr(1.2,3);
  const sh=ctx.createWaveShaper(),k=rr(2,7),c=new Float32Array(1024);for(let i=0;i<1024;i++){const x=i/512-1;c[i]=Math.tanh(k*x)/Math.tanh(k)}sh.curve=c;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=rr(2200,3400);
  const mk=ctx.createGain();mk.gain.value=.7;
  // the band drifts slowly, like a dial that is never quite tuned
  const lfo=ctx.createOscillator();lfo.frequency.value=rr(.02,.08);const lg=ctx.createGain();lg.gain.value=rr(150,450);lfo.connect(lg);lg.connect(bp.frequency);lfo.start();
  return{nodes:[hp,bp,sh,lp,mk],lfo};
}
function tuning(t,d){const o=ctx.createOscillator();o.frequency.setValueAtTime(rr(2500,4500),t);o.frequency.exponentialRampToValueAtTime(rr(300,900),t+rr(1.5,3));
  const g=ctx.createGain();g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.012,t+.3);g.gain.linearRampToValueAtTime(0,t+3);o.connect(g);g.connect(d);o.start(t);o.stop(t+3.1);
  noise(t,3,{freq:1500,q:.6,gain:.04,attack:.1,release:1.5,dest:d})}
async function airDeck(){
  await sleep(rr(20,60)*1000);let fails=0;
  while(true){
    if(T.airwaves<.01){await sleep(8000);continue}
    const s=await nextAir();if(!s){await sleep(20000);continue}
    const ch=radioChain(),rate=pick([1,1,1,.9,.8]),hold=rr(90,240),fi=rr(15,25),fo=rr(20,30),name=(s.name||'').trim();let line=null,hiss=null;
    const ok=await playMedia(s.url_resolved,{dest:L.airwaves,fadeIn:fi,hold,fadeOut:fo,rate,chain:ch.nodes,level:.9,pan:rr(-.6,.6),
      onStart:()=>{const t=ctx.currentTime;tuning(t,L.airwaves);
        hiss=noise(t,fi+hold+fo,{freq:rr(2500,5000),q:.5,gain:.025,attack:fi,release:fo,dest:L.airwaves}); // static
        line=log('RADIO · AIR',`${name} · ${[s.country,s.language].filter(Boolean).join(' · ')} · through a radio filter${slowTag(rate)}`)},
      onSlow:slowLog('air',name),onEnd:()=>{unlive(line);try{ch.lfo.stop()}catch(e){}}});
    if(!ok){try{ch.lfo.stop()}catch(e){}}
    fails=ok?0:fails+1;await sleep(ok?rr(10,60)*1000:fails>8?30000:1500);
  }
}

/* ============ VOLUME GUARDIAN ============
   listens to the whole mix and to every layer. If the total stays too loud for ~2 seconds,
   the loudest layer is faded out. A slow "rider" also keeps the overall level even. */
const vbuf=new Float32Array(2048);
const rmsDb=an=>{an.getFloatTimeDomainData(vbuf);let s=0;for(let i=0;i<vbuf.length;i++)s+=vbuf[i]*vbuf[i];return 10*Math.log10(s/vbuf.length+1e-12)};
let over=0,cool=0,smooth=-30;
function guardian(){
  if(!running)return;
  const db=rmsDb(masterAn);smooth=smooth*.9+db*.1;
  // slow rider: aim for about -20 dB RMS
  const target=smooth>-17?.65:smooth>-19?.85:smooth<-26?1.15:1;
  rider.gain.setTargetAtTime(Math.max(.4,Math.min(1.2,rider.gain.value*(target<1?.97:target>1?1.01:1))),ctx.currentTime,.5);
  if(cool>0){cool--;return}
  over=db>-14?over+1:Math.max(0,over-1);
  if(over>=8){
    const lv={};for(const n in LA){const k=n.startsWith('net')?'net':n;if(T[k]>.01)lv[k]=Math.max(lv[k]??-200,rmsDb(LA[n]))}
    const loud=Object.keys(lv).filter(k=>k!=='drone').sort((a,b)=>lv[b]-lv[a])[0];
    if(loud){T[loud]=0;(loud==='net'?['netdry','netdelay','netverb']:[loud]).forEach(n=>L[n].gain.setTargetAtTime(0,ctx.currentTime,2.5));
      log('VOLUME',`too much at once (${db.toFixed(1)} dB) → ${loud} fades out`,0)}
    over=0;cool=40; // wait 10 s before acting again
  }
}
setInterval(guardian,250);

  log('AMBIENET','listening to the internet…',0);

  startWiki();pollQuakes(true);startBTC();setTimeout(breathe,8000);
  setTimeout(pianoTick,3000);alapLoop();
  radioDeck(3000);radioDeck(50000);archiveDeck(1000);archiveDeck(40000);grainsDeck();voicesDeck();netLoop();humLoop();fieldDeck('city','city','CITY');fieldDeck('nature','nature','NATURE · ARCHIVE');bigDroneLoop();natureLoop();fluteLoop();kotoLoop();shoLoop();gamelanLoop();airDeck();
});
document.addEventListener('keydown',e=>{if(e.key==='f'){document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}});
